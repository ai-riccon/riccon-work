name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 校验测试栈编排
        run: docker compose -f deploy/compose/docker-compose.test.yml config

      - name: 启动测试依赖
        run: docker compose -f deploy/compose/docker-compose.test.yml up -d --wait

      - name: 构建与测试
        run: ./mvnw -q -T1C verify

      - name: 代码格式检查
        run: ./mvnw -q spotless:check

      - name: 失败时导出依赖日志
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.test.yml logs --no-color

      - name: 清理测试依赖
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v

  # 前端 job 由 TASK-0003 在 apps/web 建立后补充；当前合同的前端命令尚未可复现。
