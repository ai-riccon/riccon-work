name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 校验测试栈编排
        run: docker compose -f deploy/compose/docker-compose.test.yml config

      - name: 启动测试依赖
        run: docker compose -f deploy/compose/docker-compose.test.yml up -d --wait

      - name: 构建与测试
        run: ./mvnw -q -T1C verify

      - name: 代码格式检查
        run: ./mvnw -q spotless:check

      - name: 失败时导出依赖日志
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.test.yml logs --no-color

      - name: 清理测试依赖
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v

  frontend:
    name: 前端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段锁定为 pnpm@10.34.9；
        # 同时传 version 会触发 action 的版本冲突检查，因此这里不重复声明。

      - name: 安装 Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -w typecheck

      - name: 代码规范与格式检查
        run: pnpm -w lint

      - name: 单元测试
        run: pnpm -w test

      - name: 构建
        run: pnpm -w build

      - name: 安装 Playwright Chromium
        run: pnpm -w exec playwright install --with-deps chromium

      - name: E2E 与可访问性
        run: pnpm -w e2e

      - name: 上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
