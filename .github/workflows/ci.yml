name: ci

on:
  push:
    branches: [main]
  pull_request:
  # M04 perf 门禁：nightly 定期 + 发布前手动触发（workflow_dispatch）。
  # 本地 `node scripts/real-stack/run.mjs --mode=perf` 只算预检，不得替代 CI/nightly 证据。
  schedule:
    - cron: "0 18 * * *" # 北京时间次日 02:00
  workflow_dispatch:
    inputs:
      reason:
        description: "触发原因（发布前必跑时填写发版单号）"
        required: false
        default: "pre-release"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # M19 P2：后端测试拆成 4 个分片并行，只做快速反馈；模块 gate 仍在本机/verifier 跑
  # canonical `./mvnw -q -T1C verify jacoco:report`（commands.test 不变）。
  # 分片集合来自 scripts/test-shards-baseline.json；每片跑“除其他 3 片之外的所有类”，
  # 未登记的新测试类会在所有分片执行，由 backend-merge 以重复类/额外类失败，不会静默漏跑。
  backend-shards:
    name: 后端测试分片 ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # 每个分片独立 namespace（≤30 字符，满足 test-services.mjs 校验），复用本 job 的 compose
    # 热栈；迁移/回滚/schema 测试仍各自启动一次性容器，不受 external 影响。
    env:
      RICCON_TEST_SERVICES: external
      RICCON_TEST_SERVICES_NAMESPACE: ci-${{ github.run_id }}-b${{ matrix.shard }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 安装 Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      # 先校验基线：4 片互斥完整、源码测试类均已登记。测试集合变更未重建基线时在这里快速失败，
      # 不必先跑 20 分钟测试。
      - name: 校验分片基线
        run: node scripts/test-shards.mjs --check

      - name: 校验测试栈编排
        run: docker compose -f deploy/compose/docker-compose.test.yml config

      - name: 启动测试依赖
        run: docker compose -f deploy/compose/docker-compose.test.yml up -d --wait

      - name: 准备分片 namespace
        run: node scripts/test-services.mjs prepare --namespace "$RICCON_TEST_SERVICES_NAMESPACE"

      - name: 记录分片开始时间
        run: |
          set -euo pipefail
          mkdir -p .ci/test-shards
          date +%s > ".ci/test-shards/shard-${{ matrix.shard }}-start-epoch"

      # 分片只跑 surefire test，不用 verify/jacoco：分片覆盖率不完整，覆盖率仍由 canonical gate 采集。
      # -Dtest 使用排除语法（Surefire 3.5.6），排除其他 3 片的全部类。
      - name: 运行分片测试
        timeout-minutes: 20
        run: |
          set -euo pipefail
          SHARD="${{ matrix.shard }}"
          FILTER="$(node scripts/test-shards.mjs --shard "$SHARD" --print-test-filter)"
          node scripts/test-shards.mjs --shard "$SHARD" --emit --out-dir .ci/test-shards
          echo "shard=${SHARD} namespace=${RICCON_TEST_SERVICES_NAMESPACE} filter_chars=${#FILTER}"
          ./mvnw -q -T1C test \
            -Dtest="$FILTER" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Djacoco.skip=true

      # 计时报告与 host 墙钟分开记录：surefire 时间用于预算口径，墙钟用于与 CI 关键路径估算对照。
      - name: 生成分片计时报告
        if: always()
        run: |
          set -euo pipefail
          SHARD="${{ matrix.shard }}"
          # 先写墙钟，保证测试阶段早失败时仍有分片耗时记录；再生成 surefire 计时（无报告时会失败，
          # 属预期：job 已因上游步骤失败）。
          START="$(cat ".ci/test-shards/shard-${SHARD}-start-epoch")"
          END="$(date +%s)"
          printf '{"shard":%s,"wall_seconds":%s,"started_at_epoch":%s,"finished_at_epoch":%s}\n' \
            "$SHARD" "$((END - START))" "$START" "$END" \
            > ".ci/test-shards/shard-${SHARD}-timings.json"
          node scripts/test-timings.mjs --out-dir ".ci/test-timings/shard-${SHARD}"

      - name: 上传分片报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          # .ci 是隐藏目录，upload-artifact v4 默认排除隐藏文件，必须显式开启。
          include-hidden-files: true
          path: |
            apps/*/target/surefire-reports/TEST-*.xml
            platform/*/target/surefire-reports/TEST-*.xml
            .ci/test-shards
            .ci/test-timings
          retention-days: 14
          if-no-files-found: warn

      - name: 失败时导出依赖日志
        if: failure()
        run: |
          echo "RICCON_TEST_SERVICES=${RICCON_TEST_SERVICES:-<未设置>}"
          echo "RICCON_TEST_SERVICES_NAMESPACE=${RICCON_TEST_SERVICES_NAMESPACE:-<未设置>}"
          echo "github.run_id=${{ github.run_id }}"
          docker compose version
          docker compose -f deploy/compose/docker-compose.test.yml logs --no-color

      - name: 清理测试依赖
        if: always()
        # CI runner 是一次性的：down -v 会一并删除 namespace 数据库与数据卷，无需额外 DROP。
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v

  # M19 P2：4 片合集必须与基线完全一致。任一 shard 失败时本 job 仍执行（if: always()），
  # 报告缺失/重复/变少的类，而不是只显示“上游失败”。
  backend-merge:
    name: 后端分片合并校验
    needs: backend-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: 下载全部 shard 产物
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: .ci/shards

      - name: 合并校验分片报告
        run: |
          set -euo pipefail
          node scripts/test-merge-shards.mjs \
            --shards-root .ci/shards \
            --baseline scripts/test-shards-baseline.json \
            --out-dir .ci/test-shards-merged \
            --shard-count 4

      - name: 上传合并报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shards-merged
          include-hidden-files: true
          path: .ci/test-shards-merged
          retention-days: 14
          if-no-files-found: warn

  # M19 P2：迁移冒烟与格式检查独立成一个 job，避免 4 个分片重复跑迁移冒烟。
  # 迁移冒烟仍使用默认 riccon 库与手工 SQL，不读写 external namespace。
  backend-smoke:
    name: 后端冒烟（迁移 + 格式）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 格式检查不依赖数据库，先跑以便快速失败。
      - name: 代码格式检查
        run: ./mvnw -q spotless:check

      - name: 校验测试栈编排
        run: docker compose -f deploy/compose/docker-compose.test.yml config

      - name: 启动测试依赖
        run: docker compose -f deploy/compose/docker-compose.test.yml up -d --wait

      # 迁移冒烟：使用与本地/演练相同的 compose 和文件顺序，全程用非 SUPER 的 riccon 用户，
      # 防止 root 绕过权限掩盖 ERROR 1419。失败即中断，不进入后续构建。
      # V10（M10）起不写死表数：期望值由迁移文件推导，另断言 V10 结构真实存在。
      - name: 迁移冒烟（V1–V10）
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/compose/docker-compose.test.yml"
          mysql_exec() {
            $COMPOSE exec -T -e MYSQL_PWD="${RICCON_DB_PASSWORD:-riccon_test_only}" \
              mysql mysql --user=riccon --database=riccon "$@"
          }

          # MySQL 8.4 默认开启 binlog，compose 固定 --log-bin-trust-function-creators=1
          trust="$(mysql_exec --batch --skip-column-names \
            -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators'" | awk '{print $2}')"
          echo "log_bin_trust_function_creators=${trust}"
          test "${trust}" = "ON"

          for migration in apps/api/src/main/resources/db/migration/V*.sql; do
            echo "== ${migration}"
            mysql_exec --batch --show-warnings < "${migration}"
          done

          # 手工重放只执行 V*.sql，不会创建 flyway_schema_history，因此表数比经 Flyway 启动的
          # ApiApplicationTests 口径少 1（M10：手工 39 + history 1 = 40）。期望值从迁移文件推导，
          # 新增迁移时无需改 CI；V10 结构由下方显式断言兜底。
          expected_tables="$(grep -hE '^[[:space:]]*CREATE TABLE' \
            apps/api/src/main/resources/db/migration/V*.sql | wc -l | tr -d ' ')"
          tables="$(mysql_exec --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='riccon'")"
          triggers="$(mysql_exec --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='riccon'")"
          echo "tables=${tables} expected_tables=${expected_tables} triggers=${triggers}"
          test "${tables}" -eq "${expected_tables}"
          test "${triggers}" -eq 2

          # V10（M10）结构断言：导出请求表、audit_event 两条查询索引、两条审批权限。
          v10_table="$(mysql_exec --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='riccon' AND table_name='audit_export_request'")"
          v10_indexes="$(mysql_exec --batch --skip-column-names \
            -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='riccon' AND table_name='audit_event' AND index_name IN ('idx_audit_tenant_action_time','idx_audit_tenant_actor_time')")"
          v10_permissions="$(mysql_exec --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM permission WHERE code IN ('audit.export.approve','platform.audit.export.approve')")"
          echo "v10_table=${v10_table} v10_indexes=${v10_indexes} v10_permissions=${v10_permissions}"
          test "${v10_table}" -eq 1
          test "${v10_indexes}" -eq 2
          test "${v10_permissions}" -eq 2

          # append-only 必须由数据库拒绝，而不是只靠应用层
          mysql_exec -e "INSERT INTO audit_event (event_id, occurred_at, tenant_id, actor_type, actor_id, action, outcome, trace_id) VALUES (UNHEX('0192f0a1b2c37d4e8f9012345678abcd'), UTC_TIMESTAMP(6), 'platform', 'SYSTEM', 'system', 'migration.smoke', 'SUCCESS', 'trace-smoke-001');"
          if mysql_exec -e "UPDATE audit_event SET outcome='FAILURE' WHERE action='migration.smoke';"; then
            echo "audit_event UPDATE 未被触发器拒绝"; exit 1
          fi
          if mysql_exec -e "DELETE FROM audit_event WHERE action='migration.smoke';"; then
            echo "audit_event DELETE 未被触发器拒绝"; exit 1
          fi

      # M19 P2：分片与热栈迁移到 backend-shards；本 job 不再跑构建与全量测试，
      # 只保留迁移冒烟与格式检查（canonical gate 仍由本地/verifier 跑完整 verify）。
      - name: 失败时导出依赖日志
        if: failure()
        run: |
          echo "RICCON_TEST_SERVICES=${RICCON_TEST_SERVICES:-<未设置>}"
          docker compose version
          docker compose -f deploy/compose/docker-compose.test.yml logs --no-color

      - name: 清理测试依赖
        if: always()
        # CI runner 是一次性的：down -v 会一并删除数据卷，无需额外 DROP。
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v

  frontend:
    name: 前端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段锁定为 pnpm@10.34.9；
        # 同时传 version 会触发 action 的版本冲突检查，因此这里不重复声明。

      - name: 安装 Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -w typecheck

      - name: 代码规范与格式检查
        run: pnpm -w lint

      - name: 单元测试
        run: pnpm -w test

      - name: 构建
        run: pnpm -w build

      - name: 安装 Playwright Chromium
        run: pnpm -w exec playwright install --with-deps chromium

      - name: E2E 与可访问性
        run: pnpm -w e2e

      - name: 上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # M04 性能门禁（ADR-0021 §10.2/§10.6、PERF-M04-001/002）。
  # - 只在 nightly（schedule）或发布前手动触发（workflow_dispatch）运行，避免每次 push 都跑 50 并发；
  # - 本地 `--mode=perf` 只算预检，发布必须引用本 job 的 perf-m04-matrix.json；
  # - k6 固定 v2.4.0 并按 sha256 校验；MySQL 镜像由 compose 固定 mysql:8.4.13。
  perf-m04:
    name: M04 性能与降级矩阵（nightly / 发布前）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 安装 Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: 校验测试栈编排
        run: docker compose -f deploy/compose/docker-compose.test.yml config

      - name: 安装 k6 v2.4.0（固定版本 + 校验和）
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz
          echo "5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87  /tmp/k6.tar.gz" | sha256sum -c -
          tar -xzf /tmp/k6.tar.gz
          sudo install -m 0755 k6-v2.4.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: 构建可执行 jar（perf 只读产物，不跑测试）
        run: ./mvnw -q -T1C -DskipTests package

      - name: M04 perf 矩阵（首字/降级/配额/成本）
        env:
          REAL_EVIDENCE_TASK: CI-PERF-M04
          REAL_PERF_DURATION: 45s
        run: |
          node scripts/real-stack/run.mjs --mode=perf \
            --perf-modes=server_error,rate_limited,unauthorized,timeout

      - name: 上传 perf 报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-m04-${{ github.run_id }}
          path: |
            .riccon/evidence/CI-PERF-M04/perf-m04-*.json
            .riccon/evidence/CI-PERF-M04/perf-m04-*.log
            .riccon/evidence/CI-PERF-M04/real-stack-env.json
            .riccon/evidence/CI-PERF-M04/real-stack-summary.json
          retention-days: 30

      - name: 失败时导出容器日志
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.test.yml logs --no-color

      - name: 清理测试依赖
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v
