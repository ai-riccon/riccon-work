spring:
  application:
    name: riccon-worker

server:
  port: ${RICCON_WORKER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# M01 不配置任何模型或 MCP 凭据；M02 起通过环境变量注入，禁止写入仓库与镜像。
