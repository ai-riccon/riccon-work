spring:
  application:
    name: riccon-worker
  task:
    scheduling:
      # M05：分通道调度需要 default(1) + heavy(默认并发 2) 同时运行；单线程会把重任务饿死。
      pool:
        size: ${RICCON_WORKER_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: riccon-sched-
  datasource:
    # 本地默认值对应 deploy/compose/docker-compose.test.yml 的非默认端口；生产必须由环境变量注入。
    url: ${RICCON_DB_URL:jdbc:mysql://127.0.0.1:13306/riccon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${RICCON_DB_USERNAME:riccon}
    password: ${RICCON_DB_PASSWORD:riccon_test_only}
    hikari:
      # Worker 轮询与租户任务并发有限，连接池保持小规模；生产按实例数调整。
      maximum-pool-size: ${RICCON_DB_POOL_SIZE:10}
      connection-timeout: 3000
      # ADR-0012：DATETIME(6) 统一按 UTC 写入，禁止依赖容器默认时区。
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    # 迁移只由 apps/api 执行（ADR-0010）；Worker 不包含迁移资源，也不加载 Flyway。
    enabled: false
  sql:
    init:
      mode: never

server:
  port: ${RICCON_WORKER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # M04：prometheus 由 SecurityConfig 按 RICCON_OPS_ALLOWED_CIDRS 限制来源（ADR-0021 §2.2）。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      # B10 preflight 通过 /actuator/info 比对 API 与 Worker 的 M04 指纹（非密钥）。
      enabled: true

# M04 /actuator/info 指纹：必须与 API 一致；不暴露 endpoint URL、key 或密文。
info:
  riccon:
    model:
      deploymentMode: ${RICCON_MODEL_DEPLOYMENT_MODE:PRODUCTION}
      endpointSetHash: ${RICCON_MODEL_ENDPOINT_SET_HASH:}
      routingMode: ${RICCON_MODEL_ROUTING_MODE:}
      failoverEnabled: ${RICCON_MODEL_FAILOVER_ENABLED:}
      quotaEnforcementEnabled: ${RICCON_QUOTA_ENFORCEMENT_ENABLED:}
    masterKeyId: ${RICCON_MASTER_KEY_ID:mk-1}
    billing:
      currency: ${RICCON_BILLING_CURRENCY:CNY}
    quota:
      tenantDaily: ${RICCON_QUOTA_DEFAULT_TENANT_DAILY:10000}
      tenantMonthly: ${RICCON_QUOTA_DEFAULT_TENANT_MONTHLY:200000}
      userDaily: ${RICCON_QUOTA_DEFAULT_USER_DAILY:1000}
      userMonthly: ${RICCON_QUOTA_DEFAULT_USER_MONTHLY:20000}

riccon:
  # M04 受管端点与网关开关：与 API 使用同一组键与环境变量，便于 B10 预检漂移。
  # endpoint 允许列表只来自部署（JSON 数组）；PRODUCTION 未配置时启动失败。
  model:
    deployment-mode: ${RICCON_MODEL_DEPLOYMENT_MODE:PRODUCTION}
    endpoints: ${RICCON_MODEL_ENDPOINTS:}
    allow-legacy-endpoints: ${RICCON_MODEL_ALLOW_LEGACY_ENDPOINTS:false}
    allow-http: ${RICCON_MODEL_ALLOW_HTTP:false}
    gateway:
      # 环境变量优先级高于 DB 开关；留空表示使用 model_gateway_switch。
      routing-mode: ${RICCON_MODEL_ROUTING_MODE:}
      failover-enabled: ${RICCON_MODEL_FAILOVER_ENABLED:}
      quota-enforcement-enabled: ${RICCON_QUOTA_ENFORCEMENT_ENABLED:}
  # M04 单币种，必须与 API 一致。
  billing:
    currency: ${RICCON_BILLING_CURRENCY:CNY}
  # M04 默认配额键在 Worker 只用于 /actuator/info 漂移检查；执行在 API（B6）。
  quota:
    defaults:
      tenant-daily: ${RICCON_QUOTA_DEFAULT_TENANT_DAILY:10000}
      tenant-monthly: ${RICCON_QUOTA_DEFAULT_TENANT_MONTHLY:200000}
      user-daily: ${RICCON_QUOTA_DEFAULT_USER_DAILY:1000}
      user-monthly: ${RICCON_QUOTA_DEFAULT_USER_MONTHLY:20000}
  # M04：/actuator/prometheus 来源允许列表（逗号分隔 CIDR）；空值仅允许 loopback。
  ops:
    allowed-cidrs: ${RICCON_OPS_ALLOWED_CIDRS:}
  worker:
    schema:
      # 启动时读取 flyway_schema_history 最大成功版本；与代码期望版本不一致则拒绝启动。
      validation-enabled: true
    outbox:
      # 单队列跨租户领取；批量、租约与退避见 ADR-0008/ADR-0016。
      scheduling-enabled: true
      # M05：默认由 OutboxLaneScheduler 按 default/heavy 通道领取；旧“领取全部事件”调度器
      # 只在回滚窗口显式设为 true，避免与分通道调度抢事件。
      legacy-all-lane-scheduling: ${RICCON_WORKER_OUTBOX_LEGACY_ALL_LANE_SCHEDULING:false}
      # M05：default 保持 chat/report 顺序；heavy 承载 FILE_PARSE/KNOWLEDGE_INDEX/CONNECTOR_SYNC。
      lanes: ${RICCON_WORKER_OUTBOX_LANES:default,heavy}
      heavy-concurrency: ${RICCON_WORKER_OUTBOX_HEAVY_CONCURRENCY:2}
      # 单事件最大处理时长；超时中断 handler 并按可重试失败退避。
      max-processing: ${RICCON_WORKER_OUTBOX_MAX_PROCESSING:30m}
      poll-interval: 500ms
      poll-initial-delay: 5s
      batch-size: 10
      lease-duration: 90s
      max-attempts: 3
      retry-delays: 2s,8s,30s
      retry-jitter: 200ms
    storage:
      # 对象存储只通过服务端生成的 key 访问；默认凭据仅用于本地测试栈。
      endpoint: ${RICCON_S3_ENDPOINT:http://127.0.0.1:19000}
      region: ${RICCON_S3_REGION:us-east-1}
      access-key: ${RICCON_S3_ACCESS_KEY:riccon_test_only}
      secret-key: ${RICCON_S3_SECRET_KEY:riccon_test_only_secret}
      bucket: ${RICCON_S3_BUCKET:riccon}
      path-style: ${RICCON_S3_PATH_STYLE:true}
    opensearch:
      # M02 每个租户一个索引别名 riccon-kb-{tenantId}；索引名由 TenantContext 派生。
      url: ${RICCON_OPENSEARCH_URL:http://127.0.0.1:19200}
      username: ${RICCON_OPENSEARCH_USERNAME:}
      password: ${RICCON_OPENSEARCH_PASSWORD:}
      connect-timeout: 2s
      request-timeout: 30s
      index-prefix: riccon-kb
      index-version: v1
    embedding:
      # M02 使用确定性哈希向量占位；真实模型接入在后续任务替换 EmbeddingModel Bean。
      dimensions: 64
    parse:
      max-file-bytes: 52428800
      chunk-size: 800
      chunk-overlap: 80
    crypto:
      # 主密钥只由部署环境注入；缺失/长度错误时 Worker 启动失败（ADR-0006）。
      master-key: ${RICCON_MASTER_KEY:}
      previous-master-key: ${RICCON_MASTER_KEY_PREVIOUS:}
      master-key-id: ${RICCON_MASTER_KEY_ID:mk-1}
      # M04：启动 canary 用于验证当前主密钥可解开既有 DEK；日志只输出 canary 是否匹配，不输出 key。
      canary: ${RICCON_MASTER_KEY_CANARY:}
      # M04：key 去重 fingerprint 的独立 pepper（Base64 32B）；PRODUCTION 缺失即启动失败。
      # pepper 不随主密钥轮换；丢失后无法新建/去重 key，但历史密文解密不受影响。
      fingerprint-pepper: ${RICCON_CREDENTIAL_FINGERPRINT_PEPPER:}
    service-token:
      # API → Worker HMAC 共享密钥；缺失/过短时启动失败。生产不得写入仓库。
      secret: ${RICCON_SERVICE_TOKEN_SECRET:}
    model:
      connect-timeout: 5s
      request-timeout: 60s
      # M04：内层 OpenAI 客户端固定不重试；所有重试/换 key/换模型由 FailoverChatModel 拥有，
      # 保证 HTTP 调用数 = model_invocation_attempt 行数 = 降级审计条数（ADR-0021 §5.2）。
      max-attempts: 1
      retry-delays: 200ms,1s
      # M04 路由/降级预算（B4 消费）：生产默认；AC-17 perf profile 由部署 env 覆盖为
      # first-token-timeout=1000ms、pre-first-token-budget=2500ms、retry-delays=50ms,100ms。
      routing:
        max-attempts: ${RICCON_MODEL_ROUTING_MAX_ATTEMPTS:3}
        retry-delays: ${RICCON_MODEL_ROUTING_RETRY_DELAYS:200ms,500ms,1s}
        first-token-timeout: ${RICCON_MODEL_FIRST_TOKEN_TIMEOUT:30s}
        pre-first-token-budget: ${RICCON_MODEL_PRE_FIRST_TOKEN_BUDGET:60s}
      # 仅本地测试允许 http 模型端点；生产必须为 false（与 riccon.model.allow-http 同源）。
      allow-insecure-http: ${RICCON_MODEL_ALLOW_HTTP:false}
      default-max-output-tokens: 2048
    chat:
      max-concurrent-streams: ${RICCON_CHAT_MAX_STREAMS:16}
      idle-timeout: 60s
      max-duration: 10m
      max-history-messages: 40
    mcp:
      # M02 只允许平台内置白名单；不在名单中的 server 即使有租户授权也会拒绝。
      allowed-server-codes: ${RICCON_MCP_ALLOWED_SERVERS:riccon-builtin}
      allow-stdio: ${RICCON_MCP_ALLOW_STDIO:false}
      allow-insecure-http: ${RICCON_MCP_ALLOW_HTTP:false}
      request-timeout: 30s
      initialization-timeout: 15s
      max-result-bytes: 65536
      params-preview-max-length: 500
    agent:
      max-iterations: 4
      knowledge-top-k: 5
      file-chunk-limit: 5
      max-chunk-chars: 2000
      retrieval-candidate-limit: 60

# M02 起模型与 MCP 凭据通过环境变量注入，禁止写入仓库与镜像。
