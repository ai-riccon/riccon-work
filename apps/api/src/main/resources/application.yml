spring:
  application:
    name: riccon-api
  datasource:
    # 本地默认值对应 deploy/compose/docker-compose.test.yml 的非默认端口；生产必须由环境变量注入。
    url: ${RICCON_DB_URL:jdbc:mysql://127.0.0.1:13306/riccon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${RICCON_DB_USERNAME:riccon}
    password: ${RICCON_DB_PASSWORD:riccon_test_only}
    hikari:
      # ADR-0012：时间统一按 UTC 写入 DATETIME(6)；每条连接建立后显式固定会话时区。
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  session:
    jdbc:
      # 会话表由 Flyway V7 创建，禁止应用自动建表（ADR-0013）。
      initialize-schema: never
      table-name: SPRING_SESSION
  servlet:
    multipart:
      # 合同与 OpenAPI：单文件 ≤ 200 MB；请求体额外预留 multipart 边界与表单字段开销。
      max-file-size: 200MB
      max-request-size: 210MB
      # 超过阈值的上传直接落磁盘，避免 200 MB 文件占用堆内存。
      file-size-threshold: 0B
  mvc:
    async:
      # SSE 总时长上限 10 分钟；容器异步超时略大于看门狗上限，避免正常长回答被容器提前中断。
      request-timeout: 11m

server:
  port: ${RICCON_API_PORT:8080}
  shutdown: graceful
  tomcat:
    # 让容器在返回 413 前吞掉超限请求体，避免客户端看到连接重置。
    max-swallow-size: 210MB
  servlet:
    session:
      # 空闲 30 分钟滑动续期；登录成功后轮换会话 ID（ADR-0013）。
      timeout: 30m
      cookie:
        name: RICCON_SESSION
        http-only: true
        same-site: lax
        # 本地与测试为 false；preview/production 必须由 TLS 终止并设置为 true。
        secure: ${RICCON_COOKIE_SECURE:false}
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    # M01 默认关闭 OpenAPI 文档，避免在认证落地前暴露内部描述；需要时由环境显式开启。
    enabled: false
  swagger-ui:
    enabled: false

riccon:
  # API → Worker 内部对话流客户端；共享密钥与端点只由部署环境注入（ADR-0014 第 5 节）。
  worker:
    client:
      base-url: ${RICCON_WORKER_BASE_URL:http://127.0.0.1:8081}
      connect-timeout: 5s
      token-ttl: 300s
      service-token-secret: ${RICCON_SERVICE_TOKEN_SECRET:}
      cancel-timeout: 10s
      idle-timeout: 60s
      max-duration: 10m
  storage:
    # 测试栈使用 RustFS（ADR-0002）；生产必须由环境变量注入客户对象存储与最小权限凭据。
    endpoint: ${RICCON_S3_ENDPOINT:http://127.0.0.1:19000}
    region: ${RICCON_S3_REGION:us-east-1}
    access-key: ${RICCON_S3_ACCESS_KEY:riccon_test_only}
    secret-key: ${RICCON_S3_SECRET_KEY:riccon_test_only_secret}
    bucket: ${RICCON_S3_BUCKET:riccon-test}
    path-style: true
    # OpenAPI 要求下载地址 TTL ≤ 300 秒；配置校验会拒绝更大的值。
    download-url-ttl: 300s
