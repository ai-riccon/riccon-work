spring:
  application:
    name: riccon-api
  datasource:
    # 本地默认值对应 deploy/compose/docker-compose.test.yml 的非默认端口；生产必须由环境变量注入。
    url: ${RICCON_DB_URL:jdbc:mysql://127.0.0.1:13306/riccon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${RICCON_DB_USERNAME:riccon}
    password: ${RICCON_DB_PASSWORD:riccon_test_only}
    hikari:
      # ADR-0012：时间统一按 UTC 写入 DATETIME(6)；每条连接建立后显式固定会话时区。
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  session:
    jdbc:
      # 会话表由 Flyway V7 创建，禁止应用自动建表（ADR-0013）。
      initialize-schema: never
      table-name: SPRING_SESSION
  servlet:
    multipart:
      # 合同与 OpenAPI：单文件 ≤ 200 MB；请求体额外预留 multipart 边界与表单字段开销。
      max-file-size: 200MB
      max-request-size: 210MB
      # 超过阈值的上传直接落磁盘，避免 200 MB 文件占用堆内存。
      file-size-threshold: 0B
  mvc:
    async:
      # SSE 总时长上限 10 分钟；容器异步超时略大于看门狗上限，避免正常长回答被容器提前中断。
      request-timeout: 11m

server:
  port: ${RICCON_API_PORT:8080}
  shutdown: graceful
  tomcat:
    # 让容器在返回 413 前吞掉超限请求体，避免客户端看到连接重置。
    max-swallow-size: 210MB
  servlet:
    session:
      # 空闲 30 分钟滑动续期；登录成功后轮换会话 ID（ADR-0013）。
      timeout: 30m
      cookie:
        name: RICCON_SESSION
        http-only: true
        same-site: lax
        # 本地与测试为 false；preview/production 必须由 TLS 终止并设置为 true。
        secure: ${RICCON_COOKIE_SECURE:false}
        path: /

management:
  endpoints:
    web:
      exposure:
        # M04：prometheus 端点由 SecurityConfig 按 RICCON_OPS_ALLOWED_CIDRS 限制来源；
        # 依赖由 B1c 引入，暴露实现在 B2，这里只声明端点（ADR-0021 §2.2）。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
  info:
    env:
      # B10 preflight 通过 /actuator/info 比对 API 与 Worker 的 M04 指纹（非密钥）。
      enabled: true

# M04 /actuator/info 指纹：deploymentMode、routingMode、failoverEnabled、quotaEnforcementEnabled、
# masterKeyId、currency 与 4 个默认配额键必须与 Worker 一致；不暴露 endpoint URL、key 或密文。
info:
  riccon:
    model:
      deploymentMode: ${RICCON_MODEL_DEPLOYMENT_MODE:PRODUCTION}
      endpointSetHash: ${RICCON_MODEL_ENDPOINT_SET_HASH:}
      routingMode: ${RICCON_MODEL_ROUTING_MODE:}
      failoverEnabled: ${RICCON_MODEL_FAILOVER_ENABLED:}
      quotaEnforcementEnabled: ${RICCON_QUOTA_ENFORCEMENT_ENABLED:}
    masterKeyId: ${RICCON_MASTER_KEY_ID:mk-1}
    billing:
      currency: ${RICCON_BILLING_CURRENCY:CNY}
    quota:
      tenantDaily: ${RICCON_QUOTA_DEFAULT_TENANT_DAILY:10000}
      tenantMonthly: ${RICCON_QUOTA_DEFAULT_TENANT_MONTHLY:200000}
      userDaily: ${RICCON_QUOTA_DEFAULT_USER_DAILY:1000}
      userMonthly: ${RICCON_QUOTA_DEFAULT_USER_MONTHLY:20000}

springdoc:
  api-docs:
    # M01 默认关闭 OpenAPI 文档，避免在认证落地前暴露内部描述；需要时由环境显式开启。
    enabled: false
  swagger-ui:
    enabled: false

riccon:
  # M04：API 首次具备信封加密能力（ADR-0006/ADR-0021 §6.5）。
  # 主密钥、上一把主密钥、canary 与 fingerprint pepper 只由部署环境注入；空值由启动校验 fail-closed，
  # 仓库/镜像/证据中不得出现真实值。pepper 不随主密钥轮换。
  crypto:
    master-key: ${RICCON_MASTER_KEY:}
    previous-master-key: ${RICCON_MASTER_KEY_PREVIOUS:}
    master-key-id: ${RICCON_MASTER_KEY_ID:mk-1}
    canary: ${RICCON_MASTER_KEY_CANARY:}
    fingerprint-pepper: ${RICCON_CREDENTIAL_FINGERPRINT_PEPPER:}
  # M04 受管模型端点：唯一可新增端点的来源是部署配置 RICCON_MODEL_ENDPOINTS（JSON 数组，非密钥）。
  # DB 只保存目录元数据；PRODUCTION 未配置端点时启动失败（除非显式 allow-legacy-endpoints）。
  model:
    deployment-mode: ${RICCON_MODEL_DEPLOYMENT_MODE:PRODUCTION}
    endpoints: ${RICCON_MODEL_ENDPOINTS:}
    allow-legacy-endpoints: ${RICCON_MODEL_ALLOW_LEGACY_ENDPOINTS:false}
    allow-http: ${RICCON_MODEL_ALLOW_HTTP:false}
    gateway:
      # 环境变量优先级高于 DB 开关；留空表示使用 model_gateway_switch。
      # 设置后管理端 PUT 返回 409 ENV_OVERRIDE_ACTIVE，避免 UI 显示与实际不一致。
      routing-mode: ${RICCON_MODEL_ROUTING_MODE:}
      failover-enabled: ${RICCON_MODEL_FAILOVER_ENABLED:}
      quota-enforcement-enabled: ${RICCON_QUOTA_ENFORCEMENT_ENABLED:}
  # M04 单币种；部署后不可在线变更（ADR-0022 §2.1）。
  billing:
    currency: ${RICCON_BILLING_CURRENCY:CNY}
  # M04 默认配额：无显式 quota_limit 行时生效；0 或空表示不限。
  # 四个键必须与 Worker /actuator/info 指纹一致，B6 不得在代码内硬编码第二套默认值。
  quota:
    defaults:
      tenant-daily: ${RICCON_QUOTA_DEFAULT_TENANT_DAILY:10000}
      tenant-monthly: ${RICCON_QUOTA_DEFAULT_TENANT_MONTHLY:200000}
      user-daily: ${RICCON_QUOTA_DEFAULT_USER_DAILY:1000}
      user-monthly: ${RICCON_QUOTA_DEFAULT_USER_MONTHLY:20000}
  # M04：/actuator/prometheus 来源允许列表（逗号分隔 CIDR）；空值仅允许 loopback。
  ops:
    allowed-cidrs: ${RICCON_OPS_ALLOWED_CIDRS:}
  # API → Worker 内部对话流客户端；共享密钥与端点只由部署环境注入（ADR-0014 第 5 节）。
  worker:
    client:
      base-url: ${RICCON_WORKER_BASE_URL:http://127.0.0.1:8081}
      connect-timeout: 5s
      token-ttl: 300s
      service-token-secret: ${RICCON_SERVICE_TOKEN_SECRET:}
      cancel-timeout: 10s
      idle-timeout: 60s
      max-duration: 10m
  storage:
    # 测试栈使用 RustFS（ADR-0002）；生产必须由环境变量注入客户对象存储与最小权限凭据。
    endpoint: ${RICCON_S3_ENDPOINT:http://127.0.0.1:19000}
    region: ${RICCON_S3_REGION:us-east-1}
    access-key: ${RICCON_S3_ACCESS_KEY:riccon_test_only}
    secret-key: ${RICCON_S3_SECRET_KEY:riccon_test_only_secret}
    bucket: ${RICCON_S3_BUCKET:riccon-test}
    path-style: true
    # OpenAPI 要求下载地址 TTL ≤ 300 秒；配置校验会拒绝更大的值。
    download-url-ttl: 300s
