        正文上限 2 MiB，超过返回 413；响应固定 `Cache-Control: no-store`，不返回对象存储地址或凭据。
        跨租户、不可见产物与不存在版本统一 404，语义与下载地址一致。
      x-riccon-permission: artifact.read
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 产物正文
          headers:
            Cache-Control:
              description: 固定 no-store，禁止浏览器与代理缓存
              schema:
                type: string
                const: no-store
            Content-Length:
              description: 正文字节数
              schema:
                type: integer
                minimum: 1
                maximum: 2097152
            X-Content-Type-Options:
              description: 固定 nosniff
              schema:
                type: string
                const: nosniff
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
