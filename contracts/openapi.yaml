    KnowledgeDocument:
      type: object
      required:
        [
          id,
          title,
          sourceType,
          status,
          checksum,
          mimeType,
          sizeBytes,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sourceType:
          type: string
          enum: [UPLOAD, SEED, CONNECTOR]
          description: 文档来源；`CONNECTOR` 表示由 S3 兼容目录连接器导入（M05b），此时 `fileId` 为空、`connectorId` 非空。
        fileId:
          type: [string, "null"]
          format: uuid
        connectorId:
          type: [string, "null"]
          format: uuid
          description: 来源连接器；仅 `sourceType=CONNECTOR` 时非空，不返回连接器端点或 bucket。
        externalId:
          type: [string, "null"]
          maxLength: 1000
          description: 连接器源对象 ID（仅展示末段：最后 2 个路径段或 32 字符）；完整值只在库内用于比对，不返回对象 key 或 bucket。
        status:
          $ref: "#/components/schemas/KnowledgeDocumentStatus"
        checksum:
          type: string
          pattern: "^[a-f0-9]{64}$"
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        errorCode:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        indexedAt:
          type: [string, "null"]
          format: date-time
        failedAt:
          type: [string, "null"]
          format: date-time
          description: |
            最近一次解析/OCR/索引失败时间（ISO 8601 带 +08:00）；仅 `status=FAILED` 时非空，
            非 FAILED 为 null/省略。来源优先为文件解析失败的 `finished_at`，缺失时回退知识库文档 `updated_at`。
        createdAt:
          type: string
          format: date-time
        visibility:
          $ref: "#/components/schemas/KnowledgeVisibility"
        departmentId:
          type: [string, "null"]
          format: uuid
          description: 仅 `visibility=DEPT` 时非空；部门须为 `ACTIVE`。
        aclUserCount:
          type: integer
          minimum: 0
          description: "`USERS` 显式授权人数；不含创建人隐式可见，最多 200。"
        parseEngine:
          $ref: "#/components/schemas/ParseEngine"
        warnings:
          type: array
          description: 解析警告白名单数组（如 `SHEETS_TRUNCATED`、`LOW_CONFIDENCE`、`PAGES_WITHOUT_TEXT:<n>`）；不含原文。
          items:
            type: string
        parseSummary:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeParseSummary"
            - type: "null"
        sourceFileAccessLimited:
          type: boolean
          description: 文档可见集合宽于源文件所在空间的可见集合；UI 提示可用知识库下载，不放大原工作空间路径。
        retentionExpiresAt:
          type: [string, "null"]
          format: date-time
          description: 内容保留到期时间（ISO 8601 带偏移）；默认创建后 180 天，租户策略可覆盖。
        retentionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: 生效的保留天数；缺省取部署默认或租户策略。
        retentionPolicy:
          $ref: "#/components/schemas/KnowledgeRetentionPolicy"
      additionalProperties: false
    KnowledgeParseSummary:
      type: object
      description: 解析结构摘要；只含工作表/范围/空表/OCR 置信度等元数据，不含单元格原文或正文。
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeParseSheetSummary"
        hiddenSheetCount:
          type: integer
          minimum: 0
          description: 默认跳过并告警的隐藏工作表数量。
        ocr:
