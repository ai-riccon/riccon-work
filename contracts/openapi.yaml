openapi: 3.1.0
info:
  title: Riccon API
  version: 1.6.0-m06
  description: |
    Riccon M06 公开 REST 契约（J1 通用问答与文件处理、J2 市场调研报告、部门与空间数据范围、OIDC/SSO、审计查询与导出、模型路由/降级/多 key、配额与成本、知识库文档级 ACL/下载/重索引、Excel/OCR 引用定位、S3 兼容目录连接器、编排 Studio 流程/版本/运行/审批/模板）。

    ## 认证与会话
    - 内置账号：`tenantCode + username + password`；租户代码即 `tenant.id`。
    - 企业账号：每租户 1 个 OIDC IdP，授权码 + PKCE + nonce；入口 `GET /api/v1/auth/oidc/authorize/{registrationId}`，回调用同一会话层。
    - 会话存储在 MySQL（Spring Session JDBC），Cookie 名 `RICCON_SESSION`，`HttpOnly`、`SameSite=Lax`，非本地环境 `Secure`。
    - 不使用 JWT；浏览器、响应体、日志与会话中不出现 access token、refresh token 或 ID token。OIDC 账号按 issuer + subject 显式绑定，不按邮箱自动关联。

    ## CSRF
    - 先调用 `GET /api/v1/auth/csrf` 获取令牌；登录后响应会返回新的 `csrfToken`。
    - 所有 `POST/PUT/PATCH/DELETE` 必须带 `X-CSRF-TOKEN`；缺失或过期返回 403 `RICCON-AUTH-403`。
    - 登录接口同样受 CSRF 保护；匿名会话只承载 CSRF 令牌，不承载业务数据。OIDC 授权入口与回调是顶层 GET 导航，不使用 CSRF 令牌。

    ## 租户与部门隔离
    - 租户只从已认证主体派生；请求体、查询参数、请求头中的 `tenantId` 一律忽略，不一致时拒绝并审计。
    - 跨租户对象统一返回 404 `RICCON-TENANT-404`，不泄露对象是否存在。
    - 空间访问：个人空间仅本人；部门空间按 `DEPT`/`CUSTOM` 可见性；历史 `TENANT` 空间仅 M02 迁移存在，禁止新建、M03 只读。
    - 部门元数据（部门、成员归属、负责人）只由平台管理员通过 `/api/v1/admin/tenants/{tenantId}/departments` 管理，权限 `platform.department.manage`；租户端只保留读取本人部门与空间管理。
    - 跨部门对象与管理操作同样统一 404；可见但无管理能力返回 403；错误响应不含空间内容。
    - 所有列表强制分页：`page` 从 1 开始，`size` 默认 20、最大 100。

    ## 审计查询与导出（M10）
    - 查询只读：`GET /api/v1/audit-events`，权限 `audit.read`；租户从主体派生，时间范围必须带偏移且不超过 180 天。
    - 导出需审批：申请人不得自批；同租户另一管理员审批，单管理员租户由平台管理员审批（仅元数据）。
    - 只有申请人可下载；批准后按 TTL（默认 24 小时）过期；CSV 流不落盘；不含 `source_ip`、token、凭据、原文或邮箱；危险公式前缀转义。
    - 平台管理员不能查询目标租户审计明细；平台来源事件对目标租户不可见（DEC-0013、M03 F-009，residual 不是 fixed）。
    - 平台审批仅限单管理员租户；多管理员租户 409；平台租户自身导出 M10 返回 403（deferred）。

    ## 模型网关（M04）
    - 模型端点只来自部署允许列表；没有端点创建 API。`PUT /admin/model-providers/{providerId}` 只允许改展示名，`baseUrl`/`environmentLabel`/`protocol` 为只读，写入返回 400。
    - 路由按用途 `CHAT|REPORT` 配置有序链；停用模型保留在链中但运行时跳过；保存后下一次请求生效；`version` 乐观锁冲突返回 409。
    - 平台托管 key 池：新增/轮换/停用/恢复；响应只返回 `maskedHint`，`apiKey` 只进不出；401/403 自动失效、429/5xx 冷却；key 审计不含明文。
    - 降级：首字前按“同模型下一 key → 下一模型”切换，成功降级零提示；首字后失败保留已生成内容、不重放，返回稳定错误码与中文文案；全链失败 `RICCON-MODEL-503`。
    - 网关开关：`routingMode`（`ROUTED|BASELINE`）、`failoverEnabled`、`quotaEnforcementEnabled`；环境变量覆盖优先，覆盖生效时写接口 409。

    ## 配额与成本（M04）
    - 配额：租户 + 用户、日 + 月、按请求数、硬限额；超限拒绝新 run（`RICCON-QUOTA-429`），在途 run 继续；平台管理员写、租户管理员只读。
    - 日/月窗口与成本日桶统一 `Asia/Shanghai`；重置时间带 `+08:00`。
    - 成本：调用时价格快照、6 位小数、展示按币种最小单位四舍五入、合计按未舍入值；未定价与 token 缺失单列；单一币种；固定文案“成本为按调用时价格快照估算，不是供应商账单。”
    - 平台管理员只看租户聚合；租户管理员只看本租户用户/模型/日明细；员工无入口；跨租户统一 404。

    ## 知识库 ACL 与解析（M05）
    - 文档可见范围 `visibility` 取值 `TENANT`（本租户全员，历史文档默认）/ `DEPT`（单个部门，部门须 `ACTIVE`）/ `USERS`（显式名单，单文档最多 200 人）；创建人始终可见且不可移除。新文档默认 `TENANT`，保存前必须提示影响。
    - 列表、详情、检索、引用打开与知识库下载执行同一文档 ACL；ACL 变更下一次请求生效。不可见、跨租户、跨部门与已软删除统一 `404 RICCON-TENANT-404`；文档已可见但非创建人且非 `TENANT_ADMIN` 修改 ACL/删除/重索引返回 `403 RICCON-AUTH-403`。
    - 租户管理员（`TENANT_ADMIN`）对本租户文档有管理性读取；绕过文档 ACL 的读取写 `knowledge.document.admin_read` 审计。平台管理员不读取租户文档内容，直接访问统一 404。
    - 知识库下载 `GET /api/v1/knowledge/documents/{documentId}/download` 由服务端按请求重判 ACL 并流式代理，设置 `Content-Type`/`Content-Disposition`；不返回对象 key 或预签名 URL。原工作空间文件路径仍只按空间谓词判定，两条路径互不放大。
    - 引用可用性：`Citation`/`ArtifactCitation` 的 `sourceStatus` 取值 `AVAILABLE`/`NO_ACCESS`（ACL 撤销）/`DELETED`（源文档软删除）/`UPDATED`（源内容版本变化）；`NO_ACCESS`/`DELETED` 时 `title`/`snippet` 为空串、定位字段为 `null`，不返回正文，库内快照仅用于审计/取证。
    - 解析：`parseEngine` 记录 `PDFBOX`/`POI`/`TESSERACT`/`RAPIDOCR`/`NONE`；`warnings[]` 为白名单警告数组，不含原文；`parseSummary` 只含工作表/范围/空表/OCR 置信度等结构元数据。`force=true` 的重索引整本重做，缺省只补缺失页。
    - 保留：文档保留默认 180 天，租户策略可覆盖；`retentionPolicy` 取值 `DEPLOYMENT_DEFAULT`/`TENANT_POLICY`/`EXPLICIT`。软删除与保留到期后不再出现在列表与检索；物理对象与分块清理由 M09 承接，M05 不做物理删除。
    - 连接器导入文档的保留与删除传播见下节；M05b 只增加连接器端点与字段，不改变 M05 ACL/下载/引用语义。

    ## 外部连接器（M05b）
    - 连接器类型只有 S3 兼容目录（`type=S3`）；端点只来自部署允许列表 `RICCON_CONNECTOR_ENDPOINTS`，连接器只保存 `endpointId`，不接受任意 URL、查询串或重定向；未允许的端点、`http://` 与云元数据地址一律 400 `RICCON-KB-400` 且不发起连接。
    - 创建必须显式提供 `defaultVisibility`（`TENANT`/`DEPT`），缺省返回 `RICCON-KB-400`，不依赖数据库默认值；`DEPT` 必须给 `defaultDepartmentId`。新建连接器状态为 `PAUSED`，完成连接测试后由管理员通过 PATCH 显式设为 `ACTIVE`；`ERROR` 由同步结果产生，不能通过 API 写入。
    - 同步：`POST /api/v1/knowledge/connectors/{connectorId}/sync` 只受理并返回 202，实际同步由 Worker 执行；`scheduleEnabled=true` 时按部署固定周期 `RICCON_CONNECTOR_SYNC_INTERVAL_MINUTES` 计算 `nextSyncAt`，不支持 per-connector cron 或可视化调度。并发同步返回 409 `RICCON-KB-409`。
    - 连接测试只做一次 `ListObjectsV2`（`max-keys=1`），空 bucket 也算成功；返回 `AUTH`/`NETWORK`/`ENDPOINT`/`CONFIG` 分类的中文原因，不写对象、不返回凭据、不返回端点 URL。
    - 凭据 `PUT /api/v1/knowledge/connectors/{connectorId}/credential` 只写不读；服务端信封加密，响应/日志/审计只出现 `credentialMaskedHint`（如 `AKIA…7F2`）；轮换为覆盖写入，旧密文不保留。连接器软删除后密文保留 30 天，随后由 M09 维护任务置空。
    - 同步删除仅在 `lastSyncComplete=true` 时传播；源端重现复用 tombstone（`generation+1`），不撞唯一键；部分/截断/超限一律不删除。连接器导入文档的 `sourceType=CONNECTOR`，`fileId` 为空、`connectorId`/`externalId` 非空；原文下载仍按文档 ACL 与既有下载端点执行。
    - 权限：读 `knowledge.connector.read`，写 `knowledge.connector.manage`；当前仅 `TENANT_ADMIN` 持有。跨租户 `connectorId` 统一 `404 RICCON-TENANT-404`；同租户非管理员 `403 RICCON-AUTH-403`。

    ## 编排 Studio（M06）
    - 仅手动触发；串行执行 + 条件分支；节点类型 `START/END/RETRIEVAL/MODEL/MCP_TOOL/APPROVAL/CONDITION`。不支持代码执行/脚本/任意 HTTP、并行/循环/子流程、定时/事件触发、跨租户模板市场、审批通知/代理；接口与 UI 均不提供入口。
    - 图约束：恰好 1 个 `START`、≥1 个 `END`；每个节点入边 ≤1（不允许合并/并行）；`CONDITION` 恰好 2 条出边 `TRUE`/`FALSE`；无环、无孤立；节点 ≤50、边 ≤100。校验 profile：**SAVE 为编辑级**（结构/必填/节点配置/模型/工具/条件/结果/限制），**VALIDATE 与 PUBLISH 为完整发布口径**（再加审批可达/NO_APPROVER/发布范围），运行前再做一次执行前校验。
    - 版本：草稿 `version` 乐观锁；发布版本不可变并绑定 `runScope`（`ONLY_SELF`/`DEPARTMENT`/`TENANT`）；运行绑定发布版本；草稿修改不影响在跑运行；旧版本仍可运行，除非流程停用。
    - 审批：审批节点指定角色/人；发起人不得审批自己的运行（403）；无可用审批人时保持等待、不自动放行；写工具/高风险工具必须经过前置审批，重试重新审批；审批摘要只显示脱敏参数与审批人有权访问的引用。
    - 运行：`PENDING/RUNNING/WAITING_APPROVAL/SUCCEEDED/FAILED/CANCELLED`；节点级时间线；失败可重试失败节点，上游不重跑；取消保留已完成结果；运行默认保留 180 天，到期统一不可见，无在线删除。
    - 资源限制（部署配置、租户只读）：节点 50、步数 200、模型 300s、检索 120s、MCP 60s、运行 30min（审批等待不计）、租户并发 10、单流程 5、单次结果 ≤5 MiB；超限返回 `RICCON-WF-429` 或稳定 `WF_*` 码。
    - 权限：`workflow.read/edit/publish/run/approve/manage`；系统角色 `WORKFLOW_EDITOR` 由租户管理员经既有角色管理授予/撤销；部门负责人仅在发布 `DEPARTMENT` 范围时需要 `department.manager_user_id` 关系（关系不授权）。平台管理员访问租户工作流统一 404。
    - 审计：发布/运行/取消/审批/停用/启用/共享/授权/移交同事务 fail-closed；租户管理员查看他人运行写 `workflow.run.admin_read`（`MANAGEMENT_READ`）；不含 prompt、完整工具参数、凭据或正文。
    - 模板：M06 提供内置模板列表与复制（至少 1 个，含 J2 等价市场调研）；用户另存模板、租户内共享、升级提示在 M06b（`x-riccon-deferred: M06b`），M06 不实现。
    - 运行详情用轮询（`updatedAt` 变化），不新增 SSE；`GET /workflows/runtime-limits` 为字面路径，优先于 `/workflows/{workflowId}`。

    ## 错误
    统一使用 RFC 9457 `application/problem+json`，至少包含 `type/title/status/code/traceId`。
    错误码格式 `RICCON-<DOMAIN>-<NNN>`；禁止返回堆栈、SQL、内部主机、密钥或完整提示词。
    部门/空间成员关系冲突使用 `RICCON-DEPT-409`；跨租户/跨部门/不可见统一 `RICCON-TENANT-404`；OIDC 绑定冲突使用 `RICCON-OIDC-409`；审计查询/导出使用 `RICCON-AUDIT-*`；模型配置使用 `RICCON-MODEL-400/409`；配额使用 `RICCON-QUOTA-429/503`；成本查询使用 `RICCON-COST-400/503`；知识库文档 ACL/下载/重索引使用 `RICCON-KB-400/404/409/502/503`（源文件读取失败为 `RICCON-KB-502`）；编排 Studio 使用 `RICCON-WF-400/409/429/503`（400 图/参数/校验/无审批人；409 草稿版本冲突/审批已决定/状态冲突；429 并发上限；503 编排关闭/引擎不可用）。
    知识库下载在 ACL 通过后才发现无源文件时返回 `RICCON-KB-404`；该码不得替代不可见时的 `RICCON-TENANT-404`。
    路径存在但不支持该 HTTP 方法返回 405 `RICCON-METHOD-405`，并在 `Allow` 响应头列出受支持方法；路径不存在仍是 404 `RICCON-REQUEST-404`，已认证但无权限仍是 403。405 不产生审计写入，也不新增路由。

    ## 流式
    `POST /api/v1/conversations/{conversationId}/messages` 返回 `text/event-stream`，
    事件载荷见 `contracts/events/sse/chat-event.v1.schema.json`；报告进度事件见
    `contracts/events/sse/run-progress.v1.schema.json`。审计导出下载返回 `text/csv`，不是流式事件。

    ## 范围外（M06 后）
    MFA、审计哈希链/完整性证明、平台管理员跨租户审计明细、租户 BYO 模型凭据、模型价格编辑、多币种/汇率、账单对账、成本预聚合、MCP 注册/凭据托管（M07）、代码执行/脚本/任意 HTTP/并行/循环/子流程/定时触发、跨租户模板市场（M06b 只做租户内共享）、审批通知/代理/转交/超时自动放行、引用页图渲染/框选、物理对象与分块清理（M09）、知识库共享链接/匿名访问/跨租户共享、工作流运行结果另存工作空间产物（P1 后续）。
  contact:
    name: Riccon 架构组
  license:
    name: Proprietary
    identifier: LicenseRef-Riccon-Proprietary
servers:
  - url: /
tags:
  - name: Auth
    description: 登录、会话与 CSRF
  - name: Workspace
    description: 个人/部门工作空间与 CUSTOM 成员
  - name: Departments
    description: 部门、成员与负责人
  - name: Files
    description: 文件上传、解析状态与下载
  - name: Conversations
    description: 会话、消息与流式回答
  - name: Knowledge
    description: 知识库文档、文档级 ACL、服务端下载、重索引与 S3 兼容目录连接器（M05/M05b）
  - name: Research
    description: 市场调研报告任务与运行时间线
  - name: Approvals
    description: 外部工具调用审批
  - name: Artifacts
    description: 报告产物与版本
  - name: Catalog
    description: 租户可见的模型与 MCP 工具
  - name: ModelGateway
    description: 平台模型路由、模型目录与 key 池（M04）
  - name: Quotas
    description: 租户/用户配额与用量（M04）
  - name: Costs
    description: 按价格快照估算的调用成本（M04）
  - name: Audit
    description: 审计只读查询、导出申请/审批与策略
  - name: Admin
    description: 平台只读目录、租户/账号管理与导出审批
  - name: Workflow
    description: 编排 Studio：流程定义/草稿/版本、运行、审批、模板与运行限制（M06）
security:
  - sessionCookie: []
x-riccon-deferred:
  - id: platform-cross-tenant-audit
    status: M10+ (unplanned)
    reason: 平台管理员跨租户审计明细需显式授权、二次确认与独立审计；M10 只允许平台查询 platform 租户自身事件（DEC-0013、M03 F-009，residual 不是 fixed）。
  - id: mfa
    status: M10+ (unplanned)
    reason: M10 不强制 MFA、不校验 acr/amr；IdP 可能自行启用，但平台不声称强认证（DEC-0013）。
  - id: audit-hash-chain
    status: M10+ (unplanned)
    reason: M10 继续依赖 append-only 触发器与最小权限；不提供 prev_hash/event_hash 或外部锚定（DEC-0013）。
  - id: platform-tenant-audit-export
    status: M10+ (unplanned)
    reason: 平台租户只有平台管理员，M10 无独立同租户审批人，导出端点显式 403；需第二个平台管理员或独立审批模型（F-023）。
  - id: audit-export-archive
    status: M10+ (unplanned)
    reason: M10 导出为流式、不落盘、无归档/常驻链接/专用重复下载配额（F-020）。
  - id: byo-model-credentials
    status: M10+ (unplanned)
    reason: M04 只支持平台托管 key 池；租户自带 key 需独立 ADR（租户键、轮换、审计与配额）。
  - id: model-price-editing
    status: M09
    reason: M04 价格只读，由部署种子/运维维护；编辑/自助维护后移。
  - id: multi-currency
    status: deferred (unplanned)
    reason: M04 只支持部署配置的单一币种，不做汇率换算；多币种需独立 ADR。
  - id: billing-reconciliation
    status: deferred (unplanned)
    reason: 成本是估算，不是供应商账单；发票/对账/支付不在 v1。
  - id: cost-rollup
    status: deferred (unplanned)
    reason: M04 实时聚合 180 天内调用；预聚合表在 M09 观测到性能问题后再评估。
  - id: mcp-registration-credentials
    status: M07
    reason: M10 仍只允许平台内置白名单，不提供注册 UI 与凭据托管。
  - id: mcp-catalog-admin
    status: M07
    reason: M04 只收口三个模型端点；`/admin/mcp-servers`、`/admin/mcp-tools` 保留路径但实现延后到 M07。
  - id: workspace-archive
    status: M09
    reason: 归档/生命周期与保留策略由 M09 统一设计；M04 不实现归档端点。
  - id: workflow-template-sharing
    status: M06b
    reason: M06 只提供内置模板列表/复制；用户另存模板、租户内共享、升级提示与模板库在 M06b/M26（AC-11/25），M06 契约仅预留只读字段。
  - id: workflow-code-execution
    status: not planned
    reason: 代码执行/脚本/任意 HTTP/并行/循环/子流程/定时触发不在 M06；开放前必须另立模块并重开威胁模型（ADR-0024 §9.3）。
  - id: workflow-result-artifact
    status: deferred (P1)
    reason: M06 运行结果只在详情内查看；另存为工作空间产物复用现有 artifact 模型，后续评估（OQ-M06-14）。
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      description: 匿名可调用；会建立仅承载 CSRF 令牌的匿名会话。登录成功后使用登录响应中的新令牌。
      security: []
      responses:
        "200":
          description: CSRF 令牌
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 内置账号登录
      description: |
        统一失败提示：租户不存在、账号不存在、密码错误、账号锁定均返回 401 `RICCON-AUTH-001`。
        登录成功后轮换会话 ID，并返回新的 CSRF 令牌。
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Set-Cookie:
              description: 会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 读取当前会话
      description: 返回当前用户、租户、角色、权限与当前 CSRF 令牌；未登录返回 401。
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: |
        使本地会话立即失效并写 `auth.logout` 审计；浏览器后退不能恢复登录态。
        本地登出先执行且不依赖 IdP；若当前账号为 OIDC 且租户配置了 end-session 端点，响应头
        `X-Riccon-Federated-Logout-Url` 提供 IdP 联合登出地址（不含 token），前端随后自动顶层导航结束 IdP 会话，
        再由 `post_logout_redirect_uri` 回到登录页。IdP 不可达时本地登出已成功并提示仅本地退出。
        DEC-0017 A：点击一次登出即尝试同时结束 IdP 会话，不使用第二次点击。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已登出
          headers:
            X-Riccon-Federated-Logout-Url:
              description: 可选；IdP RP-Initiated Logout 地址（绝对 HTTPS，带 client_id 与 post_logout_redirect_uri，不含 token）。前端收到后自动顶层导航；IdP 不可达时本地登出仍已成功。
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/oidc/providers:
    get:
      tags: [Auth]
      operationId: getOidcProviderAvailability
      summary: 查询租户企业账号登录可用性
      description: |
        匿名可调用；未知租户、未配置 IdP、已停用与租户不存在统一返回 `enabled=false`，不返回租户名、IdP 地址或错误差异。
        仅用于登录页决定是否展示“企业账号登录”入口。
      security: []
      parameters:
        - name: tenantCode
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
      responses:
        "200":
          description: 企业登录可用性
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/oidc/authorize/{registrationId}:
    get:
      tags: [Auth]
      operationId: startOidcAuthorization
      summary: 发起企业账号登录
      description: |
        顶层浏览器导航；服务端在会话中保存 state、nonce 与 PKCE verifier 后 302 到 IdP 授权端点。
        `registrationId` 为 `tenant-{tenantCode}`；未配置 IdP 返回 404。该端点不返回 JSON。
      security: []
      parameters:
        - $ref: "#/components/parameters/OidcRegistrationId"
      responses:
        "302":
          description: 重定向到 IdP 授权端点
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/oidc/callback/{registrationId}:
    get:
      tags: [Auth]
      operationId: completeOidcAuthorization
      summary: OIDC 登录回调
      description: |
        IdP 回调入口。校验 state/nonce/PKCE 与 ID Token 后建立既有会话并轮换 CSRF；成功后 302 到工作空间。
        失败时 302 到 `/login?oidcError=<原因码>`，原因码为 `idp_unavailable`、`state_invalid`、`access_denied`、
        `account_not_bound`、`account_disabled`、`tenant_unavailable`、`issuer_mismatch`、`rate_limited`、`login_failed`。
        响应不包含 IdP 原始错误、token、code、state、内部地址或堆栈。
      security: []
      parameters:
        - $ref: "#/components/parameters/OidcRegistrationId"
      responses:
        "302":
          description: 成功回到工作空间，或失败回到登录页并带 `oidcError`
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: 成功时的会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces:
    get:
      tags: [Workspace]
      operationId: listWorkspaces
      summary: 列出可访问工作空间
      description: 个人空间仅本人；部门空间按 DEPT/CUSTOM 可见性；历史 TENANT 空间对本租户启用员工可见。不返回不可访问空间的名称或数量。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/WorkspaceKind"
      responses:
        "200":
          description: 工作空间列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Workspace]
      operationId: createWorkspace
      summary: 创建部门工作空间
      description: |
        创建团队空间必须提供 `departmentId`，可见性只能是 `DEPT` 或 `CUSTOM`（默认 `DEPT`）。
        租户管理员可为任意启用部门创建；部门负责人只能为本部门创建。`TENANT` 不允许新建。
      x-riccon-permission: workspace.write
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceId}:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      summary: 读取工作空间
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 工作空间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workspace]
      operationId: updateWorkspace
      summary: 修改工作空间
      description: |
        重命名、改描述、切换 `DEPT`/`CUSTOM` 可见性；仅租户管理员或本部门负责人可操作。
        `TENANT` 历史空间在 M03 只读，不提供转换；跨部门管理返回 404。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [Workspace]
      operationId: listWorkspaceMembers
      summary: 列出 CUSTOM 空间显式成员
      description: 仅 `CUSTOM` 空间返回成员；`DEPT`/`TENANT` 空间的显式成员为空数组。仅租户管理员或本部门负责人可调用，跨部门 404。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 显式成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Workspace]
      operationId: addWorkspaceMember
      summary: 加入 CUSTOM 空间显式成员
      description: |
        目标账号必须是该空间所属部门的当前启用成员；重复加入返回 409 `RICCON-DEPT-409`。
        `DEPT`/`TENANT` 空间不接受显式成员（400）。仅租户管理员或本部门负责人可调用。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberAddRequest"
      responses:
        "201":
          description: 已加入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    delete:
      tags: [Workspace]
      operationId: removeWorkspaceMember
      summary: 移出 CUSTOM 空间显式成员
      description: 幂等；成员不存在返回 204。仅租户管理员或本部门负责人可调用。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已移出或本来不存在
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceId}/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: 列出工作空间文件
      description: |
        部门空间成员可列出该空间文件；个人空间仅本人；跨部门统一 404。下载仍会再次校验空间归属。
        原工作空间路径只按空间谓词判定，不因文档级 ACL 放宽而扩大；把文件加入知识库不改变本空间的可访问性，知识库列表/检索/下载另按文档 ACL 判定（M05）。
      x-riccon-permission: file.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: conversationId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 文件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Files]
      operationId: uploadFile
      summary: 上传文件
      description: |
        支持 PDF、DOCX、XLSX、PNG、JPEG；单文件 ≤ 200 MB；单会话 ≤ 5 个文件。
        同时校验扩展名、Content-Type 与 magic bytes；文件先写对象存储，再在同事务写元数据与 `file.uploaded` 审计。
        上传只进入工作空间，不自动加入知识库；加入后的文档可见范围由知识库文档 ACL 决定，且不改变原空间路径的访问判定（M05）。
      x-riccon-permission: file.upload
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                conversationId:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: 已上传并受理解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/files/{fileId}:
    get:
      tags: [Files]
      operationId: getFile
      summary: 读取文件元数据与解析状态
      x-riccon-permission: file.read
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 文件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: 删除文件
      description: 软删除元数据并写 `file.deleted` 审计；对象清理由提交后的补偿任务执行。
      x-riccon-permission: file.delete
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/files/{fileId}/download-url:
    get:
      tags: [Files]
      operationId: getFileDownloadUrl
      summary: 获取文件下载地址
      description: 服务端校验归属后签发预签名 URL，TTL ≤ 300 秒；URL 绑定对象 key。
      x-riccon-permission: file.read
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 下载地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/files/{fileId}/parse-retries:
    post:
      tags: [Files]
      operationId: retryFileParse
      summary: 重试文件解析
      description: 仅允许对失败文件重试；创建新的解析尝试，不覆盖历史失败记录。
      x-riccon-permission: file.upload
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/workspaces/{workspaceId}/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: 列出工作空间会话
      description: |
        部门空间返回该空间内全部会话，供空间成员继续使用（M03-AC-04）；个人空间只返回本人会话。
        跨部门与跨租户统一 404；列表不返回不可访问空间的计数。
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: 新建会话
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: 读取会话与最近消息
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
