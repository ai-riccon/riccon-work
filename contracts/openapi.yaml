          description: 实际有值范围（如 `A1:F20`）；空表可为 `null`。
        empty:
          type: boolean
        indexed:
          type: boolean
          description: 是否已索引；截断工作表可能只索引部分范围。
        indexedRange:
          type: [string, "null"]
          description: 已索引范围；与整表范围不同表示存在未索引部分。
      additionalProperties: false
    KnowledgeParseOcrSummary:
