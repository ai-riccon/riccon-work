      summary: 订阅任务进度（SSE）
      description: |
        服务端按 `Last-Event-ID`/短轮询数据库状态派生事件；事件 schema 见
        contracts/events/sse/run-progress.v1.schema.json。连接空闲超时 60 秒。
      x-riccon-permission: report.read
      parameters:
