        "200":
          description: 空间元数据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Departments]
      operationId: createDepartmentWorkspace
      summary: 在部门下创建空间
      description: |
        部门路径即归属，避免负责人伪造 `departmentId`。可见性只允许 `DEPT`/`CUSTOM`（默认 `DEPT`）。
        租户管理员可对任意启用部门；负责人只能对本部门。停用部门返回 400。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentWorkspaceCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: 查询审计事件（只读）
      description: |
        按时间范围、动作、操作者、对象与结果过滤；租户只从已认证主体派生，不接受 `tenantId`。
        时间参数必须带偏移（如 `2026-11-01T00:00:00+08:00`）；缺省为最近 24 小时；最大跨度 180 天。
        排序固定 `occurredAt DESC, eventId DESC`；`page` 最大 200、`size` 最大 100。
        不返回 `source_ip`；查询成功后写 `audit.queried`。无创建/修改/删除接口。
      x-riccon-permission: audit.read
      parameters:
        - $ref: "#/components/parameters/OccurredFrom"
        - $ref: "#/components/parameters/OccurredTo"
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: targetType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditTargetType"
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditOutcome"
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
