        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 工具列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolPage"
        "401":
