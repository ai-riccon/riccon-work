      summary: 列出会话消息
      description: 按 seq 升序；使用 beforeSeq 做向前翻页。
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: beforeSeq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: 发送消息并流式接收回答
      description: |
        先持久化用户消息并创建 `agent_run`，再以 SSE 转发 Worker 增量。事件类型：
        `riccon.chat.started.v1`、`riccon.chat.delta.v1`、`riccon.chat.citation.v1`、
        `riccon.chat.completed.v1`、`riccon.chat.failed.v1`、`riccon.chat.stopped.v1`。
        首字前失败返回 ProblemDetail；首字后失败发送 failed 事件并结束流，已生成内容保留。
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: SSE 事件流
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 必须为 no-store
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  每帧格式：
                  `event: <eventType>`
                  `data: <chat-event.v1 JSON>`
                  空行结束。事件 schema 见 contracts/events/sse/chat-event.v1.schema.json。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
