        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: RICCON_SESSION
      description: 服务端会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）。
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF 令牌；从 GET /api/v1/auth/csrf 或登录响应获取。
      schema:
        type: string
        minLength: 16
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键；同一主体、同一资源重复请求返回既有结果。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchTaskId:
      name: researchTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeDocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: 平台管理员显式指定的目标租户代码。
      schema:
        type: string
        minLength: 1
        maxLength: 64
  headers:
    TraceId:
      description: 本次请求的 traceId；与错误响应和审计一致。
      schema:
        type: string
        maxLength: 64
  responses:
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: 未认证或凭据错误；不泄露账号是否存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: 已认证但无权限或 CSRF 校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: 对象不存在或属于其他租户；统一 404，不泄露存在性
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: 状态冲突、重复请求或超出会话文件上限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PayloadTooLarge:
      description: 文件超过 200 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnsupportedMediaType:
      description: 不支持的文件格式
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: 触发限流或队列背压
      headers:
        Retry-After:
          description: 建议重试秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: 未预期错误；响应不包含堆栈、SQL、内部主机或密钥
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: [string, "null"]
          format: uri
        code:
          type: string
          pattern: "^RICCON-[A-Z]+-[0-9]{3}$"
        traceId:
          type: string
          maxLength: 64
        tenantId:
          type: [string, "null"]
          description: 脱敏后的租户标识；平台级事件为 platform
      additionalProperties: false
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 16
      additionalProperties: false
    LoginRequest:
      type: object
      required: [tenantCode, username, password]
      properties:
        tenantCode:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
          format: password
      additionalProperties: false
    SessionInfo:
      type: object
      required:
        [authenticated, user, tenant, roles, permissions, csrfToken, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/UserSummary"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        roles:
          type: array
          items:
            type: string
          example: [MEMBER]
        permissions:
          type: array
          items:
            type: string
          example: [workspace.read, conversation.write]
        csrfToken:
          type: string
          minLength: 16
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    UserSummary:
      type: object
      required: [id, username, displayName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    TenantSummary:
      type: object
      required: [id, name, status, retentionDays]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        plan:
          type: string
        retentionDays:
          type: integer
          minimum: 30
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    TenantStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    WorkspaceKind:
      type: string
      enum: [PERSONAL, TEAM]
    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    FileStatus:
      type: string
      enum: [AVAILABLE, DELETED]
    FileFormat:
      type: string
      enum: [PDF, DOCX, XLSX, PNG, JPEG]
    ParseStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM, TOOL]
    MessageStatus:
      type: string
      enum: [PENDING, STREAMING, COMPLETED, STOPPED, FAILED]
    CitationSourceType:
      type: string
      enum: [FILE, KNOWLEDGE]
    LocatorType:
      type: string
      enum: [PAGE, SHEET, PARAGRAPH]
    KnowledgeDocumentStatus:
      type: string
      enum: [PENDING, INDEXING, INDEXED, FAILED, DELETED]
    ResearchTaskStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED, CANCELLED]
    RunStatus:
      type: string
      enum:
        [
          PENDING,
          RUNNING,
          WAITING_APPROVAL,
          RETRY_WAIT,
          SUCCEEDED,
          FAILED,
          CANCELLED,
        ]
    RunStage:
      type: string
      enum: [RETRIEVAL, TOOL, APPROVAL, GENERATION]
    StageStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED, SKIPPED]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED]
    ApprovalDecision:
      type: string
      enum: [APPROVE, REJECT]
    ArtifactStatus:
      type: string
      enum: [DRAFT, SAVED, DELETED]
    ModelPurpose:
      type: string
      enum: [CHAT, REPORT]
    InvocationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, FAILED, CANCELLED]
    McpToolRisk:
      type: string
      enum: [READ, WRITE]
    McpInvocationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, FAILED, DENIED]
    PageMeta:
      type: object
      required: [page, size, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    Workspace:
      type: object
      required: [id, kind, name, ownerUserId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        name:
          type: string
        description:
          type: [string, "null"]
        ownerUserId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkspacePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Workspace"
    WorkspaceCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 1000
      additionalProperties: false
    WorkspaceUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 1000
      additionalProperties: false
    FileParse:
      type: object
      required: [id, attempt, status]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ParseStatus"
        parserVersion:
          type: [string, "null"]
        pageCount:
          type: [integer, "null"]
        sheetCount:
          type: [integer, "null"]
        chunkCount:
          type: [integer, "null"]
        errorCode:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    File:
      type: object
      required:
        [
          id,
          workspaceId,
          originalName,
          format,
          mimeType,
          sizeBytes,
          sha256,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        conversationId:
          type: [string, "null"]
          format: uuid
        originalName:
          type: string
        format:
          $ref: "#/components/schemas/FileFormat"
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        status:
          $ref: "#/components/schemas/FileStatus"
        parse:
          oneOf:
            - $ref: "#/components/schemas/FileParse"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    FilePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/File"
    DownloadUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Conversation:
      type: object
      required: [id, workspaceId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
    ConversationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Conversation"
    ConversationCreateRequest:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 200
      additionalProperties: false
    ConversationUpdateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    Citation:
      type: object
      required: [ordinal, sourceType, title, snippet]
      properties:
        ordinal:
          type: integer
          minimum: 1
        sourceType:
          $ref: "#/components/schemas/CitationSourceType"
        fileId:
          type: [string, "null"]
          format: uuid
        knowledgeDocumentId:
          type: [string, "null"]
          format: uuid
        chunkId:
          type: [string, "null"]
          format: uuid
        locatorType:
          $ref: "#/components/schemas/LocatorType"
        pageNo:
          type: [integer, "null"]
          minimum: 1
        sheetName:
          type: [string, "null"]
        cellRange:
          type: [string, "null"]
        paragraphNo:
          type: [integer, "null"]
          minimum: 1
        title:
          type: string
        snippet:
          type: string
          maxLength: 1000
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 1
      additionalProperties: false
    Message:
      type: object
      required: [id, conversationId, seq, role, content, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        status:
          $ref: "#/components/schemas/MessageStatus"
        clientMessageId:
          type: [string, "null"]
        runId:
          type: [string, "null"]
          format: uuid
        modelId:
          type: [string, "null"]
          format: uuid
        errorCode:
          type: [string, "null"]
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    MessagePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Message"
    SendMessageRequest:
      type: object
      required: [content, clientMessageId]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000
        clientMessageId:
          type: string
          minLength: 8
          maxLength: 64
        fileIds:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
      additionalProperties: false
    StopRunRequest:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid
      additionalProperties: false
    ModelInvocation:
      type: object
      required: [id, modelId, modelKey, purpose, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        modelKey:
          type: string
        purpose:
          $ref: "#/components/schemas/ModelPurpose"
        status:
          $ref: "#/components/schemas/InvocationStatus"
        firstTokenMs:
          type: [integer, "null"]
        durationMs:
          type: [integer, "null"]
        promptTokens:
          type: [integer, "null"]
        completionTokens:
          type: [integer, "null"]
        errorCode:
          type: [string, "null"]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    RunStageRecord:
      type: object
      required: [stage, attempt, status]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        attempt:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/StageStatus"
        errorCode:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        details:
          type: [object, "null"]
          additionalProperties: true
      additionalProperties: false
    RunDetail:
      type: object
      required: [id, kind, status, attempt, startedAt, modelInvocations, stages]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CHAT, FILE_PARSE, KNOWLEDGE_INDEX, RESEARCH_REPORT]
        status:
          $ref: "#/components/schemas/RunStatus"
        currentStage:
          oneOf:
            - $ref: "#/components/schemas/RunStage"
            - type: "null"
        attempt:
          type: integer
          minimum: 1
        errorCode:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        modelInvocations:
          type: array
          items:
            $ref: "#/components/schemas/ModelInvocation"
        stages:
          type: array
