      type: object
      description: |
        运行阶段的白名单摘要。只允许 ID、计数、哈希、短文本与脱敏预览；禁止完整工具参数、
        工具结果原文、文件/会话/知识库原文、凭据与完整 PII。服务端必须在写入前裁剪，
        前端不得依赖未列出的键；未知键按 `additionalProperties` 容忍但不得展示原文。
      properties:
        query:
          type: string
          maxLength: 500
          description: 检索主题或查询摘要；不得包含完整文件内容或会话原文。
        querySha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: 查询文本的 SHA-256，用于审计核对。
        hitCount:
          type: integer
          minimum: 0
          description: 检索命中数。
        invocationId:
          type: string
          format: uuid
          description: TOOL 阶段对应的 MCP 调用 ID，等于 `McpInvocation.id`；用于时间线与调用记录对齐。
        toolId:
          type: string
          format: uuid
          description: 本阶段使用的 MCP 工具 ID。
        approvalId:
          type: string
          format: uuid
          description: APPROVAL/TOOL 阶段关联的审批 ID。
        paramsPreview:
          type: [object, "null"]
          description: |
            审批入参的脱敏摘要，仅用于展示。只允许白名单键与截断值（单个字符串 ≤ 200 字符，
            序列化后 ≤ 4096 字节）；禁止完整参数、文件/会话内容与凭据。完整参数只以密文保存在
            服务端，不通过任何 API 返回（ADR-0017）。
          maxProperties: 16
          additionalProperties: true
        resultSummary:
          type: string
          maxLength: 500
          description: 工具结果的脱敏摘要；不得包含结果原文，超长必须截断。
        generatedSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: 生成内容的 SHA-256，用于审计核对。
        generatedChars:
          type: integer
          minimum: 0
          description: 生成内容的字符数。
      additionalProperties: true
