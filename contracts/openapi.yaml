    get:
      tags: [Conversations]
      operationId: listMessages
      summary: 列出会话消息
      description: 按 seq 升序；使用 beforeSeq 做向前翻页。
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: beforeSeq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
