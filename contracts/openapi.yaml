  /api/v1/knowledge/documents:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeDocuments
      summary: 列出知识库文档
      description: |
        列表按文档级 ACL 过滤（M05）：`TENANT` 本租户全员可见；`DEPT` 仅同部门且部门 `ACTIVE`；`USERS` 仅显式名单与创建人。
        创建人始终可见；`TENANT_ADMIN` 管理性读取全量文档，绕过 ACL 时写 `knowledge.document.admin_read` 审计。
        不可见、跨租户、跨部门与已软删除文档不出现在列表，也不返回总数；原工作空间文件路径仍只按空间谓词判定，不因文档 ACL 放宽而扩大。
      x-riccon-permission: knowledge.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeDocumentStatus"
      responses:
        "200":
          description: 文档列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Knowledge]
      operationId: createKnowledgeDocument
      summary: 将已上传文件加入知识库
      description: |
        复用工作空间文件，异步解析并写入索引。`visibility` 缺省 `TENANT`；可选 `DEPT`（单个部门，须 `ACTIVE`）或 `USERS`（显式名单，最多 200 人）。
        保存前必须提示可见范围影响；创建人始终可见。加入知识库不改变原工作空间路径的访问判定，知识库列表/检索/引用/下载按文档 ACL 判定（M05）。
        `knowledge.manage` 当前仅 `TENANT_ADMIN` 持有；普通员工无登记权限。
      x-riccon-permission: knowledge.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentCreateRequest"
      responses:
        "202":
          description: 已受理索引
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
        "409":
          $ref: "#/components/responses/KnowledgeConflict"
  /api/v1/knowledge/documents/{documentId}:
    get:
      tags: [Knowledge]
      operationId: getKnowledgeDocument
      summary: 读取知识库文档
      description: |
        按文档 ACL 返回详情；不可见、跨租户、跨部门与已软删除统一 404。
        详情包含可见范围、解析引擎/警告/结构摘要、保留策略与 `sourceFileAccessLimited`；
        不返回对象 key、预签名 URL 或分块原文。`TENANT_ADMIN` 管理性读取绕过 ACL 时写 `knowledge.document.admin_read` 审计。
      x-riccon-permission: knowledge.read
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: 文档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
    delete:
      tags: [Knowledge]
      operationId: deleteKnowledgeDocument
      summary: 删除知识库文档
      description: |
        软删除并投递索引 DELETE；审计 `knowledge.document.deleted` 的 `reason=USER`；不物理删除对象与分块（物理清理由 M09 承接）。
        创建人或 `knowledge.acl.manage` 可删除；重复删除幂等，已软删除仍返回 204。文档不可见/跨租户统一 404；
        文档已可见但非创建人且非 `TENANT_ADMIN` 返回 403。
      x-riccon-permission: knowledge.acl.manage
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已软删除；重复删除幂等
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
  /api/v1/knowledge/documents/{documentId}/acl:
    get:
      tags: [Knowledge]
      operationId: getKnowledgeDocumentAcl
      summary: 读取知识库文档 ACL
      description: |
        返回整体可见范围、`USERS` 名单（userId/displayName）与创建人；创建人条目带 `creator=true`，不可移除。
        仅创建人或 `knowledge.acl.manage`（当前仅 `TENANT_ADMIN`）可读取；不可见/跨租户统一 404，已可见但无管理能力 403。
      x-riccon-permission: knowledge.acl.manage
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: 文档 ACL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentAcl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
    put:
      tags: [Knowledge]
      operationId: putKnowledgeDocumentAcl
      summary: 整体替换知识库文档 ACL
      description: |
        整体替换 `{visibility, departmentId?, userIds?}`，不是增量合并。`DEPT` 必须提供单个 `departmentId` 且部门 `ACTIVE`；
        `USERS` 的 `userIds` 最多 200 人；`TENANT` 不允许携带部门或名单。创建人始终可见且不可移除。
        变更下一次请求生效并写 `knowledge.acl.changed` 审计；审计失败则保存失败，不出现部分生效。
        仅创建人或 `knowledge.acl.manage`；不可见/跨租户统一 404，已可见但无管理能力 403。
      x-riccon-permission: knowledge.acl.manage
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentAclUpdate"
      responses:
        "200":
          description: 更新后的文档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
  /api/v1/knowledge/documents/{documentId}/download:
    get:
      tags: [Knowledge]
      operationId: downloadKnowledgeDocument
      summary: 下载知识库文档源文件
      description: |
        服务端按 `(tenant_id, documentId)` 解析源文件并流式代理返回，每次请求重判文档 ACL。
        `Content-Type` 为文档 `mimeType`（如 `application/pdf`；MIME 非法时回退 `application/octet-stream`），
        `Content-Disposition` 为 `attachment; filename="<ASCII 回退>"; filename*=UTF-8''<RFC 5987 编码文件名>`。
        不返回对象 key、预签名 URL 或存储端点；不因文档 ACL 放宽原工作空间路径。
        ACL 通过但文档无源文件（SEED 或已清理）返回 `RICCON-KB-404`；文档不可见、跨租户或跨部门返回 `RICCON-TENANT-404`；
        对象存储读取失败返回 `RICCON-KB-502`。
      x-riccon-permission: knowledge.read
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: |
            源文件字节流（服务端代理）。契约以 `application/octet-stream` 表达二进制载体；
            实际响应 `Content-Type` 为文档 `mimeType`（MIME 非法时回退 `application/octet-stream`），不使用 JSON 包装。
          headers:
            Content-Type:
              description: 文档 `mimeType`（如 `application/pdf`）；MIME 非法时回退 `application/octet-stream`；不回显对象存储端点
              schema:
                type: string
              example: application/pdf
            Content-Disposition:
              description: |
                `attachment` 附件；同时提供 ASCII 回退与 RFC 5987 编码：
                `attachment; filename="<ASCII 回退>"; filename*=UTF-8''<RFC 5987 编码文件名>`。
              schema:
                type: string
            Cache-Control:
              description: 固定 private, no-store，禁止共享缓存
              schema:
                type: string
            X-Content-Type-Options:
              description: 固定 nosniff
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeSourceNotFound"
        "502":
          $ref: "#/components/responses/KnowledgeDownloadFailed"
  /api/v1/knowledge/documents/{documentId}/reindex:
    post:
      tags: [Knowledge]
      operationId: reindexKnowledgeDocument
      summary: 重建知识库索引
      description: |
        缺省 `force=false` 只补缺失页/失败页，不重复已成功页；`force=true` 整本重做。重试幂等，不产生重复文档或重复引用。
        `knowledge.manage`（当前仅 `TENANT_ADMIN`）；创建人例外不替代 RBAC 门。文档不可见/跨租户统一 404；
        已可见但权限不足 403；已软删除或正在索引 409；索引队列或索引服务不可用 503。
      x-riccon-permission: knowledge.manage
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
        - name: force
          in: query
          required: false
          description: 缺省 `false` 只补缺失页；`true` 整本重做。
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
        "409":
          $ref: "#/components/responses/KnowledgeConflict"
        "503":
          $ref: "#/components/responses/KnowledgeIndexUnavailable"
  /api/v1/knowledge/connectors:
    get:
      tags: [Knowledge]
      operationId: listConnectors
      summary: 列出知识库连接器
      description: |
        分页返回本租户连接器列表；不含凭据、端点 URL、对象 key 或对象内容。跨租户连接器不出现。
        `knowledge.connector.read`（当前仅 `TENANT_ADMIN`）；同租户非管理员返回 403 `RICCON-AUTH-403`。
      x-riccon-permission: knowledge.connector.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: 按连接器状态过滤。
          schema:
            $ref: "#/components/schemas/ConnectorStatus"
        - name: type
          in: query
          required: false
          description: 按连接器类型过滤；M05b 只有 `S3`。
          schema:
            $ref: "#/components/schemas/ConnectorType"
      responses:
        "200":
          description: 连接器列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
    post:
      tags: [Knowledge]
      operationId: createConnector
      summary: 创建知识库连接器
      description: |
        创建 S3 兼容目录连接器，默认状态 `PAUSED`；`defaultVisibility` 必须显式提供（`TENANT` 或 `DEPT`，`DEPT` 必须同时给 `defaultDepartmentId`），
        缺省返回 400 `RICCON-KB-400`，不依赖数据库默认值。`endpointId` 必须来自部署允许列表，不能提交任意 URL。
        凭据可选写入，只进不出；响应只返回 `credentialMaskedHint`。名称在租户内唯一（软删除后同名不可重建），冲突返回 409 `RICCON-KB-409`。
        不支持 per-connector cron；`scheduleEnabled` 只表示是否参与部署固定周期同步。
      x-riccon-permission: knowledge.connector.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorCreate"
      responses:
        "201":
          description: 已创建的连接器（不含凭据）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "409":
          $ref: "#/components/responses/KnowledgeConflict"
  /api/v1/knowledge/connectors/{connectorId}:
    patch:
      tags: [Knowledge]
      operationId: updateConnector
      summary: 更新知识库连接器
      description: |
        部分更新配置、默认可见范围、端点与调度开关；不支持修改 `type`、per-connector cron 或直接写入 `ERROR` 状态，未知字段返回 400 `RICCON-KB-400`。
        显式启用/停用通过 `status=ACTIVE|PAUSED`；`ERROR` 只由同步结果产生，手动同步仍可重试。名称冲突返回 409 `RICCON-KB-409`。
        跨租户或不存在返回 404 `RICCON-TENANT-404`；同租户非管理员返回 403 `RICCON-AUTH-403`。
      x-riccon-permission: knowledge.connector.manage
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdate"
      responses:
        "200":
          description: 更新后的连接器（不含凭据）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
        "409":
          $ref: "#/components/responses/KnowledgeConflict"
    delete:
      tags: [Knowledge]
      operationId: deleteConnector
      summary: 软删除知识库连接器
      description: |
        软删除连接器并停止后续定时同步；`documents=KEEP`（默认）保留已导入文档，`documents=SOFT_DELETE` 同步软删除已导入文档并投递索引 DELETE。
        凭据密文保留 30 天供误删恢复，随后由 M09 维护任务置空；不提供在线凭据清除端点。已导入文档的原文不返回对象 key 或 bucket。
        跨租户或不存在返回 404 `RICCON-TENANT-404`；同租户非管理员返回 403 `RICCON-AUTH-403`。
      x-riccon-permission: knowledge.connector.manage
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - name: documents
          in: query
          required: false
          description: 已导入文档处置；默认 `KEEP`。
          schema:
            type: string
            enum: [KEEP, SOFT_DELETE]
            default: KEEP
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已软删除；已导入文档按 `documents` 处置
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
  /api/v1/knowledge/connectors/{connectorId}/credential:
    put:
      tags: [Knowledge]
      operationId: putConnectorCredential
      summary: 写入或轮换连接器凭据
      description: |
        只写不读：凭据经信封加密入库（`purpose=connector-credential`），响应只返回 `credentialMaskedHint`，不返回明文、密文或 DEK。
        重复写入即轮换，旧密文不保留；审计 `knowledge.connector.credential.changed` 只含 `credentialKeyId`/`maskedHint`，审计失败则写入失败。
        凭据只在 Worker 内存中解密使用，API 不调用连接器源。跨租户或不存在返回 404 `RICCON-TENANT-404`；同租户非管理员返回 403 `RICCON-AUTH-403`。
      x-riccon-permission: knowledge.connector.manage
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorCredential"
      responses:
        "200":
          description: 写入后的连接器（仅掩码）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
  /api/v1/knowledge/connectors/{connectorId}/test:
    post:
      tags: [Knowledge]
      operationId: testConnector
      summary: 连接测试
      description: |
        使用已托管凭据做一次 `ListObjectsV2`（`max-keys=1`）只读鉴权/连通性测试，空 bucket 也算成功；不写对象、不下载对象、不返回凭据或端点 URL。
        失败时仍返回 200，`success=false` 且按 `AUTH`/`NETWORK`/`ENDPOINT`/`CONFIG` 分类给中文原因；配置非法返回 400 `RICCON-KB-400`，
        连接器功能未启用或测试服务不可用返回 503 `RICCON-KB-503`。跨租户或不存在返回 404 `RICCON-TENANT-404`；同租户非管理员返回 403 `RICCON-AUTH-403`。
      x-riccon-permission: knowledge.connector.manage
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 连接测试结果（不含凭据）
