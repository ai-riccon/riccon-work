      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户配额分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuotaPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/quotas:
    get:
      tags: [Quotas, Admin]
      operationId: listPlatformQuotas
      summary: 平台租户配额聚合
      description: 只返回租户聚合限额/用量/重置时间，不返回租户内用户明细。
      x-riccon-permission: platform.quota.manage
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 租户配额分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformQuotaPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/tenants/{tenantId}/quotas:
    put:
      tags: [Quotas, Admin]
      operationId: updateTenantQuota
      summary: 设置租户级配额
      description: |
        整体替换租户级日/月限额；`null` 表示明确不限。平台管理员写；跨租户/不存在 404；停用租户 409。
        审计 `quota.limit.changed`，审计失败则失败。
      x-riccon-permission: platform.quota.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaUpdateRequest"
      responses:
        "200":
          description: 更新后的租户配额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/tenants/{tenantId}/users/{userId}/quotas:
    put:
      tags: [Quotas, Admin]
      operationId: updateUserQuota
      summary: 设置用户级配额
      description: 整体替换目标用户日/月限额；用户必须属于目标租户且启用；跨租户 404。审计同上。
      x-riccon-permission: platform.quota.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaUpdateRequest"
      responses:
        "200":
          description: 更新后的用户配额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/costs:
    get:
      tags: [Costs]
      operationId: getTenantCostReport
      summary: 本租户成本聚合
      description: |
        租户管理员只读；`groupBy=USER|MODEL|DAY`；金额为调用时价格快照估算，6 位小数字符串；
        只返回本租户。默认最近 30 天，最大 180 天。
      x-riccon-permission: cost.read
      parameters:
        - $ref: "#/components/parameters/CostFrom"
        - $ref: "#/components/parameters/CostTo"
        - $ref: "#/components/parameters/TenantCostGroupBy"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 成本报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCostReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/costs/invocations:
    get:
      tags: [Costs]
      operationId: listTenantCostInvocations
      summary: 本租户调用成本明细
      description: 返回价格快照、token、金额与定价状态；只本租户；平台管理员无此端点。
      x-riccon-permission: cost.read
      parameters:
        - $ref: "#/components/parameters/CostFrom"
        - $ref: "#/components/parameters/CostTo"
        - name: userId
          in: query
          required: false
          description: 只看某个用户的调用；必须属于本租户。
          schema:
            type: string
            format: uuid
        - name: modelId
          in: query
          required: false
          description: 只看某个模型的调用。
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 调用成本分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostInvocationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/costs:
    get:
      tags: [Costs, Admin]
      operationId: getPlatformCostReport
      summary: 平台跨租户成本聚合
      description: |
        `groupBy=TENANT|MODEL|DAY`；只返回租户聚合，不返回用户维度；可选 `tenantId` 过滤。
        金额口径同租户报告；固定文案在 `disclaimer`。
      x-riccon-permission: platform.cost.read
      parameters:
        - $ref: "#/components/parameters/CostFrom"
        - $ref: "#/components/parameters/CostTo"
        - $ref: "#/components/parameters/PlatformCostGroupBy"
        - name: tenantId
          in: query
          required: false
          description: 只看某个租户的聚合；仍不返回用户明细。
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 成本报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCostReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: RICCON_SESSION
      description: 服务端会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）。
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF 令牌；从 GET /api/v1/auth/csrf 或登录响应获取。
      schema:
        type: string
        minLength: 16
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键；同一主体、同一资源重复请求返回既有结果。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AuditPage:
      name: page
      in: query
      required: false
      description: 审计查询页码；超过 200 返回 400 `RICCON-AUDIT-400`，请缩小时间范围或改用导出。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchTaskId:
      name: researchTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeDocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: 平台管理员显式指定的目标租户代码。
      schema:
        type: string
        minLength: 1
        maxLength: 64
    OidcRegistrationId:
      name: registrationId
      in: path
      required: true
      description: OIDC 注册 ID，固定为 `tenant-{tenantCode}`。
      schema:
        type: string
        pattern: "^tenant-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
    AuditExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OccurredFrom:
      name: occurredFrom
      in: query
      required: false
      description: 起始时间，ISO 8601 且必须带偏移；缺省为最近 24 小时。
      schema:
        type: string
        format: date-time
        example: "2026-11-01T00:00:00+08:00"
    OccurredTo:
      name: occurredTo
      in: query
      required: false
      description: 结束时间，ISO 8601 且必须带偏移；与起始时间跨度不超过 180 天。
      schema:
        type: string
        format: date-time
        example: "2026-11-19T23:59:59+08:00"
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelRoutingPurpose:
      name: purpose
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModelPurpose"
    CostFrom:
      name: from
      in: query
      required: false
      description: 起始自然日（`Asia/Shanghai`，含）；默认最近 30 天，与 `to` 跨度不超过 180 天。
      schema:
        type: string
        format: date
        example: "2026-11-01"
    CostTo:
      name: to
      in: query
      required: false
      description: 结束自然日（`Asia/Shanghai`，含）。
      schema:
        type: string
        format: date
        example: "2026-11-30"
    TenantCostGroupBy:
      name: groupBy
      in: query
      required: false
      description: 租户成本聚合维度；默认 `DAY`。
      schema:
        type: string
        enum: [USER, MODEL, DAY]
        default: DAY
    PlatformCostGroupBy:
      name: groupBy
      in: query
      required: false
      description: 平台成本聚合维度；默认 `DAY`；不接受 `USER`。
      schema:
        type: string
        enum: [TENANT, MODEL, DAY]
        default: DAY
  headers:
    TraceId:
      description: 本次请求的 traceId；与错误响应和审计一致。
      schema:
        type: string
        maxLength: 64
  responses:
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: 未认证或凭据错误；不泄露账号是否存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: 已认证但无权限或 CSRF 校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: 对象不存在或属于其他租户；统一 404，不泄露存在性
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: 状态冲突、重复请求、多部门/重复成员冲突（部门成员冲突使用 `RICCON-DEPT-409`）、OIDC 绑定冲突（`RICCON-OIDC-409`）或审计导出状态冲突（`RICCON-AUDIT-409`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Gone:
      description: 审计导出已过期（`RICCON-AUDIT-410`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PayloadTooLarge:
      description: 文件超过 200 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ArtifactContentTooLarge:
      description: 产物正文超过 2 MiB 的同源代理上限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadGateway:
      description: 对象存储读取失败或产物正文暂不可用；响应不包含存储地址、key 或凭据
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnsupportedMediaType:
      description: 不支持的文件格式
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: 触发限流、队列背压或配额超限（配额使用 `RICCON-QUOTA-429` 与 `QuotaExceededProblem`）
      headers:
        Retry-After:
          description: 建议重试秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/RateLimitedProblem"
              - $ref: "#/components/schemas/QuotaExceededProblem"
            discriminator:
              propertyName: code
              mapping:
                RICCON-RATE-429: "#/components/schemas/RateLimitedProblem"
                RICCON-QUEUE-429: "#/components/schemas/RateLimitedProblem"
                RICCON-QUOTA-429: "#/components/schemas/QuotaExceededProblem"
    QuotaExceeded:
      description: 已用尽租户/用户日或月配额；拒绝创建新 run，不产生模型调用（`RICCON-QUOTA-429`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/QuotaExceededProblem"
    ServiceUnavailable:
      description: 依赖不可用（配额存储、成本查询超时）；不返回部分结果（`RICCON-QUOTA-503`/`RICCON-COST-503`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: 未预期错误；响应不包含堆栈、SQL、内部主机或密钥
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: [string, "null"]
          format: uri
        code:
          type: string
          pattern: "^RICCON-[A-Z]+-[0-9]{3}$"
        traceId:
          type: string
          maxLength: 64
        tenantId:
          type: [string, "null"]
          description: 脱敏后的租户标识；平台级事件为 platform
      additionalProperties: false
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 16
      additionalProperties: false
    LoginRequest:
      type: object
      required: [tenantCode, username, password]
      properties:
        tenantCode:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
          format: password
      additionalProperties: false
    OidcProviderAvailability:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        providerName:
          type: [string, "null"]
          description: 仅 enabled=true 时返回；未知租户/未配置统一 enabled=false
      additionalProperties: false
    OidcBindingRequest:
      type: object
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          format: uri
          maxLength: 255
          description: 必须等于本租户配置的 issuer（规范化后）
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: IdP 的 subject（sub）；不存邮箱、不按邮箱匹配
      additionalProperties: false
    OidcUnbindRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
          format: password
          description: 恢复本地账号时设置的新密码；账号转回 LOCAL
      additionalProperties: false
    SessionInfo:
      type: object
      required:
        [authenticated, user, tenant, roles, permissions, csrfToken, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/UserSummary"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        roles:
          type: array
          items:
            type: string
          example: [MEMBER]
        permissions:
          type: array
          items:
            type: string
          example: [workspace.read, conversation.write]
        csrfToken:
          type: string
          minLength: 16
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    UserSummary:
      type: object
      required: [id, username, displayName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        departmentId:
          type: [string, "null"]
          format: uuid
          description: 主部门 ID；未分配时为 null
        departmentName:
          type: [string, "null"]
          description: 主部门名；停用部门仍显示名称
        authSource:
          $ref: "#/components/schemas/AuthSource"
        identityProvider:
          type: [string, "null"]
          maxLength: 255
          description: |
            来源 IdP 的脱敏展示名。OIDC 优先使用租户配置的 `providerName`（仅当账号 issuer 与配置 issuer 一致），
            否则回退为 issuer 的 host（非默认端口保留，如 `idp.example.com`）；LOCAL、未知来源或无法解析时为 null 并省略字段。
            不返回完整 issuer 路径、subject、token 或邮箱。
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    TenantSummary:
      type: object
      required: [id, name, status, retentionDays]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        plan:
          type: string
        retentionDays:
          type: integer
          minimum: 30
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    AuthSource:
      type: string
      enum: [LOCAL, OIDC]
      description: LOCAL 使用本地密码；OIDC 使用 issuer + subject 绑定且没有本地密码凭据
    TenantStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    WorkspaceKind:
      type: string
      enum: [PERSONAL, TEAM]
    WorkspaceVisibility:
      type: string
      description: |
        `PRIVATE` 仅个人空间；`TENANT` 仅 M02 历史空间（禁止新建）；
        `DEPT` 本部门当前启用成员；`CUSTOM` 本部门当前启用成员中显式加入的人。
      enum: [PRIVATE, TENANT, DEPT, CUSTOM]
    DepartmentStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    FileStatus:
      type: string
      enum: [AVAILABLE, DELETED]
    FileFormat:
      type: string
      enum: [PDF, DOCX, XLSX, PNG, JPEG]
    ParseStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM, TOOL]
    MessageStatus:
      type: string
      enum: [PENDING, STREAMING, COMPLETED, STOPPED, FAILED]
    CitationSourceType:
      type: string
      enum: [FILE, KNOWLEDGE]
    LocatorType:
      type: string
      enum: [PAGE, SHEET, PARAGRAPH]
    KnowledgeDocumentStatus:
      type: string
      enum: [PENDING, INDEXING, INDEXED, FAILED, DELETED]
    ResearchTaskStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED, CANCELLED]
    RunStatus:
      type: string
      enum:
        [
          PENDING,
          RUNNING,
