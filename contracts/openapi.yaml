        仅用于单管理员租户（ACTIVE `TENANT_ADMIN` ≤1）；多管理员租户返回 409 `RICCON-AUDIT-409`，必须由同租户另一管理员审批。
      x-riccon-permission: platform.audit.export.approve
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditExportStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 导出请求分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/tenants/{tenantId}/audit-exports/{exportId}/decision:
    post:
      tags: [Admin]
      operationId: decideTenantAuditExportForPlatform
      summary: 平台管理员审批目标租户审计导出请求
      description: |
        仅用于单管理员租户（ACTIVE `TENANT_ADMIN` ≤1）；多管理员租户返回 409 `RICCON-AUDIT-409`。
        平台管理员只能看/决定请求元数据，不能下载或查询审计内容。
        批准后写 `audit.export.approved` 到 `platform` 租户并带 `details.targetTenantId`；自批、跨租户、已决定或并发审批被拒。
      x-riccon-permission: platform.audit.export.approve
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AuditExportId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportDecisionRequest"
      responses:
        "200":
          description: 已审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/model-providers:
    get:
      tags: [Admin]
      operationId: listModelProviders
      summary: 平台模型供应商目录（只读）
      x-riccon-permission: platform.model.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 供应商列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProviderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/models:
    get:
      tags: [Admin]
      operationId: listModelsForPlatform
      summary: 平台模型目录（只读）
      x-riccon-permission: platform.model.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/mcp-servers:
    get:
      tags: [Admin]
      operationId: listMcpServers
      summary: 平台 MCP server 目录（只读）
      x-riccon-permission: platform.mcp.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: server 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/mcp-tools:
    get:
      tags: [Admin]
      operationId: listMcpToolsForPlatform
      summary: 平台 MCP 工具目录（只读）
      x-riccon-permission: platform.mcp.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 工具列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: RICCON_SESSION
      description: 服务端会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）。
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF 令牌；从 GET /api/v1/auth/csrf 或登录响应获取。
      schema:
        type: string
        minLength: 16
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键；同一主体、同一资源重复请求返回既有结果。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AuditPage:
      name: page
      in: query
      required: false
      description: 审计查询页码；超过 200 返回 400 `RICCON-AUDIT-400`，请缩小时间范围或改用导出。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchTaskId:
      name: researchTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeDocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: 平台管理员显式指定的目标租户代码。
      schema:
        type: string
        minLength: 1
        maxLength: 64
    OidcRegistrationId:
      name: registrationId
      in: path
      required: true
      description: OIDC 注册 ID，固定为 `tenant-{tenantCode}`。
      schema:
        type: string
        pattern: "^tenant-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
    AuditExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OccurredFrom:
      name: occurredFrom
      in: query
      required: false
      description: 起始时间，ISO 8601 且必须带偏移；缺省为最近 24 小时。
      schema:
        type: string
        format: date-time
        example: "2026-11-01T00:00:00+08:00"
    OccurredTo:
      name: occurredTo
      in: query
      required: false
      description: 结束时间，ISO 8601 且必须带偏移；与起始时间跨度不超过 180 天。
      schema:
        type: string
        format: date-time
        example: "2026-11-19T23:59:59+08:00"
  headers:
    TraceId:
      description: 本次请求的 traceId；与错误响应和审计一致。
      schema:
        type: string
        maxLength: 64
  responses:
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: 未认证或凭据错误；不泄露账号是否存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: 已认证但无权限或 CSRF 校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: 对象不存在或属于其他租户；统一 404，不泄露存在性
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: 状态冲突、重复请求、多部门/重复成员冲突（部门成员冲突使用 `RICCON-DEPT-409`）、OIDC 绑定冲突（`RICCON-OIDC-409`）或审计导出状态冲突（`RICCON-AUDIT-409`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Gone:
      description: 审计导出已过期（`RICCON-AUDIT-410`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PayloadTooLarge:
      description: 文件超过 200 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ArtifactContentTooLarge:
      description: 产物正文超过 2 MiB 的同源代理上限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadGateway:
      description: 对象存储读取失败或产物正文暂不可用；响应不包含存储地址、key 或凭据
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnsupportedMediaType:
      description: 不支持的文件格式
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: 触发限流或队列背压
      headers:
        Retry-After:
          description: 建议重试秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: 未预期错误；响应不包含堆栈、SQL、内部主机或密钥
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: [string, "null"]
          format: uri
        code:
          type: string
          pattern: "^RICCON-[A-Z]+-[0-9]{3}$"
        traceId:
          type: string
          maxLength: 64
        tenantId:
          type: [string, "null"]
          description: 脱敏后的租户标识；平台级事件为 platform
      additionalProperties: false
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 16
      additionalProperties: false
    LoginRequest:
      type: object
      required: [tenantCode, username, password]
      properties:
        tenantCode:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
          format: password
      additionalProperties: false
    OidcProviderAvailability:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        providerName:
          type: [string, "null"]
          description: 仅 enabled=true 时返回；未知租户/未配置统一 enabled=false
      additionalProperties: false
    OidcBindingRequest:
      type: object
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          format: uri
          maxLength: 255
          description: 必须等于本租户配置的 issuer（规范化后）
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: IdP 的 subject（sub）；不存邮箱、不按邮箱匹配
      additionalProperties: false
    OidcUnbindRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
          format: password
          description: 恢复本地账号时设置的新密码；账号转回 LOCAL
      additionalProperties: false
    SessionInfo:
      type: object
      required:
        [authenticated, user, tenant, roles, permissions, csrfToken, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/UserSummary"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        roles:
          type: array
          items:
            type: string
          example: [MEMBER]
        permissions:
          type: array
          items:
            type: string
          example: [workspace.read, conversation.write]
        csrfToken:
          type: string
          minLength: 16
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    UserSummary:
      type: object
      required: [id, username, displayName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        departmentId:
          type: [string, "null"]
          format: uuid
          description: 主部门 ID；未分配时为 null
        departmentName:
          type: [string, "null"]
          description: 主部门名；停用部门仍显示名称
        authSource:
          $ref: "#/components/schemas/AuthSource"
        identityProvider:
          type: [string, "null"]
          maxLength: 255
          description: |
            来源 IdP 的脱敏展示名。OIDC 优先使用租户配置的 `providerName`（仅当账号 issuer 与配置 issuer 一致），
            否则回退为 issuer 的 host（非默认端口保留，如 `idp.example.com`）；LOCAL、未知来源或无法解析时为 null 并省略字段。
            不返回完整 issuer 路径、subject、token 或邮箱。
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    TenantSummary:
      type: object
      required: [id, name, status, retentionDays]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        plan:
          type: string
        retentionDays:
          type: integer
          minimum: 30
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    AuthSource:
      type: string
      enum: [LOCAL, OIDC]
      description: LOCAL 使用本地密码；OIDC 使用 issuer + subject 绑定且没有本地密码凭据
    TenantStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    WorkspaceKind:
      type: string
      enum: [PERSONAL, TEAM]
    WorkspaceVisibility:
      type: string
      description: |
        `PRIVATE` 仅个人空间；`TENANT` 仅 M02 历史空间（禁止新建）；
        `DEPT` 本部门当前启用成员；`CUSTOM` 本部门当前启用成员中显式加入的人。
      enum: [PRIVATE, TENANT, DEPT, CUSTOM]
    DepartmentStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    FileStatus:
      type: string
      enum: [AVAILABLE, DELETED]
    FileFormat:
      type: string
      enum: [PDF, DOCX, XLSX, PNG, JPEG]
    ParseStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM, TOOL]
    MessageStatus:
      type: string
      enum: [PENDING, STREAMING, COMPLETED, STOPPED, FAILED]
    CitationSourceType:
      type: string
      enum: [FILE, KNOWLEDGE]
    LocatorType:
      type: string
      enum: [PAGE, SHEET, PARAGRAPH]
    KnowledgeDocumentStatus:
      type: string
      enum: [PENDING, INDEXING, INDEXED, FAILED, DELETED]
    ResearchTaskStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED, CANCELLED]
    RunStatus:
      type: string
      enum:
        [
          PENDING,
          RUNNING,
          WAITING_APPROVAL,
          RETRY_WAIT,
          SUCCEEDED,
          FAILED,
          CANCELLED,
        ]
    RunStage:
      type: string
      enum: [RETRIEVAL, TOOL, APPROVAL, GENERATION]
    StageStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED, SKIPPED]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED]
    ApprovalDecision:
      type: string
      enum: [APPROVE, REJECT]
    ArtifactStatus:
      type: string
      enum: [DRAFT, SAVED, DELETED]
    ModelPurpose:
      type: string
      enum: [CHAT, REPORT]
    InvocationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, FAILED, CANCELLED]
    McpToolRisk:
      type: string
      enum: [READ, WRITE]
    McpInvocationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, FAILED, DENIED]
    PageMeta:
      type: object
      required: [page, size, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    AuditActorType:
      type: string
      enum: [USER, SERVICE, SYSTEM]
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE, DENIED]
    AuditTargetType:
      type: string
      enum:
        [
          SESSION,
          WORKSPACE,
          DEPARTMENT,
          FILE,
          CONVERSATION,
          KNOWLEDGE_DOCUMENT,
          RESEARCH_TASK,
          RUN,
          ARTIFACT,
          MODEL,
          MCP_TOOL,
          USER,
          ROLE,
          TENANT,
          AUDIT,
          AUDIT_EXPORT,
        ]
    AuditEvent:
      type: object
      required:
        [
          eventId,
          occurredAt,
          tenantId,
          actorType,
          actorId,
          action,
          outcome,
          traceId,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: 带偏移的 ISO 8601；数据库存 UTC
        tenantId:
          type: string
        actorType:
          $ref: "#/components/schemas/AuditActorType"
        actorId:
          type: string
          maxLength: 64
        actorDisplayName:
          type: [string, "null"]
          description: 读取时按当前账号解析，仅 USER；非历史快照，不含邮箱
        action:
          type: string
          maxLength: 100
        targetType:
          oneOf:
            - $ref: "#/components/schemas/AuditTargetType"
            - type: "null"
        targetId:
          type: [string, "null"]
          maxLength: 64
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        traceId:
          type: string
          maxLength: 64
        details:
          type: [object, "null"]
          additionalProperties: true
          description: 写入时已通过白名单的 JSON；读取/导出时复用 action-aware 白名单（允许 promptTokens/completionTokens 等合法键），白名单外或敏感键 fail-closed
      additionalProperties: false
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
    AuditExportLimits:
      type: object
      required: [ttlHours, rowLimit]
      properties:
        ttlHours:
          type: integer
          minimum: 1
          maximum: 168
        rowLimit:
          type: integer
          minimum: 1
          maximum: 50000
      additionalProperties: false
    AuditPolicy:
      type: object
      required:
        [
          retentionDays,
          maxRangeDays,
          pageSizeMax,
          maxPage,
          actions,
          exportLimits,
        ]
      properties:
        retentionDays:
          type: integer
          minimum: 180
        maxRangeDays:
          type: integer
          const: 180
        pageSizeMax:
          type: integer
          const: 100
        maxPage:
          type: integer
          const: 200
        actions:
          type: array
          items:
            type: string
        exportLimits:
          $ref: "#/components/schemas/AuditExportLimits"
      additionalProperties: false
    AuditFilter:
      type: object
      properties:
        occurredFrom:
          type: string
          format: date-time
          description: 带偏移；省略时服务端按最近 24 小时解析并固化
        occurredTo:
          type: string
          format: date-time
          description: 带偏移；与 from 跨度不超过 180 天；省略时按当前时间解析并固化
        action:
          type: string
          maxLength: 100
        actorId:
          type: string
