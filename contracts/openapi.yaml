        traceId:
          type: string
          maxLength: 64
        tenantId:
          type: [string, "null"]
      additionalProperties: false
      description: 限流/队列背压；与 `QuotaExceededProblem` 用 `code` 判别。
    CostPricingStatus:
      type: string
      enum: [PRICED, UNPRICED, USAGE_UNKNOWN]
    CostTotals:
      type: object
      required:
        [
          currency,
          amount,
          pricedCalls,
          unpricedCalls,
          usageUnknownCalls,
          currencyMismatchCalls,
          unbucketedCalls,
        ]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        amount:
          type: string
          pattern: "^\\d{1,14}(\\.\\d{1,6})?$"
          description: 6 位小数金额字符串；只汇总 PRICED，不对分桶先舍入。
        pricedCalls:
          type: integer
          minimum: 0
        unpricedCalls:
          type: integer
          minimum: 0
        usageUnknownCalls:
          type: integer
          minimum: 0
        currencyMismatchCalls:
          type: integer
          minimum: 0
          description: 历史快照币种与当前配置不一致的调用；不计入金额。
        unbucketedCalls:
          type: integer
          minimum: 0
          description: cost_day 为空（回滚窗口旧 Worker / 未回填）的调用；不计入金额，用于避免静默消失。
      additionalProperties: false
    TenantCostBucket:
      type: object
      required: [key, amount, pricedCalls, unpricedCalls, usageUnknownCalls]
      properties:
        key:
          type: string
        tenantId:
          type: [string, "null"]
        tenantCode:
          type: [string, "null"]
        modelId:
          type: [string, "null"]
          format: uuid
        modelDisplayName:
          type: [string, "null"]
        userId:
          type: [string, "null"]
          format: uuid
          description: 只出现在租户成本报告。
        userDisplayName:
          type: [string, "null"]
          description: 只出现在租户成本报告。
        day:
          type: [string, "null"]
          format: date
          description: "`Asia/Shanghai` 自然日；未分桶行不出现在 items。"
        amount:
          type: string
          pattern: "^\\d{1,14}(\\.\\d{1,6})?$"
        pricedCalls:
          type: integer
          minimum: 0
        unpricedCalls:
          type: integer
          minimum: 0
        usageUnknownCalls:
          type: integer
          minimum: 0
      additionalProperties: false
    PlatformCostBucket:
      type: object
      required: [key, amount, pricedCalls, unpricedCalls, usageUnknownCalls]
      properties:
        key:
          type: string
        tenantId:
          type: [string, "null"]
        tenantCode:
          type: [string, "null"]
        modelId:
          type: [string, "null"]
          format: uuid
        modelDisplayName:
          type: [string, "null"]
        day:
          type: [string, "null"]
          format: date
          description: "`Asia/Shanghai` 自然日；未分桶行不出现在 items。"
        amount:
          type: string
          pattern: "^\\d{1,14}(\\.\\d{1,6})?$"
        pricedCalls:
          type: integer
          minimum: 0
        unpricedCalls:
          type: integer
          minimum: 0
        usageUnknownCalls:
          type: integer
          minimum: 0
      additionalProperties: false
      description: 平台成本桶；**不包含** userId/userDisplayName，防止跨租户用户明细泄露。
    TenantCostReport:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            [
              from,
              to,
              groupBy,
              currency,
              currencyMinorUnit,
              disclaimer,
              totals,
              items,
            ]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            groupBy:
              type: string
              enum: [USER, MODEL, DAY]
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
            currencyMinorUnit:
              type: integer
              minimum: 0
              maximum: 4
            disclaimer:
              type: string
              const: 成本为按调用时价格快照估算，不是供应商账单。
            totals:
              $ref: "#/components/schemas/CostTotals"
            items:
              type: array
              items:
                $ref: "#/components/schemas/TenantCostBucket"
    PlatformCostReport:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            [
              from,
              to,
              groupBy,
              currency,
              currencyMinorUnit,
              disclaimer,
              totals,
              items,
            ]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            groupBy:
              type: string
              enum: [TENANT, MODEL, DAY]
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
            currencyMinorUnit:
              type: integer
              minimum: 0
              maximum: 4
            disclaimer:
              type: string
              const: 成本为按调用时价格快照估算，不是供应商账单。
            totals:
              $ref: "#/components/schemas/CostTotals"
            items:
              type: array
              items:
                $ref: "#/components/schemas/PlatformCostBucket"
    CostInvocation:
      type: object
      required: [id, modelId, modelDisplayName, startedAt, pricingStatus]
      properties:
        id:
          type: string
