        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/model-routing/{purpose}:
    put:
      tags: [ModelGateway]
      operationId: updateModelRouting
      summary: 整链保存模型路由
      description: |
        整链替换（1..20 个去重模型，按顺序）。允许包含 DISABLED 模型；空链、未知模型、未授权端点、
        生产模式演示端点返回 400。`version` 不匹配返回 409 `RICCON-MODEL-409`。
        保存后下一次模型请求生效；审计 `model.routing.updated`，审计失败则保存失败。
      x-riccon-permission: platform.model.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ModelRoutingPurpose"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRoutingUpdateRequest"
      responses:
        "200":
          description: 保存后的链
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRouting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/model-providers/{providerId}/credentials:
    get:
      tags: [ModelGateway]
      operationId: listModelCredentials
      summary: 列出 provider 的 key（掩码）
      description: 只返回掩码、状态、优先级与时间字段；不返回明文、密文或 DEK。
      x-riccon-permission: platform.model.read
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: key 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentialPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ModelGateway]
      operationId: createModelCredential
      summary: 新增 provider key
      description: |
        明文只出现在请求体，服务端立即信封加密；响应只返回掩码。provider 必须在部署允许列表内。
        相同明文（fingerprint）返回 409 `RICCON-MODEL-409`。审计 `model.credential.created`，审计失败则失败。
        不承诺 `Idempotency-Key`；重复请求由 fingerprint 唯一键兜底。
      x-riccon-permission: platform.model.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCredentialCreateRequest"
      responses:
        "201":
          description: 新增的 key（掩码）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/model-providers/{providerId}/credentials/{credentialId}/rotate:
    post:
      tags: [ModelGateway]
      operationId: rotateModelCredential
      summary: 轮换 provider key
      description: |
        单事务插入新 key 并停用旧 key；在途请求不被取消，可能中断后重试。响应返回新 key 掩码与 `changed`。
        审计 `model.credential.rotated`（含新旧 credentialId），审计失败则回滚。
      x-riccon-permission: platform.model.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCredentialRotateRequest"
      responses:
        "200":
          description: 新 key（掩码）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/model-providers/{providerId}/credentials/{credentialId}/disable:
    post:
      tags: [ModelGateway]
      operationId: disableModelCredential
      summary: 停用 key
      description: 条件更新；新请求不再使用；在途继续。响应 `changed=false` 表示已是停用态（不重复审计）。
      x-riccon-permission: platform.model.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: 停用后的 key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/model-providers/{providerId}/credentials/{credentialId}/enable:
    post:
      tags: [ModelGateway]
      operationId: enableModelCredential
      summary: 恢复 key
      description: 将 DISABLED/INVALID 恢复为 ACTIVE，清空冷却与失效标记；用于 401 误判或密钥续期。
      x-riccon-permission: platform.model.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: 恢复后的 key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/model-gateway/switches:
    get:
      tags: [ModelGateway]
      operationId: getModelGatewaySwitches
      summary: 读取网关开关
      description: 返回 `routingMode`、`failoverEnabled`、`quotaEnforcementEnabled`、`version` 与环境覆盖；`source` 表示生效来源。
      x-riccon-permission: platform.model.read
      responses:
        "200":
          description: 开关
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelGatewaySwitches"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [ModelGateway]
      operationId: updateModelGatewaySwitches
      summary: 修改网关开关
      description: |
        下一次请求生效；`version` 乐观锁。环境变量覆盖生效时返回 409 `RICCON-MODEL-409`
        （`reason=ENV_OVERRIDE_ACTIVE`）。审计 `model.gateway.switch.changed`，审计失败则失败。
      x-riccon-permission: platform.model.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelGatewaySwitchesUpdateRequest"
      responses:
        "200":
          description: 更新后的开关
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelGatewaySwitches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/quotas:
    get:
      tags: [Quotas]
      operationId: getTenantQuota
      summary: 读取本租户配额与用量
      description: 租户管理员只读；日/月窗口、限额、已用与重置时间（`Asia/Shanghai`，带偏移）。员工 403。
      x-riccon-permission: quota.read
      responses:
        "200":
          description: 本租户配额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/quotas/users:
    get:
      tags: [Quotas]
      operationId: listTenantUserQuotas
      summary: 列出本租户用户配额
      description: 租户管理员只读；只返回本租户用户。平台管理员使用 `/admin/quotas`（聚合，无用户明细）。
      x-riccon-permission: quota.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户配额分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuotaPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/quotas:
    get:
      tags: [Quotas, Admin]
      operationId: listPlatformQuotas
      summary: 平台租户配额聚合
      description: 只返回租户聚合限额/用量/重置时间，不返回租户内用户明细。
      x-riccon-permission: platform.quota.manage
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 租户配额分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformQuotaPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/tenants/{tenantId}/quotas:
    put:
      tags: [Quotas, Admin]
      operationId: updateTenantQuota
      summary: 设置租户级配额
      description: |
        整体替换租户级日/月限额；`null` 表示明确不限。平台管理员写；跨租户/不存在 404；停用租户 409。
        审计 `quota.limit.changed`，审计失败则失败。
      x-riccon-permission: platform.quota.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaUpdateRequest"
      responses:
        "200":
          description: 更新后的租户配额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/tenants/{tenantId}/users/{userId}/quotas:
    put:
      tags: [Quotas, Admin]
      operationId: updateUserQuota
      summary: 设置用户级配额
      description: 整体替换目标用户日/月限额；用户必须属于目标租户且启用；跨租户 404。审计同上。
      x-riccon-permission: platform.quota.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaUpdateRequest"
      responses:
        "200":
          description: 更新后的用户配额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/costs:
    get:
      tags: [Costs]
      operationId: getTenantCostReport
      summary: 本租户成本聚合
      description: |
        租户管理员只读；`groupBy=USER|MODEL|DAY`；金额为调用时价格快照估算，6 位小数字符串；
        只返回本租户。默认最近 30 天，最大 180 天。
      x-riccon-permission: cost.read
      parameters:
        - $ref: "#/components/parameters/CostFrom"
        - $ref: "#/components/parameters/CostTo"
        - $ref: "#/components/parameters/TenantCostGroupBy"
        - $ref: "#/components/parameters/CostPage"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 成本报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCostReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/costs/invocations:
    get:
      tags: [Costs]
      operationId: listTenantCostInvocations
      summary: 本租户调用成本明细
      description: 返回价格快照、token、金额与定价状态；只本租户；平台管理员无此端点。
      x-riccon-permission: cost.read
      parameters:
        - $ref: "#/components/parameters/CostFrom"
        - $ref: "#/components/parameters/CostTo"
        - name: userId
          in: query
          required: false
          description: 只看某个用户的调用；必须属于本租户，指向其他租户或不存在的用户返回 404 `RICCON-TENANT-404`；非 UUID 由请求绑定返回 400 `RICCON-REQUEST-400`。
          schema:
            type: string
            format: uuid
        - name: modelId
          in: query
          required: false
          description: 只看某个模型的调用；`modelId` 是平台级模型目录 ID，不属于某个租户，未命中返回空结果；非 UUID 由请求绑定返回 400 `RICCON-REQUEST-400`。
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CostPage"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 调用成本分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostInvocationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/costs:
    get:
      tags: [Costs, Admin]
      operationId: getPlatformCostReport
      summary: 平台跨租户成本聚合
      description: |
        `groupBy=TENANT|MODEL|DAY`；只返回租户聚合，不返回用户维度；可选 `tenantId` 过滤。
        金额口径同租户报告；固定文案在 `disclaimer`。
      x-riccon-permission: platform.cost.read
      parameters:
        - $ref: "#/components/parameters/CostFrom"
        - $ref: "#/components/parameters/CostTo"
        - $ref: "#/components/parameters/PlatformCostGroupBy"
        - name: tenantId
          in: query
          required: false
          description: |
            只看某个租户的聚合；仍不返回用户明细。值必须非空且不超过 64 字符；
            空串/纯空白或超长返回 400 `RICCON-COST-400`（空串不按“未提供”处理，ADR-0022 §2.4）。
            本端点只允许平台主体（`platform.cost.read`）；`tenantId` 是授权范围内的过滤参数，
            属 ADR-0009「查询参数 tenantId 一律忽略/拒绝」的记录例外（ADR-0022 §2.4）。
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: "#/components/parameters/CostPage"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 成本报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCostReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: RICCON_SESSION
      description: 服务端会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）。
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF 令牌；从 GET /api/v1/auth/csrf 或登录响应获取。
      schema:
        type: string
        minLength: 16
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键；同一主体、同一资源重复请求返回既有结果。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowRunId:
      name: workflowRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowApprovalId:
      name: workflowApprovalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    CostPage:
      name: page
      in: query
      required: false
      description: 成本报告页码；取值 1..200，超过 200 返回 400 `RICCON-COST-400`（ADR-0022 §2.4/§2.5）。仅用于三个成本端点，不影响通用 `Page`。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AuditPage:
      name: page
      in: query
      required: false
      description: 审计查询页码；超过 200 返回 400 `RICCON-AUDIT-400`，请缩小时间范围或改用导出。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchTaskId:
      name: researchTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeDocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: 平台管理员显式指定的目标租户代码。
      schema:
        type: string
        minLength: 1
        maxLength: 64
    OidcRegistrationId:
      name: registrationId
      in: path
      required: true
      description: OIDC 注册 ID，固定为 `tenant-{tenantCode}`。
      schema:
        type: string
        pattern: "^tenant-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
    AuditExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OccurredFrom:
      name: occurredFrom
      in: query
      required: false
      description: 起始时间，ISO 8601 且必须带偏移；缺省为最近 24 小时。
      schema:
        type: string
        format: date-time
        example: "2026-11-01T00:00:00+08:00"
    OccurredTo:
      name: occurredTo
      in: query
      required: false
      description: 结束时间，ISO 8601 且必须带偏移；与起始时间跨度不超过 180 天。
      schema:
        type: string
        format: date-time
        example: "2026-11-19T23:59:59+08:00"
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelRoutingPurpose:
      name: purpose
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModelPurpose"
    CostFrom:
      name: from
      in: query
      required: false
      description: 起始自然日（`Asia/Shanghai`，含）；默认最近 30 天，与 `to` 跨度不超过 180 天。
      schema:
        type: string
        format: date
        example: "2026-11-01"
    CostTo:
      name: to
      in: query
      required: false
      description: 结束自然日（`Asia/Shanghai`，含）。
      schema:
        type: string
        format: date
        example: "2026-11-30"
    TenantCostGroupBy:
      name: groupBy
      in: query
      required: false
      description: 租户成本聚合维度；默认 `DAY`。
      schema:
        type: string
        enum: [USER, MODEL, DAY]
        default: DAY
    PlatformCostGroupBy:
      name: groupBy
      in: query
      required: false
      description: 平台成本聚合维度；默认 `DAY`；不接受 `USER`。
      schema:
        type: string
        enum: [TENANT, MODEL, DAY]
        default: DAY
  headers:
    TraceId:
      description: 本次请求的 traceId；与错误响应和审计一致。
      schema:
        type: string
        maxLength: 64
  responses:
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: 未认证或凭据错误；不泄露账号是否存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: 已认证但无权限或 CSRF 校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: 对象不存在或属于其他租户；统一 404，不泄露存在性
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: 状态冲突、重复请求、多部门/重复成员冲突（部门成员冲突使用 `RICCON-DEPT-409`）、OIDC 绑定冲突（`RICCON-OIDC-409`）或审计导出状态冲突（`RICCON-AUDIT-409`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Gone:
      description: 审计导出已过期（`RICCON-AUDIT-410`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PayloadTooLarge:
      description: 文件超过 200 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ArtifactContentTooLarge:
      description: 产物正文超过 2 MiB 的同源代理上限
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadGateway:
      description: 对象存储读取失败或产物正文暂不可用；响应不包含存储地址、key 或凭据
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnsupportedMediaType:
      description: 不支持的文件格式
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: 触发限流、队列背压或配额超限（配额使用 `RICCON-QUOTA-429` 与 `QuotaExceededProblem`）
      headers:
        Retry-After:
          description: 建议重试秒数
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/RateLimitedProblem"
              - $ref: "#/components/schemas/QuotaExceededProblem"
            discriminator:
              propertyName: code
              mapping:
                RICCON-RATE-429: "#/components/schemas/RateLimitedProblem"
                RICCON-QUEUE-429: "#/components/schemas/RateLimitedProblem"
                RICCON-QUOTA-429: "#/components/schemas/QuotaExceededProblem"
    QuotaExceeded:
      description: 已用尽租户/用户日或月配额；拒绝创建新 run，不产生模型调用（`RICCON-QUOTA-429`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/QuotaExceededProblem"
    ServiceUnavailable:
      description: 依赖不可用（配额存储、成本查询超时）；不返回部分结果（`RICCON-QUOTA-503`/`RICCON-COST-503`）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeBadRequest:
      description: 知识库请求不合法（`RICCON-KB-400`）：可见范围与 `departmentId`/`userIds` 组合非法、`DEPT` 部门不存在或未启用、`USERS` 超过 200 人、用户不属于本租户、重索引参数非法，或连接器 `defaultVisibility` 缺省、`endpointId` 不在部署允许列表、`type` 非 `S3`、配置/凭据字段非法
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeForbidden:
      description: 已认证但在该文档或连接器上无所需能力（`RICCON-AUTH-403`）：文档已按 ACL 可见但非创建人且非 `knowledge.acl.manage`，或缺少 `knowledge.connector.read`/`knowledge.connector.manage`；不可见/跨租户仍返回 404
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeNotFound:
      description: 文档或连接器不存在、已软删除、跨租户/跨部门或未授权可见；统一 `RICCON-TENANT-404`，不泄露存在性
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeSourceNotFound:
      description: 文档不可见、跨租户/跨部门或已软删除（`RICCON-TENANT-404`）；ACL 已通过但文档无源文件（`RICCON-KB-404`，含 SEED 语料或对象已清理）；不返回对象 key 或存储端点
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeConflict:
      description: 知识库状态冲突（`RICCON-KB-409`）：文档已软删除、正在索引或当前状态不允许该操作；连接器名称重复、同一连接器已有进行中的同步或状态不允许该操作
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeIndexUnavailable:
      description: 知识库索引队列、索引服务或连接器测试/同步服务不可用（`RICCON-KB-503`）；不返回部分受理结果
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    KnowledgeDownloadFailed:
      description: |
        知识库源文件读取失败（`RICCON-KB-502`）：对象存储不可用、读取超时或流中断。
        响应为 `ProblemDetail`，只含脱敏说明与 traceId；不包含对象 key、桶名、存储端点、预签名 URL 或凭据。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: 未预期错误；响应不包含堆栈、SQL、内部主机或密钥
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: [string, "null"]
          format: uri
        code:
          type: string
          pattern: "^RICCON-[A-Z]+-[0-9]{3}$"
        traceId:
          type: string
          maxLength: 64
        tenantId:
          type: [string, "null"]
          description: 脱敏后的租户标识；平台级事件为 platform
        field:
          type: [string, "null"]
          description: 字段级错误定位；模型端点只读字段、非法状态或 URL 校验使用（ADR-0021 §2.4/§7.3）。
        reason:
          type: [string, "null"]
          description: 稳定原因码，例如 ENDPOINT_SCHEME_NOT_ALLOWED、ENDPOINT_IMMUTABLE_DEPLOYMENT_MANAGED、INVALID_STATUS；只在字段级错误出现。
      additionalProperties: false
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 16
      additionalProperties: false
    LoginRequest:
      type: object
      required: [tenantCode, username, password]
      properties:
        tenantCode:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
          format: password
      additionalProperties: false
    OidcProviderAvailability:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        providerName:
          type: [string, "null"]
          description: 仅 enabled=true 时返回；未知租户/未配置统一 enabled=false
      additionalProperties: false
    OidcBindingRequest:
      type: object
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          format: uri
          maxLength: 255
          description: 必须等于本租户配置的 issuer（规范化后）
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: IdP 的 subject（sub）；不存邮箱、不按邮箱匹配
      additionalProperties: false
    OidcUnbindRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
          format: password
          description: 恢复本地账号时设置的新密码；账号转回 LOCAL
      additionalProperties: false
    SessionInfo:
      type: object
      required:
        [authenticated, user, tenant, roles, permissions, csrfToken, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/UserSummary"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        roles:
          type: array
          items:
            type: string
          example: [MEMBER]
        permissions:
          type: array
          items:
            type: string
          example: [workspace.read, conversation.write]
        csrfToken:
          type: string
          minLength: 16
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    UserSummary:
      type: object
      required: [id, username, displayName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        departmentId:
          type: [string, "null"]
          format: uuid
          description: 主部门 ID；未分配时为 null
        departmentName:
          type: [string, "null"]
          description: 主部门名；停用部门仍显示名称
        authSource:
          $ref: "#/components/schemas/AuthSource"
        identityProvider:
          type: [string, "null"]
          maxLength: 255
          description: |
            来源 IdP 的脱敏展示名。OIDC 优先使用租户配置的 `providerName`（仅当账号 issuer 与配置 issuer 一致），
            否则回退为 issuer 的 host（非默认端口保留，如 `idp.example.com`）；LOCAL、未知来源或无法解析时为 null 并省略字段。
            不返回完整 issuer 路径、subject、token 或邮箱。
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    TenantSummary:
      type: object
      required: [id, name, status, retentionDays]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        plan:
          type: string
        retentionDays:
          type: integer
          minimum: 30
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    AuthSource:
      type: string
      enum: [LOCAL, OIDC]
      description: LOCAL 使用本地密码；OIDC 使用 issuer + subject 绑定且没有本地密码凭据
    TenantStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    WorkspaceKind:
      type: string
      enum: [PERSONAL, TEAM]
    WorkspaceVisibility:
      type: string
      description: |
        `PRIVATE` 仅个人空间；`TENANT` 仅 M02 历史空间（禁止新建）；
        `DEPT` 本部门当前启用成员；`CUSTOM` 本部门当前启用成员中显式加入的人。
      enum: [PRIVATE, TENANT, DEPT, CUSTOM]
    DepartmentStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    FileStatus:
      type: string
      enum: [AVAILABLE, DELETED]
    FileFormat:
      type: string
      enum: [PDF, DOCX, XLSX, PNG, JPEG]
    ParseStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM, TOOL]
    MessageStatus:
      type: string
      enum: [PENDING, STREAMING, COMPLETED, STOPPED, FAILED]
    CitationSourceType:
      type: string
      enum: [FILE, KNOWLEDGE]
    LocatorType:
      type: string
      enum: [PAGE, SHEET, PARAGRAPH]
    KnowledgeDocumentStatus:
      type: string
      enum: [PENDING, INDEXING, INDEXED, FAILED, DELETED]
    KnowledgeVisibility:
      type: string
      enum: [TENANT, DEPT, USERS]
      description: 文档可见范围；`TENANT` 本租户全员、`DEPT` 单个启用部门、`USERS` 显式名单（创建人始终可见）。
    KnowledgeRetentionPolicy:
      type: string
      enum: [DEPLOYMENT_DEFAULT, TENANT_POLICY, EXPLICIT]
      description: 保留策略来源；`DEPLOYMENT_DEFAULT` 部署默认（180 天）、`TENANT_POLICY` 租户策略覆盖、`EXPLICIT` 文档显式设置。
    ParseEngine:
      type: [string, "null"]
      enum: [PDFBOX, POI, TESSERACT, RAPIDOCR, NONE, null]
      description: 解析引擎；`NONE` 表示未进入解析，`null` 表示历史文档未记录。
    CitationSourceStatus:
      type: string
      enum: [AVAILABLE, NO_ACCESS, DELETED, UPDATED]
      description: |
        引用可用性：`AVAILABLE` 可访问；`NO_ACCESS` ACL 撤销；`DELETED` 源文档软删除；`UPDATED` 源内容版本变化。
        `NO_ACCESS`/`DELETED` 时 `title`/`snippet` 为空串、定位字段为 `null`；`UPDATED` 保留快照并标注源内容已更新。
    ResearchTaskStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED, CANCELLED]
    RunStatus:
      type: string
      enum:
        [
          PENDING,
          RUNNING,
          WAITING_APPROVAL,
          RETRY_WAIT,
          SUCCEEDED,
          FAILED,
          CANCELLED,
        ]
    RunStage:
      type: string
      enum: [RETRIEVAL, TOOL, APPROVAL, GENERATION]
    StageStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED, SKIPPED]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED]
    ApprovalDecision:
      type: string
      enum: [APPROVE, REJECT]
    ArtifactStatus:
      type: string
      enum: [DRAFT, SAVED, DELETED]
    ModelPurpose:
      type: string
      enum: [CHAT, REPORT]
    InvocationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, FAILED, CANCELLED]
    McpToolRisk:
      type: string
      enum: [READ, WRITE]
    McpInvocationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, FAILED, DENIED]
    PageMeta:
      type: object
      required: [page, size, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    AuditActorType:
      type: string
      enum: [USER, SERVICE, SYSTEM]
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE, DENIED]
    AuditTargetType:
      type: string
      enum:
        [
          SESSION,
          WORKSPACE,
          DEPARTMENT,
          FILE,
          CONVERSATION,
          KNOWLEDGE_DOCUMENT,
          RESEARCH_TASK,
          RUN,
          ARTIFACT,
          MODEL,
          MODEL_PROVIDER,
          MODEL_CREDENTIAL,
          MODEL_ROUTING,
          QUOTA,
          MCP_TOOL,
          USER,
          ROLE,
          TENANT,
          AUDIT,
          AUDIT_EXPORT,
          WORKFLOW,
          WORKFLOW_RUN,
          WORKFLOW_TEMPLATE,
        ]
    AuditEvent:
      type: object
      required:
        [
          eventId,
          occurredAt,
          tenantId,
          actorType,
          actorId,
          action,
          outcome,
          traceId,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: 带偏移的 ISO 8601；数据库存 UTC
        tenantId:
          type: string
        actorType:
          $ref: "#/components/schemas/AuditActorType"
        actorId:
          type: string
          maxLength: 64
        actorDisplayName:
          type: [string, "null"]
          description: 读取时按当前账号解析，仅 USER；非历史快照，不含邮箱
        action:
          type: string
          maxLength: 100
        targetType:
          oneOf:
            - $ref: "#/components/schemas/AuditTargetType"
            - type: "null"
        targetId:
          type: [string, "null"]
          maxLength: 64
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        traceId:
          type: string
          maxLength: 64
        details:
          type: [object, "null"]
          additionalProperties: true
          description: 写入时已通过白名单的 JSON；读取/导出时复用 action-aware 白名单（允许 promptTokens/completionTokens 等合法键），白名单外或敏感键 fail-closed
      additionalProperties: false
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
    AuditExportLimits:
      type: object
      required: [ttlHours, rowLimit]
      properties:
        ttlHours:
          type: integer
          minimum: 1
          maximum: 168
        rowLimit:
          type: integer
          minimum: 1
          maximum: 50000
      additionalProperties: false
    AuditPolicy:
      type: object
      required:
        [
          retentionDays,
          maxRangeDays,
          pageSizeMax,
          maxPage,
          actions,
          exportLimits,
        ]
      properties:
        retentionDays:
          type: integer
          minimum: 180
        maxRangeDays:
          type: integer
          const: 180
        pageSizeMax:
          type: integer
          const: 100
        maxPage:
          type: integer
          const: 200
        actions:
          type: array
          items:
            type: string
        exportLimits:
          $ref: "#/components/schemas/AuditExportLimits"
      additionalProperties: false
    AuditFilter:
      type: object
      properties:
        occurredFrom:
          type: string
          format: date-time
          description: 带偏移；省略时服务端按最近 24 小时解析并固化
        occurredTo:
          type: string
          format: date-time
          description: 带偏移；与 from 跨度不超过 180 天；省略时按当前时间解析并固化
        action:
          type: string
          maxLength: 100
        actorId:
          type: string
          format: uuid
        targetType:
          $ref: "#/components/schemas/AuditTargetType"
        targetId:
          type: string
          maxLength: 64
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
      additionalProperties: false
    AuditExportCreateRequest:
      type: object
      required: [filter]
      properties:
        filter:
          $ref: "#/components/schemas/AuditFilter"
      additionalProperties: false
    AuditExportStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED, EXPIRED]
      description: |
        存储状态为 PENDING_APPROVAL/APPROVED/REJECTED；EXPIRED 由 `approved` 且 `expiresAt < now` 派生，
        仅用于响应展示，不改变数据库状态。列表过滤 `status=EXPIRED` 等价于
        `status=APPROVED` 且 `expiresAt < now`；过滤 `status=APPROVED` 只返回未过期的已批准请求。
    AuditExportDecision:
      type: string
      enum: [APPROVE, REJECT]
    AuditExportDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/AuditExportDecision"
        comment:
          type: [string, "null"]
          maxLength: 500
          description: 审批意见；只存导出记录，不进入审计 details
      additionalProperties: false
    AuditExportRequest:
      type: object
      required: [id, status, requestedBy, filter, estimatedRowCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AuditExportStatus"
        requestedBy:
          type: string
          format: uuid
        requestedByDisplayName:
          type: [string, "null"]
        filter:
          $ref: "#/components/schemas/AuditFilter"
        estimatedRowCount:
          type: integer
          minimum: 0
        approvedBy:
          type: [string, "null"]
          format: uuid
        approvedByDisplayName:
          type: [string, "null"]
        decidedAt:
