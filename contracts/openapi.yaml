            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTestResult"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
        "503":
          $ref: "#/components/responses/KnowledgeIndexUnavailable"
  /api/v1/knowledge/connectors/{connectorId}/sync:
    post:
      tags: [Knowledge]
      operationId: syncConnector
      summary: 立即同步连接器
      description: |
        立即受理一次同步并返回 202，实际同步由 Worker 在 heavy 通道执行；同一连接器的并发同步返回 409 `RICCON-KB-409`，不排队重复同步。
        成功后由部署固定周期与 `scheduleEnabled` 决定后续同步，不提供 per-connector cron；同步状态、计数与 `lastSyncComplete` 通过连接器详情与 items 查询。
        连接器功能未启用或同步队列不可用返回 503 `RICCON-KB-503`；跨租户或不存在返回 404 `RICCON-TENANT-404`；同租户非管理员返回 403 `RICCON-AUTH-403`。
      x-riccon-permission: knowledge.connector.manage
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已受理同步；不等待同步完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorSyncAccepted"
        "400":
          $ref: "#/components/responses/KnowledgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/KnowledgeForbidden"
        "404":
          $ref: "#/components/responses/KnowledgeNotFound"
        "409":
          $ref: "#/components/responses/KnowledgeConflict"
        "503":
          $ref: "#/components/responses/KnowledgeIndexUnavailable"
