          $ref: "#/components/schemas/KnowledgeVisibility"
          default: TENANT
          description: 缺省 `TENANT`；`DEPT` 必须同时给 `departmentId`，`USERS` 给 `userIds`；保存前必须提示影响。
        departmentId:
          type: [string, "null"]
          format: uuid
          description: 仅 `visibility=DEPT` 时有效且必填；部门须 `ACTIVE`。
        userIds:
          type: array
          maxItems: 200
          uniqueItems: true
          description: 仅 `visibility=USERS` 时有效；显式授权账号，最多 200 人；创建人始终可见且无需列入。
          items:
            type: string
            format: uuid
      additionalProperties: false
    KnowledgeDocumentAcl:
      type: object
      required: [visibility, users]
      properties:
        visibility:
          $ref: "#/components/schemas/KnowledgeVisibility"
        departmentId:
          type: [string, "null"]
          format: uuid
        users:
          type: array
          description: "`USERS` 显式名单（含创建人条目）；`TENANT`/`DEPT` 为空数组。"
          items:
            $ref: "#/components/schemas/KnowledgeAclUser"
        creatorUserId:
          type: [string, "null"]
          format: uuid
          description: 创建人；为空表示历史 SEED 文档没有创建人。
      additionalProperties: false
    KnowledgeAclUser:
      type: object
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        creator:
          type: boolean
          default: false
          description: 创建人隐式可见标记；该类条目不可从名单移除。
      additionalProperties: false
    KnowledgeDocumentAclUpdate:
      type: object
      required: [visibility]
      description: 整体替换文档 ACL；不是增量合并。`TENANT` 不允许携带部门或名单；`DEPT` 必须提供单个部门；`USERS` 最多 200 人。
      properties:
        visibility:
          $ref: "#/components/schemas/KnowledgeVisibility"
        departmentId:
          type: [string, "null"]
          format: uuid
        userIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
    ConnectorType:
      type: string
      enum: [S3]
      description: 连接器类型；M05b 只支持 S3 兼容目录，不接受任意 URL 或非允许列表端点。
    ConnectorVisibility:
      type: string
      enum: [TENANT, DEPT]
      description: 连接器导入文档的默认可见范围；`TENANT` 本租户全员、`DEPT` 单个启用部门。创建必须显式提供，无 `USERS`。
    ConnectorStatus:
      type: string
      enum: [ACTIVE, PAUSED, ERROR]
      description: "`ACTIVE` 参与定时同步；`PAUSED` 只停定时、仍可手动同步；`ERROR` 表示最近同步失败、仍可手动重试。新建默认 `PAUSED`。"
    ConnectorTargetStatus:
      type: string
      enum: [ACTIVE, PAUSED]
      description: PATCH 可显式设置的状态；`ERROR` 由同步结果产生，不通过 API 写入。
    ConnectorSyncStatus:
      type: string
      enum: [SUCCESS, PARTIAL, ERROR]
      description: 最近一次同步结果；失败也写 `lastSyncFinishedAt`。
    ConnectorItemStatus:
      type: string
      enum: [PENDING, SYNCED, SKIPPED, FAILED, DELETED]
      description: 单个源对象同步状态；`SKIPPED` 含不支持格式或排除规则，`DELETED` 表示源端删除或连接器删除传播。
    ConnectorTestCategory:
      type: [string, "null"]
      enum: [AUTH, NETWORK, ENDPOINT, CONFIG, null]
      description: 连接测试失败分类；成功时为 `null`。原因文案为中文，不含凭据或端点 URL。
    ConnectorConfig:
      type: object
      required: [bucket]
      properties:
        bucket:
          type: string
          minLength: 1
          maxLength: 255
          description: 桶名；API 响应向有权限的管理员返回配置；日志不记桶名，审计 details 只记摘要。
        prefix:
          type: string
          maxLength: 1000
          default: ""
          description: 对象前缀；缺省根前缀。API 响应返回配置；审计 details 只记 ≤200 字符摘要；日志不记对象 key。
        region:
          type: [string, "null"]
          maxLength: 64
          description: S3 区域；为空时使用部署默认区域。
        includeExtensions:
          type: array
          maxItems: 8
          uniqueItems: true
          description: 允许同步的扩展名；缺省使用部署白名单（`pdf`/`docx`/`xlsx`/`png`/`jpg`/`jpeg`/`txt`/`md`）。
          items:
            type: string
            enum: [pdf, docx, xlsx, png, jpg, jpeg, txt, md]
        excludeGlobs:
          type: array
          maxItems: 50
          description: 排除的 glob 模式；最多 50 条。
          items:
            type: string
            maxLength: 255
      additionalProperties: false
    Connector:
      type: object
      required:
        [
          id,
          name,
          type,
          status,
          endpointId,
          config,
          defaultVisibility,
          scheduleEnabled,
          lastSyncComplete,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/ConnectorType"
        status:
          $ref: "#/components/schemas/ConnectorStatus"
        endpointId:
          type: string
          minLength: 1
          maxLength: 64
          description: 部署允许列表中的端点 ID；不返回端点 URL，也不能提交任意 URL。
        config:
          $ref: "#/components/schemas/ConnectorConfig"
          description: 连接器配置（含 `bucket`/`prefix`）；只向有权限的管理员返回，日志不记 bucket/对象 key，审计 details 只记 `bucket`/`prefix` 摘要。
        defaultVisibility:
          $ref: "#/components/schemas/ConnectorVisibility"
        defaultDepartmentId:
          type: [string, "null"]
          format: uuid
          description: 仅 `defaultVisibility=DEPT` 时非空；部门须为 `ACTIVE`。
        credentialMaskedHint:
          type: [string, "null"]
          maxLength: 128
          description: 凭据掩码（如 `AKIA…7F2`）；永不返回明文、密文或 DEK。
        scheduleEnabled:
          type: boolean
          default: false
          description: 是否参与部署固定周期同步；不代表每次同步都会成功。
        nextSyncAt:
          type: [string, "null"]
          format: date-time
          description: 下一次定时同步时间（ISO 8601 带偏移）；仅 `scheduleEnabled=true` 且连接器启用时非空。
        lastSyncStartedAt:
          type: [string, "null"]
          format: date-time
          description: 最近一次同步开始时间；失败也写。
        lastSyncFinishedAt:
          type: [string, "null"]
          format: date-time
          description: 最近一次同步结束时间；失败也写。
        lastSyncStatus:
          oneOf:
            - $ref: "#/components/schemas/ConnectorSyncStatus"
            - type: "null"
        lastSyncComplete:
          type: boolean
          default: false
          description: 最近一次 list 是否完整；只有完整才传播源端删除，部分/截断/超限不删除任何未见对象。
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastErrorCode:
          type: [string, "null"]
          maxLength: 64
          description: 最近失败码（如 `KB_CONNECTOR_AUTH`/`KB_CONNECTOR_UNREACHABLE`/`KB_CONNECTOR_TIMEOUT`）；不含凭据或对象内容。
        lastSyncSummary:
          oneOf:
            - $ref: "#/components/schemas/ConnectorSyncSummary"
            - type: "null"
        createdBy:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ConnectorPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Connector"
    ConnectorCreate:
      type: object
      required: [name, type, endpointId, config, defaultVisibility]
      description: 创建 S3 兼容目录连接器；`defaultVisibility` 必须显式提供，不接受 per-connector cron。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/ConnectorType"
        endpointId:
          type: string
          minLength: 1
          maxLength: 64
          description: 部署允许列表中的端点 ID；不在允许列表返回 400 `RICCON-KB-400`。
        config:
          $ref: "#/components/schemas/ConnectorConfig"
        defaultVisibility:
          $ref: "#/components/schemas/ConnectorVisibility"
          description: 必须显式提供 `TENANT` 或 `DEPT`；缺省返回 400 `RICCON-KB-400`，不依赖数据库默认值。
        defaultDepartmentId:
          type: [string, "null"]
          format: uuid
          description: 仅 `defaultVisibility=DEPT` 时必填；部门须 `ACTIVE`。
        scheduleEnabled:
          type: boolean
          default: false
          description: 是否参与部署固定周期同步；周期由部署配置固定，不是 per-connector cron。
        credential:
          oneOf:
            - $ref: "#/components/schemas/ConnectorCredential"
            - type: "null"
          description: 创建时可选写入凭据；只进不出，响应只返回 `credentialMaskedHint`。
      additionalProperties: false
    ConnectorUpdate:
      type: object
      minProperties: 1
      description: 部分更新；不支持修改 `type`、per-connector cron 或直接写入 `ERROR` 状态，未知字段返回 400。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        endpointId:
          type: string
          minLength: 1
          maxLength: 64
          description: 改为部署允许列表中的另一个端点 ID；不在允许列表返回 400。
        config:
          $ref: "#/components/schemas/ConnectorConfig"
        defaultVisibility:
          $ref: "#/components/schemas/ConnectorVisibility"
        defaultDepartmentId:
          type: [string, "null"]
          format: uuid
          description: 仅 `defaultVisibility=DEPT` 时非空。
        scheduleEnabled:
          type: boolean
          description: 开启/关闭部署固定周期同步；不改变立即同步能力。
        status:
          $ref: "#/components/schemas/ConnectorTargetStatus"
      additionalProperties: false
    ConnectorCredential:
      type: object
      required: [accessKeyId, secretAccessKey]
      description: 只写不读的 S3 凭据；服务端信封加密，响应/日志/审计只出现 `credentialMaskedHint`。
      properties:
        accessKeyId:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: S3 access key ID；只写不读。
        secretAccessKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: S3 secret access key；只写不读，日志与审计禁止出现。
      additionalProperties: false
    ConnectorTestResult:
      type: object
      required: [success, message, testedAt]
      description: |
        连接测试结果；失败仍为 200，不返回凭据、对象内容或端点 URL。
        成功时 `category=null`（可省略）；失败时 `category` 必填且为 `AUTH`/`NETWORK`/`ENDPOINT`/`CONFIG` 之一。
      properties:
        success:
          type: boolean
        category:
          $ref: "#/components/schemas/ConnectorTestCategory"
        message:
          type: string
          maxLength: 500
          description: 中文原因（成功/失败）；不含凭据、端点 URL、bucket 全名或对象 key。
        testedAt:
          type: string
          format: date-time
      additionalProperties: false
      if:
        properties:
          success:
            const: false
        required: [success]
      then:
        required: [category]
        properties:
          category:
            type: string
      else:
        properties:
          category:
            type: "null"
    ConnectorSyncAccepted:
      type: object
      required: [syncId, connectorId, status, acceptedAt]
      description: 同步受理结果；不等待同步完成，状态通过连接器详情与 items 查询。
      properties:
        syncId:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING]
        acceptedAt:
          type: string
          format: date-time
      additionalProperties: false
    ConnectorSyncSummary:
      type: object
      required: [scanned, created, updated, skipped, failed, deleted, complete]
      description: 最近一次同步计数；`complete=false` 时不得传播删除。
      properties:
        scanned:
          type: integer
          format: int64
          minimum: 0
        created:
          type: integer
          format: int64
          minimum: 0
        updated:
          type: integer
          format: int64
          minimum: 0
        skipped:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        deleted:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
          description: list 是否完整；只有完整才传播删除。
      additionalProperties: false
    ConnectorItem:
      type: object
      required: [id, externalId, status, generation, createdAt, updatedAt]
      description: 连接器源对象同步状态；不返回对象原文、对象 key 全文或 bucket/端点信息。
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
          maxLength: 512
          description: 源对象 ID 展示值；只返回末段（最后 2 个路径段或 32 字符），完整值只在库内用于比对。
        externalVersion:
          type: [string, "null"]
          maxLength: 255
          description: ETag/version；用于增量同步，不保证跨源端稳定。
        status:
          $ref: "#/components/schemas/ConnectorItemStatus"
        documentId:
          type: [string, "null"]
          format: uuid
          description: 对应知识库文档；`SKIPPED`/`FAILED`/`DELETED` 时可为空或保留历史文档引用。
        generation:
          type: integer
          minimum: 1
          description: 同一 `externalId` 的删除-重现代数；复用 tombstone 时 +1。
        errorCode:
          type: [string, "null"]
          maxLength: 64
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    ConnectorItemPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorItem"
    ResearchTask:
      type: object
      required: [id, workspaceId, topic, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        topic:
          type: string
        status:
          $ref: "#/components/schemas/ResearchTaskStatus"
        currentStage:
          oneOf:
            - $ref: "#/components/schemas/RunStage"
            - type: "null"
        mcpToolId:
          type: [string, "null"]
          format: uuid
        currentRunId:
          type: [string, "null"]
          format: uuid
        failureCode:
          type: [string, "null"]
        failureMessage:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    ResearchTaskDetail:
      allOf:
        - $ref: "#/components/schemas/ResearchTask"
        - type: object
          required: [stages, mcpInvocations, sources]
          properties:
            stages:
              type: array
              items:
                $ref: "#/components/schemas/RunStageRecord"
            approvals:
              type: array
              items:
                $ref: "#/components/schemas/Approval"
            mcpInvocations:
              type: array
              items:
                $ref: "#/components/schemas/McpInvocation"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/Citation"
            artifact:
              oneOf:
                - $ref: "#/components/schemas/ArtifactDetail"
                - type: "null"
    ResearchTaskPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResearchTask"
    ResearchTaskCreateRequest:
      type: object
      required: [topic, mcpToolId]
      properties:
        topic:
          type: string
          minLength: 4
          maxLength: 500
        mcpToolId:
          type: string
          format: uuid
      additionalProperties: false
    ResearchTaskRetryRequest:
      type: object
      properties:
        fromStage:
          type: ["string", "null"]
          enum: [TOOL, GENERATION, null]
          description: 为空时从失败阶段重试；只允许 TOOL 或 GENERATION。
      additionalProperties: false
    Approval:
      type: object
      required:
        [
          id,
          researchTaskId,
          runId,
          stage,
          attempt,
          status,
          actionType,
          toolName,
          paramsSha256,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        researchTaskId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        stage:
          $ref: "#/components/schemas/RunStage"
        attempt:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        actionType:
          type: string
          const: MCP_TOOL_CALL
        toolName:
          type: string
        paramsPreview:
          type: [object, "null"]
          description: |
            审批入参的脱敏摘要，仅用于审批 UI 与时间线展示。只允许白名单键与截断值
            （单个字符串 ≤ 200 字符，序列化后 ≤ 4096 字节，最多 16 个键）；禁止完整参数、
            文件/会话内容与凭据。完整参数以 AES-256-GCM 密文保存在 `approval` 表，
            不通过任何 API 返回（ADR-0017）。
          maxProperties: 16
          additionalProperties: true
        paramsSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        requestedBy:
          type: string
          format: uuid
        decidedBy:
          type: [string, "null"]
          format: uuid
        decidedAt:
          type: [string, "null"]
          format: date-time
        decisionComment:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/ApprovalDecision"
        comment:
          type: [string, "null"]
          maxLength: 500
      additionalProperties: false
    ApprovalPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Approval"
    McpInvocation:
      type: object
      required: [id, toolName, status, paramsSha256, startedAt]
      properties:
        id:
          type: string
          format: uuid
        toolName:
          type: string
        status:
          $ref: "#/components/schemas/McpInvocationStatus"
        paramsSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        resultSha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        durationMs:
          type: [integer, "null"]
        errorCode:
          type: [string, "null"]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    ArtifactCitation:
      type: object
      description: |
        产物引用。M05 起可选携带 `bbox`/`ocrConfidence`/`sourceStatus` 与 Excel `cellRange`；
        `sourceStatus=NO_ACCESS|DELETED` 时 `title`/`snippet` 返回空串、定位字段为 `null`，不返回正文；
        `sourceStatus` 缺省按 `AVAILABLE` 处理。
      required: [ordinal, sourceType, title, snippet]
      properties:
        ordinal:
          type: integer
          minimum: 1
        sourceType:
          type: string
          enum: [FILE, KNOWLEDGE, MCP]
        fileId:
          type: [string, "null"]
          format: uuid
        knowledgeDocumentId:
          type: [string, "null"]
          format: uuid
        mcpInvocationId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        snippet:
          type: string
          maxLength: 1000
        locatorType:
          oneOf:
            - $ref: "#/components/schemas/LocatorType"
            - type: "null"
        pageNo:
          type: [integer, "null"]
        sheetName:
          type: [string, "null"]
        cellRange:
          type: [string, "null"]
          description: Excel 引用区域（如 `B2:D10`）；整表片段为整表范围，不伪造单元格。
        paragraphNo:
          type: [integer, "null"]
        bbox:
          oneOf:
            - $ref: "#/components/schemas/BoundingBox"
            - type: "null"
        ocrConfidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        sourceStatus:
          $ref: "#/components/schemas/CitationSourceStatus"
      additionalProperties: false
    ArtifactVersion:
      type: object
      required:
        [id, version, contentType, sizeBytes, sha256, createdAt, citations]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        summary:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        citations:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCitation"
      additionalProperties: false
    Artifact:
      type: object
      required:
        [
          id,
          workspaceId,
          kind,
          title,
          status,
          currentVersion,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        researchTaskId:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          const: REPORT
        title:
