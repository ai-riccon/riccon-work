        modelId:
          type: string
          format: uuid
        modelDisplayName:
          type: string
        userId:
          type: [string, "null"]
          format: uuid
        userDisplayName:
          type: [string, "null"]
        startedAt:
          type: string
          format: date-time
        promptTokens:
          type: [integer, "null"]
          minimum: 0
        completionTokens:
          type: [integer, "null"]
          minimum: 0
        inputPricePer1M:
          type: [string, "null"]
          pattern: "^\\d{1,6}(\\.\\d{1,6})?$"
        outputPricePer1M:
          type: [string, "null"]
          pattern: "^\\d{1,6}(\\.\\d{1,6})?$"
        priceCurrency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
          description: UNPRICED/USAGE_UNKNOWN 时可为 null。
        amount:
          type: [string, "null"]
          pattern: "^\\d{1,14}(\\.\\d{1,6})?$"
        pricingStatus:
          $ref: "#/components/schemas/CostPricingStatus"
