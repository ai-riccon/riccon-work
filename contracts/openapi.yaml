  /api/v1/workflows/{workflowId}/draft:
    put:
      tags: [Workflow]
      operationId: saveWorkflowDraft
      summary: 保存流程草稿
      description: |
        `version` 为草稿乐观锁；不一致返回 409 `RICCON-WF-409`，前端可另存副本或放弃。
        校验 profile 为**编辑级**：结构、必填、节点配置、模型、工具授权、条件、结果与资源限制。非法图返回 400 `RICCON-WF-400`，**不写草稿、不写审计**；不得把“保存成功”理解为已通过发布校验。
        编辑级校验允许仅发布级问题（例如尚未配置可用的非发起人审批人）暂不阻断保存，但节点配置本身必须合法（不允许脚本/任意 HTTP/未知节点/缺失必填）。逐项 issues 与 `POST /validate` 同口径；SAVE 的 400 沿用 `ProblemDetail`（`code`/`detail`/`field`），调用方可重读草稿后调用 `/validate` 获取完整 `WorkflowValidationResult`（本契约不新增错误 body schema）。
      x-riccon-permission: workflow.edit
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDraftUpdateRequest"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/workflows/{workflowId}/duplicate:
    post:
      tags: [Workflow]
      operationId: duplicateWorkflow
      summary: 另存流程副本
      description: 并发保存冲突后另存副本；副本为当前用户草稿，默认仅自己可见。
      x-riccon-permission: workflow.edit
      parameters:
