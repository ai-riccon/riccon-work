        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: server 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerPage"
        "401":
