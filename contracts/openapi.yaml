openapi: 3.1.0
info:
  title: Riccon API
  version: 1.0.0-m02
  description: |
    Riccon M02 公开 REST 契约（J1 通用问答与文件处理、J2 市场调研报告）。

    ## 认证与会话
    - 登录使用内置账号：`tenantCode + username + password`；租户代码即 `tenant.id`。
    - 会话存储在 MySQL（Spring Session JDBC），Cookie 名 `RICCON_SESSION`，`HttpOnly`、`SameSite=Lax`，非本地环境 `Secure`。
    - 不使用 JWT；登出即使会话失效。M03 接入 OIDC，不改变本契约的会话语义。

    ## CSRF
    - 先调用 `GET /api/v1/auth/csrf` 获取令牌；登录后响应会返回新的 `csrfToken`。
    - 所有 `POST/PUT/PATCH/DELETE` 必须带 `X-CSRF-TOKEN`；缺失或过期返回 403 `RICCON-AUTH-403`。
    - 登录接口同样受 CSRF 保护；匿名会话只承载 CSRF 令牌，不承载业务数据。

    ## 租户隔离
    - 租户只从已认证主体派生；请求体、查询参数、请求头中的 `tenantId` 一律忽略，不一致时拒绝并审计。
    - 跨租户对象统一返回 404 `RICCON-TENANT-404`，不泄露对象是否存在。
    - 所有列表强制分页：`page` 从 1 开始，`size` 默认 20、最大 100。

    ## 错误
    统一使用 RFC 9457 `application/problem+json`，至少包含 `type/title/status/code/traceId`。
    错误码格式 `RICCON-<DOMAIN>-<NNN>`；禁止返回堆栈、SQL、内部主机、密钥或完整提示词。

    ## 流式
    `POST /api/v1/conversations/{conversationId}/messages` 返回 `text/event-stream`，
    事件载荷见 `contracts/events/sse/chat-event.v1.schema.json`；报告进度事件见
    `contracts/events/sse/run-progress.v1.schema.json`。

    ## M02 范围外
    审计查询/导出（M03）、模型路由与配额（M04）、文档级 ACL/OCR（M05）、MCP 注册与凭据托管（M07）。
    审计在 M02 只写不读，因此本文件不定义审计查询路径。
  contact:
    name: Riccon 架构组
  license:
    name: Proprietary
    identifier: LicenseRef-Riccon-Proprietary
servers:
  - url: /
tags:
  - name: Auth
    description: 登录、会话与 CSRF
  - name: Workspace
    description: 个人/团队工作空间
  - name: Files
    description: 文件上传、解析状态与下载
  - name: Conversations
    description: 会话、消息与流式回答
  - name: Knowledge
    description: 租户知识库文档
  - name: Research
    description: 市场调研报告任务与运行时间线
  - name: Approvals
    description: 外部工具调用审批
  - name: Artifacts
    description: 报告产物与版本
  - name: Catalog
    description: 租户可见的模型与 MCP 工具
  - name: Admin
    description: 平台只读目录与租户/账号管理
security:
  - sessionCookie: []
x-riccon-deferred:
  - id: audit-query
    status: M03
    reason: M02-AC-15 要求界面与接口均无审计查询/删除能力；审计只写不读。
  - id: model-routing-quota
    status: M04
    reason: M02 只有单一部署级 OpenAI 兼容端点。
  - id: knowledge-acl-ocr
    status: M05
    reason: M02 知识库无文档级 ACL，仅演示语料。
  - id: mcp-registration-credentials
    status: M07
    reason: M02 只允许平台内置白名单，不提供注册 UI 与凭据托管。
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      description: 匿名可调用；会建立仅承载 CSRF 令牌的匿名会话。登录成功后使用登录响应中的新令牌。
      security: []
      responses:
        "200":
          description: CSRF 令牌
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 内置账号登录
      description: |
        统一失败提示：租户不存在、账号不存在、密码错误、账号锁定均返回 401 `RICCON-AUTH-001`。
        登录成功后轮换会话 ID，并返回新的 CSRF 令牌。
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Set-Cookie:
              description: 会话 Cookie（HttpOnly、SameSite=Lax、非本地 Secure）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 读取当前会话
      description: 返回当前用户、租户、角色、权限与当前 CSRF 令牌；未登录返回 401。
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: 使当前会话失效并写 `auth.logout` 审计。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已登出
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces:
    get:
      tags: [Workspace]
      operationId: listWorkspaces
      summary: 列出可访问工作空间
      description: 个人空间仅本人可见；M02 团队空间对本租户启用员工可见。
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/WorkspaceKind"
      responses:
        "200":
          description: 工作空间列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Workspace]
      operationId: createWorkspace
      summary: 创建团队工作空间
      x-riccon-permission: workspace.write
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceId}:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      summary: 读取工作空间
      x-riccon-permission: workspace.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 工作空间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workspace]
      operationId: updateWorkspace
      summary: 修改工作空间
      x-riccon-permission: workspace.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Workspace]
      operationId: deleteWorkspace
      summary: 归档工作空间
      description: 软删除；个人空间禁止删除（409）。归档不删除历史会话与产物。
      x-riccon-permission: workspace.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已归档
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: 列出工作空间文件
      x-riccon-permission: file.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: conversationId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 文件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Files]
      operationId: uploadFile
      summary: 上传文件
      description: |
        支持 PDF、DOCX、XLSX、PNG、JPEG；单文件 ≤ 200 MB；单会话 ≤ 5 个文件。
        同时校验扩展名、Content-Type 与 magic bytes；文件先写对象存储，再在同事务写元数据与 `file.uploaded` 审计。
      x-riccon-permission: file.upload
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                conversationId:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: 已上传并受理解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/files/{fileId}:
    get:
      tags: [Files]
      operationId: getFile
      summary: 读取文件元数据与解析状态
      x-riccon-permission: file.read
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 文件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: 删除文件
      description: 软删除元数据并写 `file.deleted` 审计；对象清理由提交后的补偿任务执行。
      x-riccon-permission: file.delete
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/files/{fileId}/download-url:
    get:
      tags: [Files]
      operationId: getFileDownloadUrl
      summary: 获取文件下载地址
      description: 服务端校验归属后签发预签名 URL，TTL ≤ 300 秒；URL 绑定对象 key。
      x-riccon-permission: file.read
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 下载地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/files/{fileId}/parse-retries:
    post:
      tags: [Files]
      operationId: retryFileParse
      summary: 重试文件解析
      description: 仅允许对失败文件重试；创建新的解析尝试，不覆盖历史失败记录。
      x-riccon-permission: file.upload
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/workspaces/{workspaceId}/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: 列出工作空间会话
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: 新建会话
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: 读取会话与最近消息
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: 修改会话标题
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdateRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: 删除会话
      description: 软删除会话；消息与引用不物理删除，保留至租户保留期结束。
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: 列出会话消息
      description: 按 seq 升序；使用 beforeSeq 做向前翻页。
      x-riccon-permission: conversation.read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: beforeSeq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: 发送消息并流式接收回答
      description: |
        先持久化用户消息并创建 `agent_run`，再以 SSE 转发 Worker 增量。事件类型：
        `riccon.chat.started.v1`、`riccon.chat.delta.v1`、`riccon.chat.citation.v1`、
        `riccon.chat.completed.v1`、`riccon.chat.failed.v1`、`riccon.chat.stopped.v1`。
        首字前失败返回 ProblemDetail；首字后失败发送 failed 事件并结束流，已生成内容保留。
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: SSE 事件流
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 必须为 no-store
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  每帧格式：
                  `event: <eventType>`
                  `data: <chat-event.v1 JSON>`
                  空行结束。事件 schema 见 contracts/events/sse/chat-event.v1.schema.json。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/conversations/{conversationId}/stop:
    post:
      tags: [Conversations]
      operationId: stopGeneration
      summary: 停止当前回答
      description: 幂等；已生成内容保留，消息状态置 STOPPED。
      x-riccon-permission: conversation.write
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRunRequest"
      responses:
        "202":
          description: 已请求停止
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
