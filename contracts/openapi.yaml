      type: string
      enum: [BUILT_IN, PRIVATE, TENANT]
      description: 内置模板固定 `BUILT_IN`；用户模板 `PRIVATE`（默认）/`TENANT`（M06b 共享）。
    WorkflowResultStatus:
      type: string
      enum: [NONE, SAVED, OVER_LIMIT]
      description: "`OVER_LIMIT` 表示运行因结果超过 5 MiB 未保存完整结果，运行以 `WF_RESULT_LIMIT` 失败。"
    WorkflowRetentionPolicy:
      type: string
      enum: [DEPLOYMENT_DEFAULT, TENANT_POLICY]
      description: 运行保留策略来源；租户策略优先于部署默认（默认 180 天）。
    WorkflowValidationCode:
      type: string
      enum:
        [
          GRAPH_CYCLE,
          MISSING_START,
          MULTIPLE_START,
          MISSING_END,
          ORPHAN_NODE,
          INDEGREE_EXCEEDED,
          EDGE_INVALID,
          CONDITION_BRANCH_INVALID,
          REQUIRED_CONFIG,
          NODE_LIMIT,
          EDGE_LIMIT,
          MODEL_UNAVAILABLE,
          TOOL_NOT_AUTHORIZED,
          TOOL_DISABLED,
          APPROVAL_CONFIG,
          NO_APPROVER,
          RESULT_INVALID,
          TEMPLATE_INVALID,
        ]
    WorkflowErrorCode:
      type: string
      enum:
        [
          WF_INVALID_GRAPH,
          WF_NODE_LIMIT,
          WF_STEP_LIMIT,
          WF_RUN_TIMEOUT,
          WF_NODE_TIMEOUT,
          WF_MODEL_UNAVAILABLE,
          WF_MODEL_OUTPUT_INVALID,
          WF_RETRIEVAL_FAILED,
          WF_CONDITION_INVALID,
          WF_TOOL_NOT_AUTHORIZED,
          WF_TOOL_RESULT_LIMIT,
          WF_APPROVAL_REQUIRED,
          WF_NO_APPROVER,
          WF_APPROVAL_REJECTED,
          WF_SIDE_EFFECT_UNKNOWN,
          WF_PLAN_DRIFT,
          WF_RESULT_LIMIT,
          WF_FEATURE_DISABLED,
          WF_CANCELLED,
          WF_INTERNAL,
        ]
      description: 运行/节点异步稳定码；HTTP 错误仍用 `RICCON-WF-400/409/429/503`。
    WorkflowConditionSource:
      type: object
      required: [source, path, valueType]
      properties:
        source:
          type: string
          enum: [RUN_INPUT, NODE_OUTPUT]
        nodeId:
          type: [string, "null"]
          description: "`NODE_OUTPUT` 时必填；必须指向上游已执行节点。"
        path:
          type: string
          maxLength: 64
          description: 受控字段：`RUN_INPUT` 为输入键（≤64，服务端校验存在/类型）；`NODE_OUTPUT` 仅 `hitCount`/`classificationLabel`/`decision`/`status`。
        valueType:
          type: string
          enum: [NUMBER, STRING, BOOLEAN]
      additionalProperties: false
    WorkflowConditionRight:
      type: object
      required: [valueType]
      properties:
        valueType:
          type: string
          enum: [NUMBER, STRING, BOOLEAN]
        value:
          type: [string, number, boolean, "null"]
        values:
          type: array
          maxItems: 20
          items:
            type: [string, number, boolean]
          description: "`operator=IN` 时使用。"
      additionalProperties: false
    WorkflowCondition:
      type: object
      required: [left, operator, right]
      properties:
        left:
          $ref: "#/components/schemas/WorkflowConditionSource"
        operator:
          type: string
          enum: [EQ, NE, GT, GTE, LT, LTE, IN]
        right:
          $ref: "#/components/schemas/WorkflowConditionRight"
      additionalProperties: false
      description: 封闭算子；不支持表达式、脚本或正则。
    WorkflowNodeConfig:
      type: object
      description: 按节点类型校验必填；M06 不接受 script/code/http/cron/parallel/loop/subflow 字段。
      properties:
        promptTemplate:
          type: string
          maxLength: 8000
        queryTemplate:
          type: string
          maxLength: 2000
        topK:
          type: integer
          minimum: 1
          maximum: 20
        modelId:
          type: [string, "null"]
          format: uuid
        outputKind:
          type: string
          enum: [TEXT, CLASSIFICATION]
        labels:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        toolId:
          type: [string, "null"]
          format: uuid
        argsTemplate:
          type: object
          maxProperties: 16
          additionalProperties: true
        assigneeType:
          type: string
          enum: [USER, ROLE]
        assigneeRole:
          type: [string, "null"]
          enum: [TENANT_ADMIN, WORKFLOW_EDITOR, MEMBER, null]
        assigneeUserIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        actionKind:
          oneOf:
            - $ref: "#/components/schemas/WorkflowApprovalActionKind"
            - type: "null"
          description: 审批节点解锁的动作类型；服务端按后继节点校验，MCP_TOOL 时必填且 targetNodeKey 指向工具节点。
        targetNodeKey:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: 审批解锁的下游节点 key；服务端校验必须是直接后继/目标工具节点。
        condition:
          oneOf:
            - $ref: "#/components/schemas/WorkflowCondition"
            - type: "null"
        resultFrom:
          type: [string, "null"]
          maxLength: 64
        resultTitle:
          type: [string, "null"]
          maxLength: 200
      additionalProperties: false
    WorkflowNode:
      type: object
      required: [id, type, name, config]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        type:
          $ref: "#/components/schemas/WorkflowNodeType"
        name:
          type: string
          minLength: 1
          maxLength: 200
        config:
          $ref: "#/components/schemas/WorkflowNodeConfig"
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
          additionalProperties: false
      additionalProperties: false
    WorkflowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        source:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        target:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        branch:
          type: [string, "null"]
          enum: ["TRUE", "FALSE", null]
          description: 仅 `CONDITION` 出边必填；其他边为空。必须是字符串 "TRUE"/"FALSE"，不是布尔值。
      additionalProperties: false
    WorkflowGraph:
      type: object
      required: [schemaVersion, nodes, edges]
      properties:
        schemaVersion:
          type: integer
          const: 1
        nodes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WorkflowEdge"
      additionalProperties: false
      description: 恰好 1 个 START、≥1 个 END；每个节点入边 ≤1；无环；CONDITION 恰好 2 条出边 TRUE/FALSE。
    WorkflowDefinition:
      type: object
      required:
        [
          id,
          name,
          ownerUserId,
          status,
          draftVersion,
          hasUnpublishedChanges,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        ownerUserId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkflowDefinitionStatus"
        draftVersion:
          type: integer
          minimum: 1
        publishedVersionId:
          type: [string, "null"]
          format: uuid
        publishedVersionNo:
          type: [integer, "null"]
          minimum: 1
        hasUnpublishedChanges:
          type: boolean
        sourceTemplateId:
          type: [string, "null"]
          format: uuid
        sourceTemplateType:
          type: [string, "null"]
          enum: [BUILT_IN, TENANT, null]
        sourceTemplateVersion:
          type: [integer, "null"]
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowDefinitionDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowDefinition"
        - type: object
          properties:
            draftGraph:
              oneOf:
                - $ref: "#/components/schemas/WorkflowGraph"
                - type: "null"
              description: 仅可编辑者（所有者/租户管理员）返回。
            latestVersion:
              oneOf:
                - $ref: "#/components/schemas/WorkflowVersion"
                - type: "null"
            canEdit:
              type: boolean
            canPublish:
              type: boolean
            canRun:
              type: boolean
    WorkflowDefinitionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowDefinition"
    WorkflowVersion:
      type: object
      required:
        [
          id,
          workflowId,
          versionNo,
          runScope,
          graphSha256,
          nodeCount,
          publishedBy,
          publishedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        runScope:
          $ref: "#/components/schemas/WorkflowRunScope"
        departmentId:
          type: [string, "null"]
          format: uuid
        graphSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        nodeCount:
          type: integer
          minimum: 1
          maximum: 50
        publishedBy:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkflowVersionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowVersion"
    WorkflowRun:
      type: object
      required:
        [
          id,
          workflowId,
          workflowVersionId,
          versionNo,
          requesterUserId,
          status,
          resultStatus,
          createdAt,
          updatedAt,
          retentionExpiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowName:
          type: [string, "null"]
        workflowVersionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        requesterUserId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkflowRunStatus"
        currentNodeId:
          type: [string, "null"]
        approvalStatus:
          oneOf:
            - $ref: "#/components/schemas/WorkflowApprovalStatus"
            - type: "null"
          description: 聚合规则：任一 PENDING→PENDING；否则任一 REJECTED→REJECTED；否则任一 APPROVED→APPROVED；否则 null。配合 counts 字段表达多审批节点。
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/WorkflowErrorCode"
            - type: "null"
        errorMessage:
          type: [string, "null"]
          maxLength: 500
        resultStatus:
          $ref: "#/components/schemas/WorkflowResultStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        durationMs:
          type: [integer, "null"]
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          description: 轮询判据；变化才重绘。终态后停止轮询，result 只在终态读取一次。
        pendingApprovalCount:
          type: integer
          minimum: 0
          description: PENDING 审批数；用于多审批节点聚合。
        approvedApprovalCount:
          type: integer
          minimum: 0
        rejectedApprovalCount:
          type: integer
          minimum: 0
        retentionExpiresAt:
          type: string
          format: date-time
    WorkflowNodeRun:
      type: object
      required: [id, nodeId, nodeType, name, status, attempt]
      properties:
        id:
          type: string
          format: uuid
        nodeId:
          type: string
        nodeType:
          $ref: "#/components/schemas/WorkflowNodeType"
        name:
          type: string
        status:
          $ref: "#/components/schemas/WorkflowNodeStatus"
        attempt:
          type: integer
          minimum: 1
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        durationMs:
          type: [integer, "null"]
          minimum: 0
        inputSummary:
          type: [string, "null"]
          maxLength: 2000
          description: 节点输入摘要；由运行输入/上游输出摘要组合，服务端生成，不返回完整提示词或工具参数。
        outputSummary:
          type: [string, "null"]
          maxLength: 2000
        errorCode:
          oneOf:
            - $ref: "#/components/schemas/WorkflowErrorCode"
            - type: "null"
        errorMessage:
          type: [string, "null"]
          maxLength: 500
        approvalId:
          type: [string, "null"]
          format: uuid
        invocationId:
          type: [string, "null"]
          format: uuid
      additionalProperties: false
    WorkflowRunDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowRun"
        - type: object
          properties:
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowNodeRun"
            approvals:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowApproval"
            citations:
              type: array
              items:
                $ref: "#/components/schemas/Citation"
            result:
              oneOf:
                - $ref: "#/components/schemas/WorkflowResult"
                - type: "null"
    WorkflowResult:
      type: object
      required: [format, sizeBytes]
      properties:
        format:
          type: string
          enum: [TEXT, MARKDOWN, JSON]
        text:
          type: [string, "null"]
          description: 最终结果文本；超过 5 MiB 时不保存（`resultStatus=OVER_LIMIT`）。
        sizeBytes:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkflowRunPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowRun"
    WorkflowDataScopeSummary:
      type: object
      required: [runScope, documentReferenceCount]
      properties:
        runScope:
          $ref: "#/components/schemas/WorkflowRunScope"
        departmentId:
          type: [string, "null"]
          format: uuid
        documentReferenceCount:
          type: integer
          minimum: 0
          description: 审批涉及的文档引用数量；不返回标题/片段/正文，审批人按 ACL 自行访问。
      additionalProperties: false
      description: AC-05 的“数据范围摘要”；只含范围/部门/引用计数，不含文档正文。
    WorkflowApproval:
      type: object
      required:
        [
          id,
          workflowRunId,
          workflowId,
          nodeId,
          nodeName,
          status,
          assigneeType,
          actionKind,
          dataScopeSummary,
          planSha256,
          requestedBy,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        workflowRunId:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowName:
          type: [string, "null"]
        nodeId:
          type: string
        nodeName:
          type: string
        status:
          $ref: "#/components/schemas/WorkflowApprovalStatus"
        assigneeType:
          type: string
          enum: [USER, ROLE]
        assigneeRole:
          type: [string, "null"]
          enum: [TENANT_ADMIN, WORKFLOW_EDITOR, MEMBER, null]
        assigneeUserIds:
          type: array
          items:
            type: string
            format: uuid
        actionKind:
          $ref: "#/components/schemas/WorkflowApprovalActionKind"
        dataScopeSummary:
          $ref: "#/components/schemas/WorkflowDataScopeSummary"
        targetToolName:
          type: [string, "null"]
        paramsPreview:
          type: object
          maxProperties: 16
          additionalProperties: true
          description: 脱敏参数摘要；仅审批详情（assignee）返回；不返回完整参数、提示词、凭据或文档正文。运行详情对非 assignee 省略该字段。
        planSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        requestedBy:
          type: string
          format: uuid
        decidedBy:
          type: [string, "null"]
          format: uuid
        decidedAt:
          type: [string, "null"]
          format: date-time
        decisionComment:
          type: [string, "null"]
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    WorkflowApprovalDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowApproval"
        - type: object
          properties:
            selfApprovalBlocked:
              type: boolean
              description: 当前用户是运行发起人时为 true；界面不提供入口，直接调用 403。
            documentReferenceCount:
              type: integer
              minimum: 0
              description: 审批涉及的引用数量；正文按审批人 ACL 最小可见。
    WorkflowApprovalPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowApproval"
    WorkflowTemplate:
      type: object
      required: [id, name, scenario, source, visibility, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scenario:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
        source:
          $ref: "#/components/schemas/WorkflowTemplateSource"
        visibility:
          $ref: "#/components/schemas/WorkflowTemplateVisibility"
        ownerUserId:
          type: [string, "null"]
          format: uuid
        builtInVersion:
          type: [integer, "null"]
          minimum: 1
        latestBuiltInVersion:
          type: [integer, "null"]
          minimum: 1
        upgradeAvailable:
          type: boolean
          description: M06b 升级提示；M06 恒为 false。
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkflowTemplatePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowTemplate"
    WorkflowRuntimeLimits:
      type: object
      required:
        [
          featureEnabled,
          maxNodes,
          maxSteps,
          nodeTimeoutSeconds,
          runTimeoutSeconds,
          tenantConcurrency,
          workflowConcurrency,
          resultMaxBytes,
          retentionDays,
          retentionPolicy,
          generatedAt,
        ]
      properties:
        featureEnabled:
          type: boolean
        disabledReason:
          type: [string, "null"]
          maxLength: 200
          description: 来自 `RICCON_WORKFLOW_DISABLED_REASON`；未配置时返回固定文案。
        maxNodes:
          type: integer
          minimum: 1
        maxSteps:
          type: integer
          minimum: 1
        nodeTimeoutSeconds:
          type: object
          required: [model, retrieval, mcp]
          properties:
            model:
              type: integer
              minimum: 1
            retrieval:
              type: integer
              minimum: 1
            mcp:
              type: integer
              minimum: 1
          additionalProperties: false
        runTimeoutSeconds:
          type: integer
          minimum: 1
        tenantConcurrency:
          type: integer
          minimum: 1
        workflowConcurrency:
          type: integer
          minimum: 1
        resultMaxBytes:
          type: integer
          minimum: 1
          description: 单次运行结果上限（默认 5 MiB）；服务端预检 `max_allowed_packet`/JDBC `maxAllowedPacket` ≥8 MiB。
        retentionDays:
          type: integer
          minimum: 1
        retentionPolicy:
          $ref: "#/components/schemas/WorkflowRetentionPolicy"
        generatedAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkflowValidationIssue:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/WorkflowValidationCode"
        nodeId:
          type: [string, "null"]
        field:
          type: [string, "null"]
        message:
          type: string
          maxLength: 500
      additionalProperties: false
    WorkflowValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowValidationIssue"
      additionalProperties: false
    WorkflowCreateRequest:
      type: object
      anyOf:
        - required: [name]
        - required: [templateId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 1000
        templateId:
          type: [string, "null"]
          format: uuid
      additionalProperties: false
    WorkflowDraftUpdateRequest:
      type: object
      required: [version, graph]
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 1000
        graph:
          $ref: "#/components/schemas/WorkflowGraph"
      additionalProperties: false
    WorkflowDuplicateRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
      additionalProperties: false
    WorkflowPublishRequest:
      type: object
      required: [runScope]
      properties:
        runScope:
          $ref: "#/components/schemas/WorkflowRunScope"
        departmentId:
          type: [string, "null"]
          format: uuid
          description: "`runScope=DEPARTMENT` 必填；必须是发布人当前负责的启用部门。"
      additionalProperties: false
    WorkflowTransferRequest:
      type: object
      required: [ownerUserId]
      properties:
        ownerUserId:
          type: string
          format: uuid
      additionalProperties: false
    WorkflowRunCreateRequest:
      type: object
      required: [inputs]
      properties:
        versionId:
          type: [string, "null"]
          format: uuid
          description: 默认最近发布版本；必须是该流程已发布版本。
        inputs:
          type: object
          maxProperties: 16
          additionalProperties: true
          description: 运行输入；≤64 KiB，键/长度服务端校验。
      additionalProperties: false
    WorkflowRetryRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
      additionalProperties: false
    WorkflowApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/WorkflowApprovalDecision"
        comment:
          type: [string, "null"]
          maxLength: 500
          description: 拒绝时必填（minLength 1）；进入审批记录与审计（≤500 字符）。
      additionalProperties: false
      allOf:
        - if:
            properties:
              decision:
                const: REJECT
            required: [decision]
          then:
            required: [comment]
            properties:
              comment:
                type: string
                minLength: 1
                maxLength: 500
    WorkflowTemplateCopyRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
      additionalProperties: false
    McpServer:
      type: object
      required: [id, code, name, transport, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        transport:
          type: string
          enum: [HTTP, STDIO]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
      additionalProperties: false
    McpServerPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/McpServer"
    McpTool:
      type: object
      required: [id, name, riskLevel, requiresApproval, status]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        riskLevel:
          $ref: "#/components/schemas/McpToolRisk"
        requiresApproval:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DISABLED]
      additionalProperties: false
    McpToolPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/McpTool"
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"
    UserCreateRequest:
      type: object
      required: [username, displayName, roles]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        authSource:
          $ref: "#/components/schemas/AuthSource"
        password:
          type: [string, "null"]
          minLength: 12
          maxLength: 200
          format: password
          description: authSource=LOCAL（或省略）时必填；OIDC 时必须为空
        issuer:
          type: [string, "null"]
          format: uri
          maxLength: 255
          description: authSource=OIDC 时必填；必须等于本租户配置的 issuer
        subject:
          type: [string, "null"]
          maxLength: 255
          description: authSource=OIDC 时必填
        roles:
          type: array
          minItems: 1
          items:
            type: string
      additionalProperties: false
      description: |
        `authSource` 省略视为 `LOCAL`。LOCAL 必须提供 `password`；OIDC 必须提供 `issuer` + `subject` 且不得提供 `password`。
      if:
        properties:
          authSource:
            const: OIDC
        required: [authSource]
      then:
        required: [issuer, subject]
        properties:
          password:
            type: "null"
      else:
        required: [password]
        properties:
          password:
            type: string
            minLength: 12
            maxLength: 200
            format: password
    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/UserStatus"
      additionalProperties: false
    UserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
      additionalProperties: false
    TenantCreateRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          description: 租户代码，创建后不可修改；platform 为保留值。
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    TenantUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/TenantStatus"
        retentionDays:
          type: integer
          minimum: 30
          maximum: 3650
      additionalProperties: false
    TenantPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TenantSummary"
