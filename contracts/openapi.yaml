        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/audit-exports:
    get:
      tags: [Audit]
      operationId: listAuditExports
      summary: 列出本租户审计导出请求
      description: |
        只返回本租户导出请求元数据；按 `createdAt` 倒序。`status=EXPIRED` 是派生过滤
        （`status=APPROVED` 且 `expiresAt < now`）。平台租户自身导出在 M10 不支持，返回 403 `RICCON-AUDIT-403`。
      x-riccon-permission: audit.read
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditExportStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 导出请求分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Audit]
      operationId: createAuditExportRequest
      summary: 发起审计导出申请
      description: |
        服务端按 `filter` 计算预计行数；超过导出上限返回 400。申请进入 `PENDING_APPROVAL`，不立即生成文件。
        申请人不得审批自己的请求；批准后按 TTL（默认 24 小时）过期。平台租户自身导出在 M10 不支持，返回 403 `RICCON-AUDIT-403`。
        重复申请不返回 409；每次申请生成新 ID。
      x-riccon-permission: audit.read
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportCreateRequest"
      responses:
        "201":
          description: 已提交申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/audit-exports/{exportId}:
    get:
      tags: [Audit]
      operationId: getAuditExportRequest
      summary: 读取审计导出请求
      description: 平台租户自身导出在 M10 不支持，返回 403 `RICCON-AUDIT-403`。
      x-riccon-permission: audit.read
      parameters:
        - $ref: "#/components/parameters/AuditExportId"
      responses:
        "200":
          description: 导出请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/audit-exports/{exportId}/decision:
    post:
      tags: [Audit]
      operationId: decideAuditExportRequest
      summary: 审批审计导出请求
      description: |
        同租户审批；审批人不得是申请人（403）。只允许从 `PENDING_APPROVAL` 条件更新，已决定或并发审批返回 409。
        批准后写审批审计并设置 `expiresAt`。
      x-riccon-permission: audit.export.approve
      parameters:
        - $ref: "#/components/parameters/AuditExportId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportDecisionRequest"
      responses:
        "200":
          description: 已审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/audit-exports/{exportId}/download:
    get:
      tags: [Audit]
      operationId: downloadAuditExport
      summary: 下载审计导出 CSV
      description: |
        平台租户自身导出在 M10 不支持（403）；平台管理员调用租户路径按 404 处理，避免存在性泄露。
        只有申请人本人可下载；必须已批准且未过期。CSV 为 UTF-8 BOM，前 4 行为 `#` 前缀元数据
        （exportId、generatedAt、filters、rowCount），随后是表头与数据。不落盘、无预签名 URL。
        字段白名单不含 `source_ip`、token、凭据、原文或邮箱；每次成功下载写 `data.exported`。
      x-riccon-permission: audit.read
      parameters:
        - $ref: "#/components/parameters/AuditExportId"
      responses:
        "200":
          description: CSV 文件流
          headers:
            Content-Disposition:
              description: attachment; filename="audit-export-{exportId}.csv"
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
