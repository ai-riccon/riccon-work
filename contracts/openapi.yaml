    get:
      tags: [Audit]
      operationId: getAuditPolicy
      summary: 获取审计保留与导出策略
      description: 返回保留天数、最大可查范围、分页上限、已知动作列表与导出限制；界面据此显示保留策略与可查范围。
      x-riccon-permission: audit.read
      responses:
