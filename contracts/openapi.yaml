          type: string
        transport:
          type: string
          enum: [HTTP, STDIO]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
      additionalProperties: false
    McpServerPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/McpServer"
    McpTool:
      type: object
      required: [id, name, riskLevel, requiresApproval, status]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        riskLevel:
          $ref: "#/components/schemas/McpToolRisk"
        requiresApproval:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DISABLED]
      additionalProperties: false
    McpToolPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/McpTool"
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"
    UserCreateRequest:
      type: object
      required: [username, displayName, roles]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        authSource:
          $ref: "#/components/schemas/AuthSource"
        password:
          type: [string, "null"]
          minLength: 12
          maxLength: 200
          format: password
          description: authSource=LOCAL（或省略）时必填；OIDC 时必须为空
        issuer:
          type: [string, "null"]
          format: uri
          maxLength: 255
          description: authSource=OIDC 时必填；必须等于本租户配置的 issuer
        subject:
          type: [string, "null"]
          maxLength: 255
          description: authSource=OIDC 时必填
        roles:
          type: array
          minItems: 1
          items:
            type: string
      additionalProperties: false
      description: |
        `authSource` 省略视为 `LOCAL`。LOCAL 必须提供 `password`；OIDC 必须提供 `issuer` + `subject` 且不得提供 `password`。
      if:
        properties:
          authSource:
            const: OIDC
        required: [authSource]
      then:
        required: [issuer, subject]
        properties:
          password:
            type: "null"
      else:
        required: [password]
        properties:
          password:
            type: string
            minLength: 12
            maxLength: 200
            format: password
    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/UserStatus"
      additionalProperties: false
    UserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
      additionalProperties: false
    TenantCreateRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          description: 租户代码，创建后不可修改；platform 为保留值。
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    TenantUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/TenantStatus"
        retentionDays:
          type: integer
          minimum: 30
          maximum: 3650
      additionalProperties: false
    TenantPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TenantSummary"
