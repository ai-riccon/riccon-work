openapi: 3.1.0
info:
  title: Riccon Internal Worker API
  version: 1.0.0-m02
  description: |
    仅集群内部可达的 API → Worker 契约。浏览器、租户网络和公网不得访问本文件定义的端点。

    ## 服务身份
    - API 使用 HMAC-SHA256 签名的短期令牌，头名 `X-Riccon-Service-Token`，声明至少包含：
      `iss=riccon-api`、`aud=riccon-worker`、`sub=user:<userId>`、`tenantId`、`runId`、`scope=agent:run`、`iat`、`exp`（≤300 秒）、`jti`。
    - Worker 校验签名、`aud`、`exp`、`scope`，并强制 `tenantId == agent_run.tenant_id`；
      跨租户运行统一返回 404，并写 `outcome=denied` 审计（TEN-014/TEN-017、ADR-0014 澄清）。
    - Worker 只接受该令牌，不接受浏览器 Cookie；除健康检查与内部端点外默认拒绝。

    ## 错误语义（与 Worker 实现对齐）
    - `401 Unauthorized`：令牌缺失、格式错误、签名/签发者/受众/有效期/scope 不合法，或令牌绑定的
      `runId` 与路径/请求体不一致。统一 `RICCON-AUTH-401`，不区分具体原因，避免探测。
    - `400 Bad Request`：请求体 schema 非法、`X-Trace-Id` 缺失/超长、取消原因不在枚举内，或请求体
      `tenantId` 与令牌 `tenantId` 不一致。租户以令牌为准，请求体字段只用于冗余核对。
    - `403 Forbidden`：令牌有效且绑定当前 run，但同一租户内的主体/运行绑定校验失败：`sub` 与请求体
      `userId` 不一致、run kind 不是 `CHAT`、run 的 conversation/user 与请求不一致、运行发起人已禁用。
    - `404 Not Found`：运行、会话或用户消息在令牌租户内不可见；**包括 run 属于其他租户**。统一
      `RICCON-TENANT-404`，不区分“不存在”与“属于其他租户”，防止存在性泄露（ADR-0014、TM-07）。
    - 跨租户 run 不得返回 403：403 会向调用方确认“该 run 存在但属于其他租户”。需要拒绝跨租户时，
      必须用租户作用域查询自然得到 404，并写拒绝审计。

    ## 流式
    对话使用 SSE。事件载荷见 `contracts/events/sse/chat-event.v1.schema.json`；
    Worker 不直接面向浏览器，API 负责转发并维持租户、trace 与错误映射。

    ## 超时与取消
    - 首字前失败返回 `application/problem+json`，不发送半截回答。
    - 首字后失败发送 `riccon.chat.failed.v1` 并结束流；已生成内容由 API 保留。
    - 客户端断开或员工停止时，API 取消上游请求；Worker 在下一个检查点终止模型调用。
  contact:
    name: Riccon 架构组
  license:
    name: Proprietary
    identifier: LicenseRef-Riccon-Proprietary
servers:
  - url: http://worker:8081
    description: 仅集群内部地址；实际地址由部署配置注入。
security:
  - serviceToken: []
tags:
  - name: Internal
    description: API → Worker 内部调用
paths:
  /internal/v1/chat/streams:
    post:
      tags: [Internal]
      operationId: streamChat
      summary: 执行一次对话流
      description: |
        API 先持久化用户消息与 `agent_run`，再调用本端点。Worker 读取会话历史、文件分块与知识库检索结果，
        调用模型并流式返回增量；引用事件必须引用真实检索结果，不得编造。
      parameters:
        - $ref: "#/components/parameters/ServiceToken"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStreamRequest"
      responses:
        "200":
          description: SSE 事件流
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 必须为 no-store
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
                description: 每帧 `event:` 为 chat 事件类型，`data:` 为 chat-event.v1 JSON。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /internal/v1/runs/{runId}/cancel:
    post:
      tags: [Internal]
      operationId: cancelRun
      summary: 取消运行
      description: 幂等；已生成内容保留，运行进入 CANCELLED。取消优先于后续阶段。
      parameters:
        - $ref: "#/components/parameters/ServiceToken"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
      responses:
        "202":
          description: 已请求取消
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Riccon-Service-Token
      description: HMAC-SHA256 短期服务令牌；Worker 校验签名、aud、exp、scope、tenantId 与 runId。
  parameters:
    ServiceToken:
      name: X-Riccon-Service-Token
      in: header
      required: true
      schema:
        type: string
    TraceId:
      name: X-Trace-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    TraceId:
      description: 贯穿 API、Worker、日志与审计的 traceId。
      schema:
        type: string
        maxLength: 64
  responses:
    BadRequest:
      description: 请求体 schema 非法、trace 头缺失/超长、取消原因不合法，或请求体 tenantId 与令牌租户不一致
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: 服务令牌缺失、格式/签名/签发者/受众/有效期/scope 不合法，或令牌 runId 绑定与请求不一致
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: 令牌有效且绑定当前 run，但同一租户内的主体/运行绑定校验失败；跨租户 run 不使用本响应
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: 运行、会话或用户消息在令牌租户内不可见；跨租户 run 同样返回 404，避免存在性泄露
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: 运行已处于终态或重复取消
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Worker 并发已满，API 应快速失败并返回 429 给员工
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Worker 内部错误；不返回堆栈、提示词或凭据
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          pattern: "^RICCON-[A-Z]+-[0-9]{3}$"
        traceId:
          type: string
          maxLength: 64
        tenantId:
          type: [string, "null"]
      additionalProperties: false
    ChatStreamRequest:
      type: object
      required: [runId, tenantId, userId, conversationId, userMessageId]
      properties:
        runId:
          type: string
          format: uuid
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
        userId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        userMessageId:
          type: string
          format: uuid
        fileIds:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
      additionalProperties: false
    CancelRunRequest:
      type: object
      properties:
        reason:
          type: string
          enum: [USER_CANCELLED, CLIENT_DISCONNECT, PERMISSION_REVOKED]
      additionalProperties: false
