# Riccon 测试栈（合同 commands.sandbox）。
#
# 仅用于本地与 CI 的测试/演示，不是生产编排：
# - 所有端口绑定 127.0.0.1，且使用非默认端口，避免与宿主已有服务冲突；
# - 凭据是测试占位值，可通过环境变量覆盖，禁止写入真实密钥；
# - 对象存储使用 RustFS（S3 兼容）。MinIO 官方镜像已停止公开发布，替换理由见
#   docs/adr/ADR-0002-test-object-storage-rustfs.md。
name: riccon-test

services:
  mysql:
    image: mysql:8.4.13
    container_name: riccon-test-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # MySQL 8.4 默认开启 binlog；V6 的审计触发器由非 SUPER 的 riccon 用户创建，
      # 没有该参数会报 ERROR 1419。仅测试栈放宽，生产迁移账号权限由 M09 决定，
      # 不得把本参数当成生产配置抄走。
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: riccon
      MYSQL_USER: riccon
      MYSQL_PASSWORD: ${RICCON_DB_PASSWORD:-riccon_test_only}
      MYSQL_ROOT_PASSWORD: ${RICCON_DB_ROOT_PASSWORD:-riccon_root_test_only}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - riccon-test-net

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: riccon-test-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19200:9200"
      - "127.0.0.1:19600:9600"
    volumes:
      - opensearch-test-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - riccon-test-net

  object-storage:
    image: rustfs/rustfs:1.0.6
    container_name: riccon-test-object-storage
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RICCON_S3_ACCESS_KEY:-riccon_test_only}
      RUSTFS_SECRET_KEY: ${RICCON_S3_SECRET_KEY:-riccon_test_only_secret}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - object-storage-test-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - riccon-test-net

  # M05b 连接器出网演练探针（O2a）。默认不启动，只在 --profile connector-egress 时运行。
  # 只接入 internal 网络，用于证明“连接器容器默认零出网”：无默认路由、外部地址与云元数据地址不可达。
  # 真实出网拒绝由 B6 的 allowlist 校验（SEC-CONN-003）与 M09 的 K8s NetworkPolicy 承担；
  # 本探针只验证网络底座，不代替代码级校验，也不接入 MySQL/OpenSearch/RustFS。
  connector-egress-probe:
    image: mysql:8.4.13
    profiles:
      - connector-egress
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -u
        fail=0
        echo "== connector egress probe (internal network) =="
        echo "-- /proc/net/route --"
        cat /proc/net/route
        if awk 'NR > 1 && $2 == "00000000" { found = 1 } END { exit(found ? 0 : 1) }' /proc/net/route; then
          echo "FAIL: 存在默认路由，internal 网络未生效"
          fail=1
        else
          echo "OK: 无默认路由（只剩 internal 网段路由）"
        fi
        if timeout 3 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443' 2>/dev/null; then
          echo "FAIL: 外部地址 1.1.1.1:443 可达"
          fail=1
        else
          echo "OK: 外部地址被拒绝"
        fi
        if timeout 3 bash -c 'exec 3<>/dev/tcp/169.254.169.254/80' 2>/dev/null; then
          echo "FAIL: 云元数据地址 169.254.169.254:80 可达"
          fail=1
        else
          echo "OK: 云元数据地址被拒绝"
        fi
        if [ "$$fail" -eq 0 ]; then
          echo "connector-egress-probe: PASS"
        else
          echo "connector-egress-probe: FAIL"
        fi
        exit "$$fail"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - riccon-connector-egress

volumes:
  mysql-test-data:
  opensearch-test-data:
  object-storage-test-data:

networks:
  riccon-test-net:
    driver: bridge
  # M05b 连接器出网隔离（O2a）：internal=true 表示没有默认路由、不出网，
  # 只能访问显式接入本网络的 peer。默认没有任何服务接入 → 连接器零出网。
  # 不要把 MySQL/OpenSearch/RustFS 接进来：它们是依赖服务，走 riccon-test-net。
  # 生产出网策略（K8s NetworkPolicy/防火墙）由 M09 落地，本网络只用于本地与 CI 演练。
  riccon-connector-egress:
    driver: bridge
    internal: true
